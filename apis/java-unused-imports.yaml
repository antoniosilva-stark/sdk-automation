# Ruido do sdk-java real: import que o arquivo DECLARA e NUNCA USA (so o nome aparece em comentario, Javadoc ou string).
# Nao e codigo escrito a mao: e import morto no real, que o gerador nao tem motivo para emitir. Fica fora de
# apis/java-handwritten.yaml de proposito, para nao se misturar com membro manuscrito, e o comparador o conta e o lista a
# parte (`dispensa de imports sem uso no real`, estado `sem gaps (so ruido)`). Lida so por tools/compare-with-real.py
# (`make compare`); a geracao nao a le, e o comparador nunca a usa para medir similaridade. Medida no pin f60902a
# (sdk-java) e validada nos dois sentidos em tests/test_java_unused_imports.py: toda entrada e import do real cujo nome
# simples nao aparece em nenhum outro lugar do arquivo (sem comentario nem string), e todo import sem uso do real que o
# gerador nao emite esta aqui.
#
# Recurso -> lista de dispensas (o recurso e o nome canonico de apis/schemas, com a caixa exata):
#   - kind: require (so este)
#     text: 'require ausente: import <fqcn>;' EXATO como o comparador o imprime; sem curinga nem static
#     count: opcional, default 1 (multiconjunto, como em java-handwritten.yaml)
#     reason: onde o import esta no real e que nunca e usado
#
# Regras:
#   - A dispensa nunca some: o relatorio a lista a parte, com a razao.
#   - Entrada obsoleta (consome menos que `count`, inclusive zero) faz `make compare` sair com 1: a lista so encolhe, e
#     quando o gerador passar a emitir o import por um motivo real a entrada sai daqui.
#   - Um import usado no real, ainda que so dentro de um membro manuscrito, e dispensa de java-handwritten.yaml, nao
#     daqui. Um mesmo gap nao tem dois donos: o mesmo texto nao entra nos dois arquivos.
#   - Event entra aqui so por `require`; nunca por outro tipo.

