info:
  title: Stark Bank API
  version: 0.1.0
  description: |
    Stark Bank API — SDK Automation POC
    Centralized OpenAPI specification for generating SDKs across 9 languages.

    **Version**: v0.1.0 (3 resources, 9 operations)
