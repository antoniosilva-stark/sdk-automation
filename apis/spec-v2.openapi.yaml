servers:
  - url: https://api.starkbank.com/v2
    description: Production
  - url: https://sandbox.api.starkbank.com/v2
    description: Sandbox

paths:
  # ============================================
  # Transaction Operations
  # ============================================
  /transaction:
    post:
      operationId: createTransaction
      tags:
        - Transactions
      summary: Create transactions
      description: Create a list of new transactions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/TransactionCreate'
      responses:
        '201':
          description: Transactions created successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Transaction'
        '400':
          description: Invalid request
        '401':
          description: Unauthorized
        '500':
          description: Server error

    get:
      operationId: queryTransaction
      tags:
        - Transactions
      summary: List transactions
      description: Retrieve a list of transactions with pagination
      parameters:
        - name: limit
          in: query
          description: Maximum number of results (default 100)
          schema:
            type: integer
            default: 100
            minimum: 1
            maximum: 1000
        - name: after
          in: query
          description: Cursor for pagination
          schema:
            type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  transactions:
                    type: array
                    items:
                      $ref: '#/components/schemas/Transaction'
        '401':
          description: Unauthorized
        '500':
          description: Server error

  /transaction/{id}:
    get:
      operationId: getTransaction
      tags:
        - Transactions
      summary: Get transaction
      description: Retrieve a single transaction by ID
      parameters:
        - name: id
          in: path
          required: true
          description: Transaction ID
          schema:
            type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transaction'
        '401':
          description: Unauthorized
        '404':
          description: Transaction not found
        '500':
          description: Server error

