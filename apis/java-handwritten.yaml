# Dispensa estreita e versionada dos membros que o sdk-java real ESCREVE A MAO: o corpo e logica que nao segue nenhum
# molde gerado (CRUD, create lista/objeto/mapa, get, query, page, log, pdf, parse padrao), mesmo quando o sdk-python tem
# o equivalente. Lida so por tools/compare-with-real.py (`make compare`); a geracao nao a le, e o comparador nunca a
# usa para medir similaridade. Medida no pin f60902a (sdk-java) e validada nos dois sentidos em tests/test_java_handwritten.py:
# todo membro existe no real e todo gap dispensado ainda e gap hoje.
#
# Recurso -> lista de dispensas (o recurso e o nome canonico de apis/schemas, com a caixa exata):
#   - kind: signature | field | constructor | require | inner
#     text: o texto EXATO do gap como o comparador o imprime (a mensagem inteira, ja com o prefixo
#           `signature ausente: ...`); sem padrao nem regex, um texto quase igual nao dispensa
#     count: opcional, default 1; quantas vezes o mesmo gap pode aparecer no recurso. Os gaps sao um multiconjunto:
#            cada entrada consome ate `count` (o contrato do comparador e plano: `public String confirmationMode;` do
#            MerchantSession e do Purchase tem o mesmo texto, e so o do Purchase e dispensado)
#     reason: o que no real o torna manuscrito (classe/metodo, o que faz, linhas no pin)
#
# Regras:
#   - O gap dispensado nunca some: o relatorio o lista a parte, com a razao, e o resumo conta separado os recursos
#     "sem gaps" dos "sem gaps (com dispensa)".
#   - Entrada obsoleta (consome menos que `count`, inclusive zero) faz `make compare` sair com 1: a lista so encolhe.
#     So vale para recurso comparado na corrida; `make compare ARGS=Recurso` nao cobra os demais.
#   - Nao entra: Event (sera gerado), nada que o gerador possa produzir (Page, Log padrao, pdf, get/query/CRUD padrao,
#     tipo, nome ou estilo), nem import sem uso no real. Um import so entra quando todo uso dele esta num membro dispensado.

