# fonte: starkbank/sdk-python@65fc3f8 · starkbank/dictkey/__dictkey.py
components:
  schemas:
    DictKey:
      type: object
      description: "DictKey represents a PIX key registered in Bacen's DICT system. An EVP (random) DictKey is automatically created for every new Workspace, since an active DICT key is required for the Invoice service to work."
      properties:
        id:
          type: string
          description: "DictKey object unique id. ex: \"tony@starkbank.com\", \"722.461.430-04\", \"20.018.183/0001-80\", \"+5511988887777\", \"b6295ee1-f054-47d1-9e90-ee57b74f60d9\""
          x-sdk-id: true
        type:
          type: string
          description: "DICT key type. ex: \"email\", \"cpf\", \"cnpj\", \"phone\" or \"evp\""
        name:
          type: string
          description: "key owner full name. ex: \"Tony Stark\""
        taxId:
          type: string
          description: "key owner tax ID (CNPJ or masked CPF). ex: \"***.345.678-**\" or \"20.018.183/0001-80\""
        ownerType:
          type: string
          description: "DICT key owner type. ex \"naturalPerson\" or \"legalPerson\""
        bankName:
          type: string
          description: "bank name associated with the DICT key. ex: \"Stark Bank\""
        ispb:
          type: string
          description: "bank ISPB associated with the DICT key. ex: \"20018183\""
        branchCode:
          type: string
          description: "encrypted bank account branch code associated with the DICT key. ex: \"ZW5jcnlwdGVkLWJyYW5jaC1jb2Rl\""
        accountNumber:
          type: string
          description: "encrypted bank account number associated with the DICT key. ex: \"ZW5jcnlwdGVkLWFjY291bnQtbnVtYmVy\""
        accountType:
          type: string
          description: "bank account type associated with the DICT key. ex: \"checking\", \"savings\", \"salary\" or \"payment\""
        status:
          type: string
          description: "current DICT key status. ex: \"created\", \"registered\", \"canceled\" or \"failed\""
      required:
        - type
        - name
        - taxId
        - ownerType
        - bankName
        - ispb
        - branchCode
        - accountNumber
        - accountType
        - status
      x-sdk-docs:
        get:
          summary: "Retrieve a specific DictKey"
          description:
            - "Receive a single DictKey object by its id. This includes keys you do not own, and can be used to check a key before creating a Transfer to it. Avoid looking up keys without following up with a transfer: Bacen blocks accounts that make too many standalone lookups in a short time, and invalid-key lookups count toward the block too. The returned encrypted branch_code/account_number can be passed straight into a Transfer without decrypting them."
          params:
            - name: "id"
              type: "string"
              description: "DictKey object unique id and PIX key itself. ex: \"tony@starkbank.com\", \"722.461.430-04\", \"20.018.183/0001-80\", \"+5511988887777\", \"b6295ee1-f054-47d1-9e90-ee57b74f60d9\""
              section: "required"
            - name: "user"
              type: "Organization/Project object, default None"
              description: "Organization or Project object. Not necessary if starkbank.user was set before function call"
              section: "optional"
          returns:
            - "DictKey object with updated attributes"
        query:
          summary: "Retrieve DictKeys"
          description:
            - "Receive a generator of DictKey objects associated with your Stark Bank Workspace"
          params:
            - name: "limit"
              type: "integer, default None"
              description: "maximum number of objects to be retrieved. Unlimited if None. ex: 35"
              section: "optional"
            - name: "type"
              type: "string, default None"
              description: "DictKey type. ex: \"cpf\", \"cnpj\", \"phone\", \"email\" or \"evp\""
              section: "optional"
            - name: "after"
              type: "datetime.date or string, default None"
              description: "date filter for objects created only after specified date. ex: datetime.date(2020, 3, 10)"
              section: "optional"
            - name: "before"
              type: "datetime.date or string, default None"
              description: "date filter for objects created only before specified date. ex: datetime.date(2020, 3, 10)"
              section: "optional"
            - name: "ids"
              type: "list of strings, default None"
              description: "list of ids to filter retrieved objects. ex: [\"5656565656565656\", \"4545454545454545\"]"
              section: "optional"
            - name: "status"
              type: "string, default None"
              description: "filter for status of retrieved objects. ex: \"success\""
              section: "optional"
            - name: "user"
              type: "Organization/Project object, default None"
              description: "Organization or Project object. Not necessary if starkbank.user was set before function call"
              section: "optional"
          returns:
            - "generator of DictKey objects with updated attributes"
        page:
          summary: "Retrieve paged DictKeys"
          description:
            - "Receive a list of up to 100 DictKey objects previously created in the Stark Bank API and the cursor to the next page."
            - "Use this function instead of query if you want to manually page your requests."
          params:
            - name: "cursor"
              type: "string, default None"
              description: "cursor returned on the previous page function call"
              section: "optional"
            - name: "limit"
              type: "integer, default 100"
              description: "maximum number of objects to be retrieved. It must be an integer between 1 and 100. ex: 50"
              section: "optional"
            - name: "type"
              type: "string, default None"
              description: "DictKey type. ex: \"cpf\", \"cnpj\", \"phone\", \"email\" or \"evp\""
              section: "optional"
            - name: "after"
              type: "datetime.date or string, default None"
              description: "date filter for objects created only after specified date. ex: datetime.date(2020, 3, 10)"
              section: "optional"
            - name: "before"
              type: "datetime.date or string, default None"
              description: "date filter for objects created only before specified date. ex: datetime.date(2020, 3, 10)"
              section: "optional"
            - name: "ids"
              type: "list of strings, default None"
              description: "list of ids to filter retrieved objects. ex: [\"5656565656565656\", \"4545454545454545\"]"
              section: "optional"
            - name: "status"
              type: "string, default None"
              description: "filter for status of retrieved objects. ex: \"success\""
              section: "optional"
            - name: "user"
              type: "Organization/Project object, default None"
              description: "Organization or Project object. Not necessary if starkbank.user was set before function call"
              section: "optional"
          returns:
            - "list of DictKey objects with updated attributes"
            - "cursor to retrieve the next page of DictKey objects"

    DictKeyCreate:
      type: object
      description: "DictKey creation request"
      properties:
        id:
          type: string
          description: "DictKey object unique id. ex: \"tony@starkbank.com\", \"722.461.430-04\", \"20.018.183/0001-80\", \"+5511988887777\", \"b6295ee1-f054-47d1-9e90-ee57b74f60d9\""
