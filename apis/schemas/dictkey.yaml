# fonte: starkbank/sdk-python@9ef6834 · starkbank/dictkey/__dictkey.py
components:
  schemas:
    DictKey:
      type: object
      description: "DictKey represents a PIX key registered in Bacen's DICT system."
      properties:
        id:
          type: string
          description: "DictKey object unique id. ex: \"tony@starkbank.com\", \"722.461.430-04\", \"20.018.183/0001-80\", \"+5511988887777\", \"b6295ee1-f054-47d1-9e90-ee57b74f60d9\""
        type:
          type: string
          description: "DICT key type. ex: \"email\", \"cpf\", \"cnpj\", \"phone\" or \"evp\""
        name:
          type: string
          description: "key owner full name. ex: \"Tony Stark\""
        taxId:
          type: string
          description: "key owner tax ID (CNPJ or masked CPF). ex: \"***.345.678-**\" or \"20.018.183/0001-80\""
        ownerType:
          type: string
          description: "DICT key owner type. ex \"naturalPerson\" or \"legalPerson\""
        bankName:
          type: string
          description: "bank name associated with the DICT key. ex: \"Stark Bank\""
        ispb:
          type: string
          description: "bank ISPB associated with the DICT key. ex: \"20018183\""
        branchCode:
          type: string
          description: "encrypted bank account branch code associated with the DICT key. ex: \"ZW5jcnlwdGVkLWJyYW5jaC1jb2Rl\""
        accountNumber:
          type: string
          description: "encrypted bank account number associated with the DICT key. ex: \"ZW5jcnlwdGVkLWFjY291bnQtbnVtYmVy\""
        accountType:
          type: string
          description: "bank account type associated with the DICT key. ex: \"checking\", \"savings\", \"salary\" or \"payment\""
        status:
          type: string
          description: "current DICT key status. ex: \"created\", \"registered\", \"canceled\" or \"failed\""
      required:
        - type
        - name
        - taxId
        - ownerType
        - bankName
        - ispb
        - branchCode
        - accountNumber
        - accountType
        - status

    DictKeyCreate:
      type: object
      description: "DictKey creation request"
      properties:
        id:
          type: string
          description: "DictKey object unique id. ex: \"tony@starkbank.com\", \"722.461.430-04\", \"20.018.183/0001-80\", \"+5511988887777\", \"b6295ee1-f054-47d1-9e90-ee57b74f60d9\""
