# fonte: starkbank/sdk-python@65fc3f8 · starkbank/dynamicbrcode/__dynamicbrcode.py
components:
  schemas:
    DynamicBrcode:
      type: object
      description: "When you initialize a DynamicBrcode, the entity will not be automatically sent to the Stark Bank API. The 'create' function sends the objects to the Stark Bank API and returns the list of created objects. When a Dynamic Brcode is paid, a Deposit is created with a tag containing \"dynamic-brcode/{uuid}\" for conciliation."
      properties:
        amount:
          type: integer
          format: int64
          description: "amount in cents to be received. ex: 100 (= R$ 1.00)"
        expiration:
          type: integer
          description: "time interval in seconds counted from creation until the brcode expires. After expiration, the brcode cannot be paid anymore."
        displayDescription:
          type: string
          description: "description shown in the payer's bank interface. ex: \"Payment for service #1234\""
        rules:
          type: array
          items:
            type: object
          description: "list of DynamicBrcode.Rule objects for modifying brcode behavior."
        tags:
          type: array
          items:
            type: string
          description: "list of strings for tagging. All tags will be converted to lowercase."
        pictureUrl:
          type: string
          description: "public QR Code image URL."
      required:
        - amount
        - pictureUrl
      x-sdk-docs:
        create:
          summary: "Create DynamicBrcodes"
          description:
            - "Send a list of DynamicBrcode objects for creation in the Stark Bank API"
          params:
            - name: "brcodes"
              type: "list of DynamicBrcode objects"
              description: "list of DynamicBrcode objects to be created in the API"
              section: "required"
            - name: "user"
              type: "Organization/Project object, default None"
              description: "Organization or Project object. Not necessary if starkbank.user was set before function call"
              section: "optional"
          returns:
            - "list of DynamicBrcode objects with updated attributes"
        get:
          summary: "Retrieve a specific DynamicBrcode"
          description:
            - "Receive a single DynamicBrcode object previously created in the Stark Bank API by its uuid"
          params:
            - name: "uuid"
              type: "string"
              description: "object's unique uuid. ex: \"901e71f2447c43c886f58366a5432c4b\""
              section: "required"
            - name: "user"
              type: "Organization/Project object, default None"
              description: "Organization or Project object. Not necessary if starkbank.user was set before function call"
              section: "optional"
          returns:
            - "DynamicBrcode object with updated attributes"
        query:
          summary: "Retrieve DynamicBrcodes"
          description:
            - "Receive a generator of DynamicBrcode objects previously created by this user in the Stark Bank API"
          params:
            - name: "limit"
              type: "integer, default None"
              description: "maximum number of objects to be retrieved. Unlimited if None. ex: 35"
              section: "optional"
            - name: "after"
              type: "datetime.date or string, default None"
              description: "date filter for objects created or updated only after specified date. ex: datetime.date(2020, 3, 10)"
              section: "optional"
            - name: "before"
              type: "datetime.date or string, default None"
              description: "date filter for objects created or updated only before specified date. ex: datetime.date(2020, 3, 10)"
              section: "optional"
            - name: "tags"
              type: "list of strings, default None"
              description: "tags to filter retrieved objects. ex: [\"tony\", \"stark\"]"
              section: "optional"
            - name: "uuids"
              type: "list of strings, default None"
              description: "list of uuids to filter retrieved objects. ex: [\"901e71f2447c43c886f58366a5432c4b\", \"4e2eab725ddd495f9c98ffd97440702d\"]"
              section: "optional"
            - name: "user"
              type: "Organization/Project object, default None"
              description: "Organization or Project object. Not necessary if starkbank.user was set before function call"
              section: "optional"
          returns:
            - "generator of DynamicBrcode objects with updated attributes"
        page:
          summary: "Retrieve paged DynamicBrcodes"
          description:
            - "Receive a list of up to 100 DynamicBrcode objects previously created in the Stark Bank API and the cursor to the next page."
            - "Use this function instead of query if you want to manually page your brcodes."
          params:
            - name: "cursor"
              type: "string, default None"
              description: "cursor returned on the previous page function call"
              section: "optional"
            - name: "limit"
              type: "integer, default 100"
              description: "maximum number of objects to be retrieved. It must be an integer between 1 and 100. ex: 50"
              section: "optional"
            - name: "after"
              type: "datetime.date or string, default None"
              description: "date filter for objects created or updated only after specified date. ex: datetime.date(2020, 3, 10)"
              section: "optional"
            - name: "before"
              type: "datetime.date or string, default None"
              description: "date filter for objects created or updated only before specified date. ex: datetime.date(2020, 3, 10)"
              section: "optional"
            - name: "tags"
              type: "list of strings, default None"
              description: "tags to filter retrieved objects. ex: [\"tony\", \"stark\"]"
              section: "optional"
            - name: "uuids"
              type: "list of strings, default None"
              description: "list of uuids to filter retrieved objects. ex: [\"901e71f2447c43c886f58366a5432c4b\", \"4e2eab725ddd495f9c98ffd97440702d\"]"
              section: "optional"
            - name: "user"
              type: "Organization/Project object, default None"
              description: "Organization or Project object. Not necessary if starkbank.user was set before function call"
              section: "optional"
          returns:
            - "list of DynamicBrcode objects with updated attributes"
            - "cursor to retrieve the next page of DynamicBrcode objects"

    DynamicBrcodeCreate:
      type: object
      description: "DynamicBrcode creation request"
      properties:
        amount:
          type: integer
          format: int64
          description: "amount in cents to be received. ex: 100 (= R$ 1.00)"
        expiration:
          type: integer
          description: "time interval in seconds counted from creation until the brcode expires. After expiration, the brcode cannot be paid anymore."
        displayDescription:
          type: string
          description: "description shown in the payer's bank interface. ex: \"Payment for service #1234\""
        rules:
          type: array
          items:
            type: object
          description: "list of DynamicBrcode.Rule objects for modifying brcode behavior."
        tags:
          type: array
          items:
            type: string
          description: "list of strings for tagging. All tags will be converted to lowercase."
      required:
        - amount
