components:
  schemas:
    Invoice:
      type: object
      description: "When you initialize an Invoice, the entity will not be automatically sent to the Stark Bank API. The 'create' function sends the objects to the Stark Bank API and returns the list of created objects. To create scheduled Invoices, which will display the discount, interest, etc. on the final users banking interface, use dates instead of datetimes on the \"due\" and \"discounts\" fields."
      properties:
        id:
          type: string
          description: "unique id returned when Invoice is created. ex: \"5656565656565656\""
        amount:
          type: integer
          format: int64
          description: "Invoice value in cents. Minimum = 0 (any value will be accepted). ex: 1234 (= R$ 12.34)"
        taxId:
          type: string
          description: "payer tax ID (CPF or CNPJ) with or without formatting. ex: \"01234567890\" or \"20.018.183/0001-80\""
        name:
          type: string
          description: "payer name. ex: \"Iron Bank S.A.\""
        due:
          type: string
          format: date-time
          description: "Invoice due date in UTC ISO format. ex: \"2020-10-28T17:59:26.249976+00:00\" for immediate invoices and \"2020-10-28\" for scheduled invoices"
        expiration:
          type: integer
          description: "time interval in seconds between due date and expiration date. ex 123456789"
        fine:
          type: number
          description: "Invoice fine for overdue payment in %. ex: 2.5"
        interest:
          type: number
          description: "Invoice monthly interest for overdue payment in %. ex: 5.2"
        discounts:
          type: array
          items:
            type: object
          description: "list of dictionaries with \"percentage\":float and \"due\":datetime.datetime or string pairs"
        rules:
          type: array
          items:
            type: object
          description: "list of Invoice.Rule objects for modifying invoice behavior. ex: [Invoice.Rule(key=\"allowedTaxIds\", value=[ \"012.345.678-90\", \"45.059.493/0001-73\" ])]"
        splits:
          type: array
          items:
            type: object
          description: "list of Split.Splits objects to indicate payment receivers. ex: [Invoice.Split(amount=141, receiverId=\"5706627130851328\")]"
        tags:
          type: array
          items:
            type: string
          description: "list of strings for tagging"
        descriptions:
          type: array
          items:
            type: object
          description: "list of dictionaries with \"key\":string and (optional) \"value\":string pairs"
        pdf:
          type: string
          description: "public Invoice PDF URL. ex: \"https://invoice.starkbank.com/pdf/d454fa4e524441c1b0c1a729457ed9d8\""
        link:
          type: string
          description: "public Invoice webpage URL. ex: \"https://my-workspace.sandbox.starkbank.com/invoicelink/d454fa4e524441c1b0c1a729457ed9d8\""
        nominalAmount:
          type: integer
          format: int64
          description: "Invoice emission value in cents (will change if invoice is updated, but not if it's paid). ex: 400000"
        fineAmount:
          type: integer
          format: int64
          description: "Invoice fine value calculated over nominal_amount. ex: 20000"
        interestAmount:
          type: integer
          format: int64
          description: "Invoice interest value calculated over nominal_amount. ex: 10000"
        discountAmount:
          type: integer
          format: int64
          description: "Invoice discount value calculated over nominal_amount. ex: 3000"
        brcode:
          type: string
          description: "BR Code for the Invoice payment. ex: \"00020101021226800014br.gov.bcb.pix2558invoice.starkbank.com/f5333103-3279-4db2-8389-5efe335ba93d5204000053039865802BR5913Arya Stark6009Sao Paulo6220051656565656565656566304A9A0\""
        status:
          type: string
          description: "current Invoice status. ex: \"registered\" or \"paid\""
        fee:
          type: integer
          description: "fee charged by this Invoice. ex: 200 (= R$ 2.00)"
        transactionIds:
          type: array
          items:
            type: string
          description: "ledger transaction ids linked to this Invoice (if there are more than one, all but the first are reversals or failed reversal chargebacks). ex: [\"19827356981273\"]"
        created:
          type: string
          format: date-time
          description: "creation datetime for the Invoice. ex: datetime.datetime(2020, 3, 10, 10, 30, 0, 0)"
        updated:
          type: string
          format: date-time
          description: "latest update datetime for the Invoice. ex: datetime.datetime(2020, 3, 10, 10, 30, 0, 0)"
      required:
        - id
        - amount
        - taxId
        - name
        - pdf
        - link
        - nominalAmount
        - fineAmount
        - interestAmount
        - discountAmount
        - brcode
        - status
        - fee
        - transactionIds
        - created
        - updated

    InvoiceCreate:
      type: object
      description: "Invoice creation request"
      properties:
        amount:
          type: integer
          format: int64
          description: "Invoice value in cents. Minimum = 0 (any value will be accepted). ex: 1234 (= R$ 12.34)"
        taxId:
          type: string
          description: "payer tax ID (CPF or CNPJ) with or without formatting. ex: \"01234567890\" or \"20.018.183/0001-80\""
        name:
          type: string
          description: "payer name. ex: \"Iron Bank S.A.\""
        due:
          type: string
          format: date-time
          description: "Invoice due date in UTC ISO format. ex: \"2020-10-28T17:59:26.249976+00:00\" for immediate invoices and \"2020-10-28\" for scheduled invoices"
        expiration:
          type: integer
          description: "time interval in seconds between due date and expiration date. ex 123456789"
        fine:
          type: number
          description: "Invoice fine for overdue payment in %. ex: 2.5"
        interest:
          type: number
          description: "Invoice monthly interest for overdue payment in %. ex: 5.2"
        discounts:
          type: array
          items:
            type: object
          description: "list of dictionaries with \"percentage\":float and \"due\":datetime.datetime or string pairs"
        rules:
          type: array
          items:
            type: object
          description: "list of Invoice.Rule objects for modifying invoice behavior. ex: [Invoice.Rule(key=\"allowedTaxIds\", value=[ \"012.345.678-90\", \"45.059.493/0001-73\" ])]"
        splits:
          type: array
          items:
            type: object
          description: "list of Split.Splits objects to indicate payment receivers. ex: [Invoice.Split(amount=141, receiverId=\"5706627130851328\")]"
        tags:
          type: array
          items:
            type: string
          description: "list of strings for tagging"
        descriptions:
          type: array
          items:
            type: object
          description: "list of dictionaries with \"key\":string and (optional) \"value\":string pairs"
      required:
        - amount
        - taxId
        - name
