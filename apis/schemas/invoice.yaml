components:
  schemas:
    Invoice:
      type: object
      description: |
        Invoice is a billing document for payment collection.
        Create scheduled invoices using dates, or immediate invoices using datetimes.
      properties:
        id:
          type: string
          description: Unique invoice ID (generated by API)
        amount:
          type: integer
          description: "Amount in cents. Example: 1234 equals R$ 12.34"
        taxId:
          type: string
          description: Payer tax ID (CPF or CNPJ with or without formatting)
        name:
          type: string
          description: Payer name
        due:
          type: string
          format: date-time
          description: Invoice due date (ISO 8601)
        expiration:
          type: integer
          description: Time interval in seconds between due and expiration
        fine:
          type: number
          format: float
          description: Invoice fine for overdue payment in percentage
        interest:
          type: number
          format: float
          description: Invoice monthly interest for overdue in percentage
        status:
          type: string
          enum: [registered, paid, cancelled]
          description: Invoice status
        pdf:
          type: string
          format: uri
          description: Public PDF URL (return-only)
        brcode:
          type: string
          description: BR Code for PIX payment (return-only)
        createdAt:
          type: string
          format: date-time
          description: Creation timestamp (ISO 8601)
        tags:
          type: array
          items:
            type: string
          description: List of tags for reference
      required:
        - id
        - amount
        - taxId
        - name
        - status
        - createdAt

    InvoiceCreate:
      type: object
      description: Invoice creation request
      properties:
        amount:
          type: integer
          description: "Amount in cents. Example: 1234 equals R$ 12.34"
        taxId:
          type: string
          description: Payer tax ID (CPF or CNPJ)
        name:
          type: string
          description: Payer name
        due:
          type: string
          format: date-time
          description: Invoice due date (date or datetime)
        expiration:
          type: integer
          description: Expiration interval in seconds (default 5097600)
        fine:
          type: number
          format: float
          description: Fine percentage (default 2.0)
        interest:
          type: number
          format: float
          description: Interest percentage (default 1.0)
        tags:
          type: array
          items:
            type: string
          description: Optional tags for reference
      required:
        - amount
        - taxId
        - name