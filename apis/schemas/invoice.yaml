# fonte: starkbank/sdk-python@65fc3f8 · starkbank/invoice/__invoice.py
components:
  schemas:
    Invoice:
      type: object
      description: "When you initialize an Invoice, the entity will not be automatically sent to the Stark Bank API. The 'create' function sends the objects to the Stark Bank API and returns the list of created objects. To create scheduled Invoices, which will display the discount, interest, etc. on the final users banking interface, use dates instead of datetimes on the \"due\" and \"discounts\" fields."
      properties:
        amount:
          type: integer
          format: int64
          description: "Invoice value in cents. Minimum = 0 (any value will be accepted). ex: 1234 (= R$ 12.34). If amount = 0, the Invoice will accept any amount paid by the customer; otherwise, only the exact amount will be accepted. When paid, this attribute is updated with the amount actually paid."
        taxId:
          type: string
          description: "payer tax ID (CPF or CNPJ) with or without formatting. ex: \"01234567890\" or \"20.018.183/0001-80\""
        name:
          type: string
          description: "payer name. ex: \"Iron Bank S.A.\""
        due:
          type: string
          format: date-time
          description: "Invoice due date in UTC ISO format. ex: \"2020-10-28T17:59:26.249976+00:00\" for immediate invoices and \"2020-10-28\" for scheduled invoices"
        expiration:
          type: integer
          description: "time interval in seconds between due date and expiration date. After the expiration, the Invoice can no longer be paid. ex 123456789"
        fine:
          type: number
          format: float
          description: "Invoice fine for overdue payment in %. ex: 2.5"
        interest:
          type: number
          format: float
          description: "Invoice monthly interest for overdue payment in %. ex: 5.2"
        discounts:
          type: array
          items:
            type: object
          description: "list of up to 5 dictionaries with \"percentage\":float and \"due\":datetime.datetime or string pairs"
        rules:
          type: array
          items:
            type: object
          description: "list of Invoice.Rule objects for modifying invoice behavior. ex: [Invoice.Rule(key=\"allowedTaxIds\", value=[ \"012.345.678-90\", \"45.059.493/0001-73\" ])]"
        splits:
          type: array
          items:
            type: object
          description: "list of Split.Splits objects to indicate payment receivers. ex: [Invoice.Split(amount=141, receiverId=\"5706627130851328\")]"
        tags:
          type: array
          items:
            type: string
          description: "list of strings for tagging. All tags will be converted to lowercase."
        descriptions:
          type: array
          items:
            type: object
          description: "list of up to 15 dictionaries with \"key\":string and (optional) \"value\":string pairs"
        pdf:
          type: string
          format: uri
          description: "public Invoice PDF URL. ex: \"https://invoice.starkbank.com/pdf/d454fa4e524441c1b0c1a729457ed9d8\""
        link:
          type: string
          format: uri
          description: "public Invoice webpage URL. ex: \"https://my-workspace.sandbox.starkbank.com/invoicelink/d454fa4e524441c1b0c1a729457ed9d8\""
        nominalAmount:
          type: integer
          format: int64
          description: "Invoice emission value in cents (will change if invoice is updated, but not if it's paid). ex: 400000"
        fineAmount:
          type: integer
          format: int64
          description: "Invoice fine value calculated over nominal_amount. ex: 20000"
        interestAmount:
          type: integer
          format: int64
          description: "Invoice interest value calculated over nominal_amount. ex: 10000"
        discountAmount:
          type: integer
          format: int64
          description: "Invoice discount value calculated over nominal_amount. ex: 3000"
        id:
          type: string
          description: "unique id returned when Invoice is created. ex: \"5656565656565656\""
          x-sdk-id: true
        brcode:
          type: string
          description: "BR Code for the Invoice payment. ex: \"00020101021226800014br.gov.bcb.pix2558invoice.starkbank.com/f5333103-3279-4db2-8389-5efe335ba93d5204000053039865802BR5913Arya Stark6009Sao Paulo6220051656565656565656566304A9A0\""
        status:
          type: string
          description: "current Invoice status. ex: \"registered\" or \"paid\""
        fee:
          type: integer
          description: "fee charged by this Invoice. ex: 200 (= R$ 2.00)"
        transactionIds:
          type: array
          items:
            type: string
          description: "ledger transaction ids linked to this Invoice (if there are more than one, all but the first are reversals or failed reversal chargebacks). ex: [\"19827356981273\"]"
        created:
          type: string
          format: date-time
          description: "creation datetime for the Invoice. ex: datetime.datetime(2020, 3, 10, 10, 30, 0, 0)"
        updated:
          type: string
          format: date-time
          description: "latest update datetime for the Invoice. ex: datetime.datetime(2020, 3, 10, 10, 30, 0, 0)"
      required:
        - amount
        - taxId
        - name
        - pdf
        - link
        - nominalAmount
        - fineAmount
        - interestAmount
        - discountAmount
        - id
        - brcode
        - status
        - fee
        - transactionIds
        - created
        - updated
      x-sdk-docs:
        create:
          summary: "Create Invoices"
          description:
            - "Send a list of Invoice objects for creation in the Stark Bank API. You can create up to 100 Invoices per call."
          params:
            - name: "invoices"
              type: "list of Invoice objects"
              description: "list of Invoice objects to be created in the API"
              section: "required"
            - name: "user"
              type: "Organization/Project object, default None"
              description: "Organization or Project object. Not necessary if starkbank.user was set before function call"
              section: "optional"
          returns:
            - "list of Invoice objects with updated attributes"
        get:
          summary: "Retrieve a specific Invoice"
          description:
            - "Receive a single Invoice object previously created in the Stark Bank API by its id"
          params:
            - name: "id"
              type: "string"
              description: "object unique id. ex: \"5656565656565656\""
              section: "required"
            - name: "user"
              type: "Organization/Project object, default None"
              description: "Organization or Project object. Not necessary if starkbank.user was set before function call"
              section: "optional"
          returns:
            - "Invoice object with updated attributes"
        query:
          summary: "Retrieve Invoices"
          description:
            - "Receive a generator of Invoice objects previously created in the Stark Bank API"
          params:
            - name: "limit"
              type: "integer, default None"
              description: "maximum number of objects to be retrieved. Unlimited if None. ex: 35"
              section: "optional"
            - name: "after"
              type: "datetime.date or string, default None"
              description: "date filter for objects created only after specified date. ex: datetime.date(2020, 3, 10)"
              section: "optional"
            - name: "before"
              type: "datetime.date or string, default None"
              description: "date filter for objects created only before specified date. ex: datetime.date(2020, 3, 10)"
              section: "optional"
            - name: "status"
              type: "string, default None"
              description: "filter for status of retrieved objects. ex: \"paid\" or \"registered\""
              section: "optional"
            - name: "tags"
              type: "list of strings, default None"
              description: "tags to filter retrieved objects. ex: [\"tony\", \"stark\"]"
              section: "optional"
            - name: "ids"
              type: "list of strings, default None"
              description: "list of ids to filter retrieved objects. ex: [\"5656565656565656\", \"4545454545454545\"]"
              section: "optional"
            - name: "user"
              type: "Organization/Project object, default None"
              description: "Organization or Project object. Not necessary if starkbank.user was set before function call"
              section: "optional"
          returns:
            - "generator of Invoice objects with updated attributes"
        page:
          summary: "Retrieve paged Invoices"
          description:
            - "Receive a list of up to 100 Invoice objects previously created in the Stark Bank API and the cursor to the next page."
            - "Use this function instead of query if you want to manually page your requests."
          params:
            - name: "cursor"
              type: "string, default None"
              description: "cursor returned on the previous page function call"
              section: "optional"
            - name: "limit"
              type: "integer, default 100"
              description: "maximum number of objects to be retrieved. It must be an integer between 1 and 100. ex: 50"
              section: "optional"
            - name: "after"
              type: "datetime.date or string, default None"
              description: "date filter for objects created only after specified date. ex: datetime.date(2020, 3, 10)"
              section: "optional"
            - name: "before"
              type: "datetime.date or string, default None"
              description: "date filter for objects created only before specified date. ex: datetime.date(2020, 3, 10)"
              section: "optional"
            - name: "status"
              type: "string, default None"
              description: "filter for status of retrieved objects. ex: \"paid\" or \"registered\""
              section: "optional"
            - name: "tags"
              type: "list of strings, default None"
              description: "tags to filter retrieved objects. ex: [\"tony\", \"stark\"]"
              section: "optional"
            - name: "ids"
              type: "list of strings, default None"
              description: "list of ids to filter retrieved objects. ex: [\"5656565656565656\", \"4545454545454545\"]"
              section: "optional"
            - name: "user"
              type: "Organization/Project object, default None"
              description: "Organization or Project object. Not necessary if starkbank.user was set before function call"
              section: "optional"
          returns:
            - "list of Invoice objects with updated attributes"
            - "cursor to retrieve the next page of Invoice objects"
        update:
          summary: "Update Invoice entity"
          description:
            - "Update an Invoice by passing its id. If the invoice hasn't been paid yet, you can adjust parameters such as the amount, due date and expiration; if it has already been paid, you may only decrease the amount, which triggers a payment reversal."
          params:
            - name: "id"
              type: "string"
              description: "Invoice id. ex: '5656565656565656'"
              section: "required"
            - name: "status"
              type: "string"
              description: "You may cancel the invoice by passing 'canceled' in the status"
              section: "optional"
            - name: "amount"
              type: "string, default None"
              description: "new amount to be charged. If the Invoice has already been paid, this is the final amount after reversal. ex: 100 (R$1.00)"
              section: "optional"
            - name: "due"
              type: "datetime.datetime or string, default now + 2 days"
              description: "Invoice due date in UTC ISO format. ex: \"2020-10-28T17:59:26.249976+00:00\""
              section: "optional"
            - name: "expiration"
              type: "integer or datetime.timedelta, default None"
              description: "time interval in seconds between the due date and the expiration date. ex 123456789"
              section: "optional"
            - name: "user"
              type: "Organization/Project object, default None"
              description: "Organization or Project object. Not necessary if starkbank.user was set before function call"
              section: "optional"
          returns:
            - "target Invoice with updated attributes"
        pdf:
          summary: "Retrieve a specific Invoice pdf file"
          description:
            - "Receive a single Invoice pdf receipt file generated in the Stark Bank API by its id."
          params:
            - name: "id"
              type: "string"
              description: "object unique id. ex: \"5656565656565656\""
              section: "required"
            - name: "user"
              type: "Organization/Project object, default None"
              description: "Organization or Project object. Not necessary if starkbank.user was set before function call"
              section: "optional"
          returns:
            - "Invoice pdf file"
        log:
          get:
            summary: "Retrieve a specific invoice.Log"
            description:
              - "Receive a single invoice.Log object previously created by the Stark Bank API by its id"
            params:
              - name: "id"
                type: "string"
                description: "object unique id. ex: \"5656565656565656\""
                section: "required"
              - name: "user"
                type: "Organization/Project object, default None"
                description: "Organization or Project object. Not necessary if starkbank.user was set before function call"
                section: "optional"
            returns:
              - "invoice.Log object with updated attributes"
          query:
            summary: "Retrieve invoice.Logs"
            description:
              - "Receive a generator of invoice.Log objects previously created in the Stark Bank API"
            params:
              - name: "limit"
                type: "integer, default None"
                description: "maximum number of objects to be retrieved. Unlimited if None. ex: 35"
                section: "optional"
              - name: "after"
                type: "datetime.date or string, default None"
                description: "date filter for objects created only after specified date. ex: datetime.date(2020, 3, 10)"
                section: "optional"
              - name: "before"
                type: "datetime.date or string, default None"
                description: "date filter for objects created only before specified date. ex: datetime.date(2020, 3, 10)"
                section: "optional"
              - name: "types"
                type: "list of strings, default None"
                description: "filter for log event types. ex: \"paid\" or \"registered\""
                section: "optional"
              - name: "invoiceIds"
                type: "list of strings, default None"
                description: "list of Invoice ids to filter logs. ex: [\"5656565656565656\", \"4545454545454545\"]"
                section: "optional"
              - name: "user"
                type: "Organization/Project object, default None"
                description: "Organization or Project object. Not necessary if starkbank.user was set before function call"
                section: "optional"
            returns:
              - "generator of invoice.Log objects with updated attributes"
          page:
            summary: "Retrieve paged invoice.Logs"
            description:
              - "Receive a list of up to 100 invoice.Log objects previously created in the Stark Bank API and the cursor to the next page."
              - "Use this function instead of query if you want to manually page your requests."
            params:
              - name: "cursor"
                type: "string, default None"
                description: "cursor returned on the previous page function call"
                section: "optional"
              - name: "limit"
                type: "integer, default 100"
                description: "maximum number of objects to be retrieved. It must be an integer between 1 and 100. ex: 50"
                section: "optional"
              - name: "after"
                type: "datetime.date or string, default None"
                description: "date filter for objects created only after specified date. ex: datetime.date(2020, 3, 10)"
                section: "optional"
              - name: "before"
                type: "datetime.date or string, default None"
                description: "date filter for objects created only before specified date. ex: datetime.date(2020, 3, 10)"
                section: "optional"
              - name: "types"
                type: "list of strings, default None"
                description: "filter for log event types. ex: \"paid\" or \"registered\""
                section: "optional"
              - name: "invoiceIds"
                type: "list of strings, default None"
                description: "list of Invoice ids to filter logs. ex: [\"5656565656565656\", \"4545454545454545\"]"
                section: "optional"
              - name: "user"
                type: "Organization/Project object, default None"
                description: "Organization or Project object. Not necessary if starkbank.user was set before function call"
                section: "optional"
            returns:
              - "list of invoice.Log objects with updated attributes"
              - "cursor to retrieve the next page of invoice.Log objects"
          pdf:
            summary: "Retrieve a reversed Invoice.Log pdf file"
            description:
              - "Receive a reversed Invoice.Log pdf receipt file generated in the Stark Bank API by its id."
            params:
              - name: "id"
                type: "string"
                description: "object unique id. ex: \"5656565656565656\""
                section: "required"
              - name: "user"
                type: "Organization/Project object, default None"
                description: "Organization or Project object. Not necessary if starkbank.user was set before function call"
                section: "optional"
            returns:
              - "Invoice pdf file"

