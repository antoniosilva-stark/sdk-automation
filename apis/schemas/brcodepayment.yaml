# fonte: starkbank/sdk-python@65fc3f8 · starkbank/brcodepayment/__brcodepayment.py
components:
  schemas:
    BrcodePayment:
      type: object
      description: "When you initialize a BrcodePayment, the entity will not be automatically created in the Stark Bank API. The 'create' function sends the objects to the Stark Bank API and returns the list of created objects."
      properties:
        brcode:
          type: string
          description: "String loaded directly from the QR Code or copied from the invoice. ex: \"00020126580014br.gov.bcb.pix0136a629532e-7693-4846-852d-1bbff817b5a8520400005303986540510.005802BR5908T'Challa6009Sao Paulo62090505123456304B14A\""
        taxId:
          type: string
          description: "receiver tax ID (CPF or CNPJ) with or without formatting. ex: \"01234567890\" or \"20.018.183/0001-80\""
        description:
          type: string
          description: "Text to be displayed in your statement (min. 10 characters). ex: \"payment ABC\""
        amount:
          type: integer
          format: int64
          description: "If the BRCode does not provide an amount, this parameter is mandatory, else it is optional. ex: 23456 (= R$ 234.56)"
        scheduled:
          type: string
          format: date-time
          description: "payment scheduled date or datetime. ex: datetime.datetime(2020, 3, 10, 15, 17, 3)"
        tags:
          type: array
          items:
            type: string
          description: "list of strings for tagging. All tags will be converted to lowercase."
        rules:
          type: array
          items:
            type: object
          description: "list of BrcodePayment.Rule objects for modifying payment behavior. ex: [Rule(key=\"resendingLimit\", value=5)]"
        id:
          type: string
          description: "unique id returned when payment is created. ex: \"5656565656565656\""
          x-sdk-id: true
        name:
          type: string
          description: "receiver name. ex: \"Jon Snow\""
        status:
          type: string
          description: "current payment status. ex: \"success\" or \"failed\""
        type:
          type: string
          description: "brcode type. ex: \"static\" or \"dynamic\""
        transactionIds:
          type: array
          items:
            type: string
          description: "ledger transaction ids linked to this payment. ex: [\"19827356981273\"]"
        fee:
          type: integer
          description: "fee charged by this brcode payment. ex: 50 (= R$ 0.50)"
        updated:
          type: string
          format: date-time
          description: "latest update datetime for the payment. ex: datetime.datetime(2020, 3, 10, 10, 30, 0, 0)"
        created:
          type: string
          format: date-time
          description: "creation datetime for the payment. ex: datetime.datetime(2020, 3, 10, 10, 30, 0, 0)"
      required:
        - brcode
        - taxId
        - description
        - id
        - name
        - status
        - type
        - transactionIds
        - fee
        - updated
        - created
      x-sdk-docs:
        create:
          summary: "Create BrcodePayments"
          description:
            - "Send a list of BrcodePayment objects for creation in the Stark Bank API. Because processing is asynchronous, the amount attribute of a freshly created BrcodePayment will initially be zero."
          params:
            - name: "payments"
              type: "list of BrcodePayment objects"
              description: "list of BrcodePayment objects to be created in the API"
              section: "required"
            - name: "user"
              type: "Organization/Project object, default None"
              description: "Organization or Project object. Not necessary if starkbank.user was set before function call"
              section: "optional"
          returns:
            - "list of BrcodePayment objects with updated attributes"
        get:
          summary: "Retrieve a specific BrcodePayment"
          description:
            - "Receive a single BrcodePayment object previously created by the Stark Bank API by its id"
          params:
            - name: "id"
              type: "string"
              description: "object unique id. ex: \"5656565656565656\""
              section: "required"
            - name: "user"
              type: "Organization/Project object, default None"
              description: "Organization or Project object. Not necessary if starkbank.user was set before function call"
              section: "optional"
          returns:
            - "BrcodePayment object with updated attributes"
        query:
          summary: "Retrieve BrcodePayments"
          description:
            - "Receive a generator of BrcodePayment objects previously created in the Stark Bank API"
          params:
            - name: "limit"
              type: "integer, default None"
              description: "maximum number of objects to be retrieved. Unlimited if None. ex: 35"
              section: "optional"
            - name: "after"
              type: "datetime.date or string, default None"
              description: "date filter for objects created only after specified date. ex: datetime.date(2020, 3, 10)"
              section: "optional"
            - name: "before"
              type: "datetime.date or string, default None"
              description: "date filter for objects created only before specified date. ex: datetime.date(2020, 3, 10)"
              section: "optional"
            - name: "tags"
              type: "list of strings, default None"
              description: "tags to filter retrieved objects. ex: [\"tony\", \"stark\"]"
              section: "optional"
            - name: "ids"
              type: "list of strings, default None"
              description: "list of ids to filter retrieved objects. ex: [\"5656565656565656\", \"4545454545454545\"]"
              section: "optional"
            - name: "status"
              type: "string, default None"
              description: "filter for status of retrieved objects. ex: \"success\""
              section: "optional"
            - name: "user"
              type: "Organization/Project object, default None"
              description: "Organization or Project object. Not necessary if starkbank.user was set before function call"
              section: "optional"
          returns:
            - "generator of BrcodePayment objects with updated attributes"
        page:
          summary: "Retrieve paged BrcodePayments"
          description:
            - "Receive a list of up to 100 BrcodePayment objects previously created in the Stark Bank API and the cursor to the next page."
            - "Use this function instead of query if you want to manually page your requests."
          params:
            - name: "cursor"
              type: "string, default None"
              description: "cursor returned on the previous page function call"
              section: "optional"
            - name: "limit"
              type: "integer, default 100"
              description: "maximum number of objects to be retrieved. It must be an integer between 1 and 100. ex: 50"
              section: "optional"
            - name: "after"
              type: "datetime.date or string, default None"
              description: "date filter for objects created only after specified date. ex: datetime.date(2020, 3, 10)"
              section: "optional"
            - name: "before"
              type: "datetime.date or string, default None"
              description: "date filter for objects created only before specified date. ex: datetime.date(2020, 3, 10)"
              section: "optional"
            - name: "tags"
              type: "list of strings, default None"
              description: "tags to filter retrieved objects. ex: [\"tony\", \"stark\"]"
              section: "optional"
            - name: "ids"
              type: "list of strings, default None"
              description: "list of ids to filter retrieved objects. ex: [\"5656565656565656\", \"4545454545454545\"]"
              section: "optional"
            - name: "status"
              type: "string, default None"
              description: "filter for status of retrieved objects. ex: \"success\""
              section: "optional"
            - name: "user"
              type: "Organization/Project object, default None"
              description: "Organization or Project object. Not necessary if starkbank.user was set before function call"
              section: "optional"
          returns:
            - "list of BrcodePayment objects with updated attributes"
            - "cursor to retrieve the next page of BrcodePayment objects"
        update:
          summary: "Update BrcodePayment entity"
          description:
            - "Update a BrcodePayment by passing its Id, if it hasn't been paid yet."
          params:
            - name: "id"
              type: "string"
              description: "BrcodePayment id. ex: '5656565656565656'"
              section: "required"
            - name: "status"
              type: "string"
              description: "You may cancel the payment by passing 'canceled' in the status"
              section: "required"
            - name: "user"
              type: "Organization/Project object, default None"
              description: "Organization or Project object. Not necessary if starkbank.user was set before function call"
              section: "optional"
          returns:
            - "target BrcodePayment with updated attributes"
        pdf:
          summary: "Retrieve a specific BrcodePayment pdf file"
          description:
            - "Receive a single BrcodePayment pdf receipt file generated in the Stark Bank API by its id. Only valid for brcode payments with \"success\", \"processing\" or \"created\" status."
          params:
            - name: "id"
              type: "string"
              description: "object unique id. ex: \"5656565656565656\""
              section: "required"
            - name: "user"
              type: "Organization/Project object, default None"
              description: "Organization or Project object. Not necessary if starkbank.user was set before function call"
              section: "optional"
          returns:
            - "BrcodePayment pdf file"
        log:
          get:
            summary: "Retrieve a specific brcodepayment.Log"
            description:
              - "Receive a single brcodepayment.Log object previously created by the Stark Bank API by its id"
            params:
              - name: "id"
                type: "string"
                description: "object unique id. ex: \"5656565656565656\""
                section: "required"
              - name: "user"
                type: "Organization/Project object, default None"
                description: "Organization or Project object. Not necessary if starkbank.user was set before function call"
                section: "optional"
            returns:
              - "brcodepayment.Log object with updated attributes"
          query:
            summary: "Retrieve brcodepayment.Logs"
            description:
              - "Receive a generator of brcodepayment.Log objects previously created in the Stark Bank API"
            params:
              - name: "limit"
                type: "integer, default None"
                description: "maximum number of objects to be retrieved. Unlimited if None. ex: 35"
                section: "optional"
              - name: "after"
                type: "datetime.date or string, default None"
                description: "date filter for objects created only after specified date. ex: datetime.date(2020, 3, 10)"
                section: "optional"
              - name: "before"
                type: "datetime.date or string, default None"
                description: "date filter for objects created only before specified date. ex: datetime.date(2020, 3, 10)"
                section: "optional"
              - name: "types"
                type: "list of strings, default None"
                description: "filter retrieved objects by event types. ex: \"processing\" or \"success\""
                section: "optional"
              - name: "paymentIds"
                type: "list of strings, default None"
                description: "list of BrcodePayment ids to filter retrieved objects. ex: [\"5656565656565656\", \"4545454545454545\"]"
                section: "optional"
              - name: "user"
                type: "Organization/Project object, default None"
                description: "Organization or Project object. Not necessary if starkbank.user was set before function call"
                section: "optional"
            returns:
              - "generator of brcodepayment.Log objects with updated attributes"
          page:
            summary: "Retrieve paged brcodepayment.Logs"
            description:
              - "Receive a list of up to 100 brcodepayment.Log objects previously created in the Stark Bank API and the cursor to the next page."
              - "Use this function instead of query if you want to manually page your requests."
            params:
              - name: "cursor"
