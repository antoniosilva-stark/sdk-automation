components:
  schemas:
    CorporateBalance:
      type: object
      description: "The CorporateBalance object displays the current corporate balance of the Workspace, which is the result of the sum of all transactions within this Workspace. The balance is never generated by the user, but it can be retrieved to see the available information."
      properties:
        id:
          type: string
          description: "unique id returned when CorporateBalance is created. ex: \"5656565656565656\""
        amount:
          type: integer
          format: int64
          description: "current balance amount of the Workspace in cents. ex: 200 (= R$ 2.00)"
        limit:
          type: integer
          description: "The maximum negative balance allowed by the user. ex: 10000 (= R$ 100.00)"
        maxLimit:
          type: integer
          description: "The maximum negative balance allowed by StarkBank. ex: 100000 (= R$ 1000.00)"
        currency:
          type: string
          description: "currency of the current Workspace. Expect others to be added eventually. ex: \"BRL\""
        updated:
          type: string
          format: date-time
          description: "latest update datetime for the CorporateBalance. ex: datetime.datetime(2020, 3, 10, 10, 30, 0, 0)"
      required:
        - id
        - amount
        - limit
        - maxLimit
        - currency
        - updated

    CorporateBalanceCreate:
      type: object
      description: "CorporateBalance creation request"
      properties: {}
