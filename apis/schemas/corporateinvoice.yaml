# fonte: starkbank/sdk-python@65fc3f8 · starkbank/corporateinvoice/__corporateinvoice.py
components:
  schemas:
    CorporateInvoice:
      type: object
      description: "The CorporateInvoice objects created in your Workspace load your Corporate balance when paid. When you initialize a CorporateInvoice, the entity will not be automatically created in the Stark Bank API. The 'create' function sends the objects to the Stark Bank API and returns the created object."
      properties:
        amount:
          type: integer
          format: int64
          description: "CorporateInvoice value in cents. ex: 1234 (= R$ 12.34)"
        tags:
          type: array
          items:
            type: string
          description: "list of strings for tagging. ex: [\"travel\", \"food\"]"
        id:
          type: string
          description: "unique id returned when CorporateInvoice is created. ex: \"5656565656565656\""
          x-sdk-id: true
        name:
          type: string
          description: "payer name. ex: \"Iron Bank S.A.\""
        taxId:
          type: string
          description: "payer tax ID (CPF or CNPJ) with or without formatting. ex: \"01234567890\" or \"20.018.183/0001-80\""
        brcode:
          type: string
          description: "BR Code for the Invoice payment. ex: \"00020101021226930014br.gov.bcb.pix2571brcode-h.development.starkbank.com/v2/d7f6546e194d4c64a153e8f79f1c41ac5204000053039865802BR5925Stark Bank S.A. - Institu6009Sao Paulo62070503***63042109\""
        due:
          type: string
          format: date-time
          description: "Invoice due and expiration date in UTC ISO format. ex: \"2020-10-28T17:59:26.249976+00:00\""
        link:
          type: string
          format: uri
          description: "public Invoice webpage URL. ex: \"https://starkbank-card-issuer.development.starkbank.com/invoicelink/d7f6546e194d4c64a153e8f79f1c41ac\""
        status:
          type: string
          description: "current CorporateInvoice status. ex: \"created\", \"expired\", \"overdue\", \"paid\""
        corporateTransactionId:
          type: string
          description: "ledger transaction ids linked to this CorporateInvoice. ex: \"corporate-invoice/5656565656565656\""
        updated:
          type: string
          format: date-time
          description: "latest update datetime for the CorporateInvoice. ex: datetime.datetime(2020, 3, 10, 10, 30, 0, 0)"
        created:
          type: string
          format: date-time
          description: "creation datetime for the CorporateInvoice. ex: datetime.datetime(2020, 3, 10, 10, 30, 0, 0)"
      required:
        - amount
        - id
        - name
        - taxId
        - brcode
        - due
        - link
        - status
        - corporateTransactionId
        - updated
        - created
      x-sdk-docs:
        create:
          summary: "Create CorporateInvoice"
          description:
            - "Send a CorporateInvoice object for creation at the Stark Bank API"
          params:
            - name: "invoice"
              type: "CorporateInvoice object"
              description: "CorporateInvoice object to be created in the API."
              section: "required"
            - name: "user"
              type: "Organization/Project object, default None"
              description: "Organization or Project object. Not necessary if starkbank.user was set before function call."
              section: "optional"
          returns:
            - "CorporateInvoice object with updated attributes"
        query:
          summary: "Retrieve CorporateInvoices"
          description:
            - "Receive a generator of CorporateInvoice objects previously created in the Stark Bank API"
          params:
            - name: "limit"
              type: "integer, default None"
              description: "maximum number of objects to be retrieved. Unlimited if None. ex: 35"
              section: "optional"
            - name: "after"
              type: "datetime.date or string, default None"
              description: "date filter for objects created only after specified date. ex: datetime.date(2020, 3, 10)"
              section: "optional"
            - name: "before"
              type: "datetime.date or string, default None"
              description: "date filter for objects created only before specified date. ex: datetime.date(2020, 3, 10)"
              section: "optional"
            - name: "status"
              type: "list of strings, default None"
              description: "filter for status of retrieved objects. ex: [\"created\", \"expired\", \"overdue\", \"paid\"]"
              section: "optional"
            - name: "tags"
              type: "list of strings, default None"
              description: "tags to filter retrieved objects. ex: [\"tony\", \"stark\"]"
              section: "optional"
            - name: "user"
              type: "Organization/Project object, default None"
              description: "Organization or Project object. Not necessary if starkbank.user was set before function call."
              section: "optional"
          returns:
            - "generator of CorporateInvoice objects with updated attributes"
        page:
          summary: "Retrieve CorporateInvoices"
          description:
            - "Receive a list of up to 100 CorporateInvoice objects previously created in the Stark Bank API and the cursor to the next page."
            - "Use this function instead of query if you want to manually page your requests."
          params:
            - name: "cursor"
              type: "string, default None"
              description: "cursor returned on the previous page function call"
              section: "optional"
            - name: "limit"
              type: "integer, default 100"
              description: "maximum number of objects to be retrieved. Max = 100. ex: 35"
              section: "optional"
            - name: "after"
              type: "datetime.date or string, default None"
              description: "date filter for objects created only after specified date. ex: datetime.date(2020, 3, 10)"
              section: "optional"
            - name: "before"
              type: "datetime.date or string, default None"
              description: "date filter for objects created only before specified date. ex: datetime.date(2020, 3, 10)"
              section: "optional"
            - name: "status"
              type: "list of strings, default None"
              description: "filter for status of retrieved objects. ex: [\"created\", \"expired\", \"overdue\", \"paid\"]"
              section: "optional"
            - name: "tags"
              type: "list of strings, default None"
              description: "tags to filter retrieved objects. ex: [\"tony\", \"stark\"]"
              section: "optional"
            - name: "user"
              type: "Organization/Project object, default None"
              description: "Organization or Project object. Not necessary if starkbank.user was set before function call."
              section: "optional"
          returns:
            - "list of CorporateInvoice objects with updated attributes"
            - "cursor to retrieve the next page of CorporateInvoice objects"

    CorporateInvoiceCreate:
      type: object
      description: "CorporateInvoice creation request"
      properties:
        amount:
          type: integer
          format: int64
          description: "CorporateInvoice value in cents. ex: 1234 (= R$ 12.34)"
        tags:
          type: array
          items:
            type: string
          description: "list of strings for tagging. ex: [\"travel\", \"food\"]"
      required:
        - amount
