# fonte: starkbank/sdk-python@65fc3f8 · starkbank/transfer/__transfer.py
components:
  schemas:
    Transfer:
      type: object
      description: "When you initialize a Transfer, the entity will not be automatically created in the Stark Bank API. The 'create' function sends the objects to the Stark Bank API and returns the list of created objects."
      properties:
        amount:
          type: integer
          format: int64
          description: "amount in cents to be transferred. ex: 1234 (= R$ 12.34)"
        name:
          type: string
          description: "receiver full name. ex: \"Anthony Edward Stark\""
        taxId:
          type: string
          description: "receiver tax ID (CPF or CNPJ) with or without formatting. ex: \"01234567890\" or \"20.018.183/0001-80\""
        bankCode:
          type: string
          description: "code of the receiver bank institution in Brazil. If an ISPB (8 digits) is informed, a PIX transfer will be created, else a TED will be issued. ex: \"20018183\" or \"341\""
        branchCode:
          type: string
          description: "receiver bank account branch. Use '-' in case there is a verifier digit. ex: \"1357-9\""
        accountNumber:
          type: string
          description: "receiver bank account number. Use '-' before the verifier digit. ex: \"876543-2\""
        accountType:
          type: string
          description: "Receiver bank account type. Only has effect on Pix Transfers. ex: \"checking\", \"savings\", \"salary\" or \"payment\""
        externalId:
          type: string
          description: "url safe string that must be unique among all your transfers. Duplicated external_ids will cause failures. By default, this parameter will block any transfer that repeats amount and receiver information on the same date. ex: \"my-internal-id-123456\""
        scheduled:
          type: string
          format: date-time
          description: "date or datetime when the transfer will be processed. Ted transfers scheduled for today are accepted until 16:00 (BRT) and pushed to the next business day afterwards; Pix transfers are available 24/7 and may be scheduled for any date and time."
        description:
          type: string
          description: "optional description to override default description to be shown in the bank statement. ex: \"Payment for service #1234\""
        displayDescription:
          type: string
          description: "optional description to be shown in the receiver bank interface. ex: 'Payment for service #1234'"
        tags:
          type: array
          items:
            type: string
          description: "list of strings for reference when searching for transfers. All tags will be converted to lowercase. ex: [\"employees\", \"monthly\"]"
        rules:
          type: array
          items:
            type: object
          description: "list of Transfer.Rule objects for modifying transfer behavior. ex: [Transfer.Rule(key=\"resendingLimit\", value=5)]"
        id:
          type: string
          description: "unique id returned when the transfer is created. ex: \"5656565656565656\""
          x-sdk-id: true
        fee:
          type: integer
          description: "fee charged when the Transfer is processed. ex: 200 (= R$ 2.00)"
        status:
          type: string
          description: "current transfer status. ex: \"success\" or \"failed\""
        transactionIds:
          type: array
          items:
            type: string
          description: "ledger Transaction IDs linked to this Transfer (if there are two, the second is the chargeback). ex: [\"19827356981273\"]"
        metadata:
          type: object
          description: "dictionary object used to store additional information about the Transfer object."
        created:
          type: string
          format: date-time
          description: "creation datetime for the transfer. ex: datetime.datetime(2020, 3, 10, 10, 30, 0, 0)"
        updated:
          type: string
          format: date-time
          description: "latest update datetime for the transfer. ex: datetime.datetime(2020, 3, 10, 10, 30, 0, 0)"
      required:
        - amount
        - name
        - taxId
        - bankCode
        - branchCode
        - accountNumber
        - accountType
        - id
        - fee
        - status
        - transactionIds
        - metadata
        - created
        - updated
      x-sdk-docs:
        create:
          summary: "Create Transfers"
          description:
            - "Send a list of Transfer objects for creation in the Stark Bank API"
          params:
            - name: "transfers"
              type: "list of Transfer objects"
              description: "list of Transfer objects to be created in the API"
              section: "required"
            - name: "user"
              type: "Organization/Project object, default None"
              description: "Organization or Project object. Not necessary if starkbank.user was set before function call"
              section: "optional"
          returns:
            - "list of Transfer objects with updated attributes"
        get:
          summary: "Retrieve a specific Transfer"
          description:
            - "Receive a single Transfer object previously created in the Stark Bank API by its id"
          params:
            - name: "id"
              type: "string"
              description: "object unique id. ex: \"5656565656565656\""
              section: "required"
            - name: "user"
              type: "Organization/Project object, default None"
              description: "Organization or Project object. Not necessary if starkbank.user was set before function call"
              section: "optional"
          returns:
            - "Transfer object with updated attributes"
        query:
          summary: "Retrieve Transfers"
          description:
            - "Receive a generator of Transfer objects previously created in the Stark Bank API"
          params:
            - name: "limit"
              type: "integer, default None"
              description: "maximum number of objects to be retrieved. Unlimited if None. ex: 35"
              section: "optional"
            - name: "after"
              type: "datetime.date or string, default None"
              description: "date filter for objects created or updated only after specified date. ex: datetime.date(2020, 3, 10)"
              section: "optional"
            - name: "before"
              type: "datetime.date or string, default None"
              description: "date filter for objects created or updated only before specified date. ex: datetime.date(2020, 3, 10)"
              section: "optional"
            - name: "transactionIds"
              type: "list of strings, default None"
              description: "list of transaction IDs linked to the desired transfers. ex: [\"5656565656565656\", \"4545454545454545\"]"
              section: "optional"
            - name: "status"
              type: "string, default None"
              description: "filter for status of retrieved objects. ex: \"success\" or \"failed\""
              section: "optional"
            - name: "taxId"
              type: "string, default None"
              description: "filter for transfers sent to the specified tax ID. ex: \"012.345.678-90\""
              section: "optional"
            - name: "sort"
              type: "string, default \"-created\""
              description: "sort order considered in response. Valid options are \"created\", \"-created\", \"updated\" or \"-updated\"."
              section: "optional"
            - name: "tags"
              type: "list of strings, default None"
              description: "tags to filter retrieved objects. ex: [\"tony\", \"stark\"]"
              section: "optional"
            - name: "ids"
              type: "list of strings, default None"
              description: "list of ids to filter retrieved objects. ex: [\"5656565656565656\", \"4545454545454545\"]"
              section: "optional"
            - name: "user"
              type: "Organization/Project object, default None"
              description: "Organization or Project object. Not necessary if starkbank.user was set before function call"
              section: "optional"
          returns:
            - "generator of Transfer objects with updated attributes"
        page:
          summary: "Retrieve paged Transfers"
          description:
            - "Receive a list of up to 100 Transfer objects previously created in the Stark Bank API and the cursor to the next page."
            - "Use this function instead of query if you want to manually page your requests."
          params:
            - name: "cursor"
              type: "string, default None"
              description: "cursor returned on the previous page function call"
              section: "optional"
            - name: "limit"
              type: "integer, default 100"
              description: "maximum number of objects to be retrieved. It must be an integer between 1 and 100. ex: 50"
              section: "optional"
            - name: "after"
              type: "datetime.date or string, default None"
              description: "date filter for objects created or updated only after specified date. ex: datetime.date(2020, 3, 10)"
              section: "optional"
            - name: "before"
              type: "datetime.date or string, default None"
              description: "date filter for objects created or updated only before specified date. ex: datetime.date(2020, 3, 10)"
              section: "optional"
            - name: "transactionIds"
              type: "list of strings, default None"
              description: "list of transaction IDs linked to the desired transfers. ex: [\"5656565656565656\", \"4545454545454545\"]"
              section: "optional"
            - name: "status"
              type: "string, default None"
              description: "filter for status of retrieved objects. ex: \"success\" or \"failed\""
              section: "optional"
            - name: "taxId"
              type: "string, default None"
              description: "filter for transfers sent to the specified tax ID. ex: \"012.345.678-90\""
              section: "optional"
            - name: "sort"
              type: "string, default \"-created\""
              description: "sort order considered in response. Valid options are \"created\", \"-created\", \"updated\" or \"-updated\"."
              section: "optional"
            - name: "tags"
              type: "list of strings, default None"
              description: "tags to filter retrieved objects. ex: [\"tony\", \"stark\"]"
              section: "optional"
            - name: "ids"
              type: "list of strings, default None"
              description: "list of ids to filter retrieved objects. ex: [\"5656565656565656\", \"4545454545454545\"]"
              section: "optional"
            - name: "user"
              type: "Organization/Project object, default None"
              description: "Organization or Project object. Not necessary if starkbank.user was set before function call"
              section: "optional"
          returns:
            - "list of Transfer objects with updated attributes"
            - "cursor to retrieve the next page of Transfer objects"
        delete:
          summary: "Delete a Transfer entity"
          description:
            - "Cancel a scheduled Transfer entity, previously created in the Stark Bank API, before it starts being processed. Canceled transfers still appear in later queries."
          params:
            - name: "id"
              type: "string"
              description: "object unique id. ex: \"5656565656565656\""
              section: "required"
            - name: "user"
              type: "Organization/Project object, default None"
              description: "Organization or Project object. Not necessary if starkbank.user was set before function call"
              section: "optional"
          returns:
            - "deleted Transfer object"
        pdf:
          summary: "Retrieve a specific Transfer pdf file"
          description:
            - "Receive a single Transfer pdf receipt file generated in the Stark Bank API by its id."
            - "Only valid for transfers with \"processing\" and \"success\" status."
          params:
            - name: "id"
              type: "string"
              description: "object unique id. ex: \"5656565656565656\""
              section: "required"
            - name: "user"
              type: "Organization/Project object, default None"
              description: "Organization or Project object. Not necessary if starkbank.user was set before function call"
              section: "optional"
          returns:
            - "Transfer pdf file"
        log:
          get:
            summary: "Retrieve a specific transfer.Log"
            description:
              - "Receive a single transfer.Log object previously created by the Stark Bank API by its id"
            params:
              - name: "id"
                type: "string"
                description: "object unique id. ex: \"5656565656565656\""
                section: "required"
              - name: "user"
                type: "Organization/Project object, default None"
                description: "Organization or Project object. Not necessary if starkbank.user was set before function call"
                section: "optional"
            returns:
              - "transfer.Log object with updated attributes"
          query:
            summary: "Retrieve transfer.Logs"
            description:
              - "Receive a generator of transfer.Log objects previously created in the Stark Bank API"
            params:
              - name: "limit"
                type: "integer, default None"
                description: "maximum number of objects to be retrieved. Unlimited if None. ex: 35"
                section: "optional"
              - name: "after"
                type: "datetime.date or string, default None"
                description: "date filter for objects created only after specified date. ex: datetime.date(2020, 3, 10)"
                section: "optional"
              - name: "before"
                type: "datetime.date or string, default None"
                description: "date filter for objects created only before specified date. ex: datetime.date(2020, 3, 10)"
                section: "optional"
              - name: "types"
                type: "list of strings, default None"
                description: "filter retrieved objects by types. ex: \"success\" or \"failed\""
                section: "optional"
              - name: "transferIds"
                type: "list of strings, default None"
                description: "list of Transfer ids to filter retrieved objects. ex: [\"5656565656565656\", \"4545454545454545\"]"
                section: "optional"
              - name: "user"
                type: "Organization/Project object, default None"
                description: "Organization or Project object. Not necessary if starkbank.user was set before function call"
                section: "optional"
            returns:
              - "generator of transfer.Log objects with updated attributes"
          page:
            summary: "Retrieve paged transfer.Logs"
            description:
              - "Receive a list of up to 100 transfer.Log objects previously created in the Stark Bank API and the cursor to the next page."
              - "Use this function instead of query if you want to manually page your requests."
            params:
              - name: "cursor"
                type: "string, default None"
                description: "cursor returned on the previous page function call"
                section: "optional"
              - name: "limit"
                type: "integer, default 100"
                description: "maximum number of objects to be retrieved. It must be an integer between 1 and 100. ex: 50"
                section: "optional"
              - name: "after"
                type: "datetime.date or string, default None"
                description: "date filter for objects created only after specified date. ex: datetime.date(2020, 3, 10)"
                section: "optional"
              - name: "before"
                type: "datetime.date or string, default None"
                description: "date filter for objects created only before specified date. ex: datetime.date(2020, 3, 10)"
                section: "optional"
              - name: "types"
                type: "list of strings, default None"
                description: "filter retrieved objects by types. ex: \"success\" or \"failed\""
                section: "optional"
              - name: "transferIds"
                type: "list of strings, default None"
                description: "list of Transfer ids to filter retrieved objects. ex: [\"5656565656565656\", \"4545454545454545\"]"
                section: "optional"
              - name: "user"
                type: "Organization/Project object, default None"
                description: "Organization or Project object. Not necessary if starkbank.user was set before function call"
                section: "optional"
            returns:
              - "list of transfer.Log objects with updated attributes"
              - "cursor to retrieve the next page of transfer.Log objects"

