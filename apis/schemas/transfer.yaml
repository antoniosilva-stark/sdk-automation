components:
  schemas:
    Transfer:
      type: object
      description: |
        Transfer is an external funds transfer (PIX, TED, etc).
        Can be scheduled for a future date or executed immediately.
      properties:
        id:
          type: string
          description: Unique transfer ID (generated by API)
        amount:
          type: integer
          description: "Amount in cents. Example: 1234 equals R$ 12.34"
        accountNumber:
          type: string
          description: Recipient account number
        bankCode:
          type: string
          description: Recipient bank code
        branchCode:
          type: string
          description: Recipient branch code
        accountType:
          type: string
          enum: [checking, savings]
          description: Recipient account type
        externalId:
          type: string
          description: Unique ID to avoid duplicates
        description:
          type: string
          description: Transfer description
        scheduled:
          type: string
          format: date-time
          description: Scheduled execution time (ISO 8601, optional)
        status:
          type: string
          enum: [pending, processing, completed, failed]
          description: Transfer status
        createdAt:
          type: string
          format: date-time
          description: Creation timestamp (ISO 8601)
        tags:
          type: array
          items:
            type: string
          description: List of tags for reference
      required:
        - id
        - amount
        - accountNumber
        - bankCode
        - branchCode
        - accountType
        - status
        - createdAt

    TransferCreate:
      type: object
      description: Transfer creation request
      properties:
        amount:
          type: integer
          description: "Amount in cents. Example: 1234 equals R$ 12.34"
        accountNumber:
          type: string
          description: Recipient account number
        bankCode:
          type: string
          description: Recipient bank code
        branchCode:
          type: string
          description: Recipient branch code
        accountType:
          type: string
          enum: [checking, savings]
          description: Recipient account type
        externalId:
          type: string
          description: Unique ID to avoid duplicates
        description:
          type: string
          description: Transfer description
        scheduled:
          type: string
          format: date-time
          description: Optional scheduled execution time (ISO 8601)
        tags:
          type: array
          items:
            type: string
          description: Optional tags for reference
      required:
        - amount
        - accountNumber
        - bankCode
        - branchCode
        - accountType
        - externalId