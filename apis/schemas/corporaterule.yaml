components:
  schemas:
    CorporateRule:
      type: object
      description: "The CorporateRule object displays the spending rules of CorporateCards and CorporateHolders created in your Workspace. Parameters (required): - name [string]: rule name. ex: \"Travel\" or \"Food\" - amount [integer]: maximum amount that can be spent in the informed interval. ex: 200000 (= R$ 2000.00) Parameters (optional): - interval [string, default \"lifetime\"]: interval after which the rule amount counter will be reset to 0. ex: \"instant\", \"day\", \"week\", \"month\", \"year\" or \"lifetime\" - schedule [string, default None]: schedule time for user to spend. ex: \"every monday, wednesday from 00:00 to 23:59 in America/Sao_Paulo\" - purposes [list of string, default []]: list of strings representing the allowed purposes for card purchases, you can use this to restrict ATM withdrawals. ex: [\"purchase\", \"withdrawal\"] - currency_code [string, default \"BRL\"]: code of the currency that the rule amount refers to. ex: \"BRL\" or \"USD\" - categories [list of MerchantCategories, default []]: merchant categories accepted by the rule. ex: [MerchantCategory(code=\"fastFoodRestaurants\")] - countries [list of MerchantCountries, default []]: countries accepted by the rule. ex: [MerchantCountry(code=\"BRA\")] - methods [list of CardMethods, default []]: card purchase methods accepted by the rule. ex: [CardMethod(code=\"magstripe\")] Attributes (expanded return-only): - id [string]: unique id returned when a CorporateRule is created, used to update a specific CorporateRule. ex: \"5656565656565656\" - counter_amount [integer]: current rule spent amount. ex: 1000 - currency_symbol [string]: currency symbol. ex: \"R$\" - currency_name [string]: currency name. ex: \"Brazilian Real\""
      properties:
        id:
          type: string
          description: "tipo inferido do __init__, nao declarado no docstring"
        name:
          type: string
          description: "tipo inferido do __init__, nao declarado no docstring"
        amount:
          type: string
          description: "tipo inferido do __init__, nao declarado no docstring"
        interval:
          type: string
          description: "tipo inferido do __init__, nao declarado no docstring"
        schedule:
          type: string
          description: "tipo inferido do __init__, nao declarado no docstring"
        purposes:
          type: string
          description: "tipo inferido do __init__, nao declarado no docstring"
        currencyCode:
          type: string
          description: "tipo inferido do __init__, nao declarado no docstring"
        categories:
          type: string
          description: "tipo inferido do __init__, nao declarado no docstring"
        countries:
          type: string
          description: "tipo inferido do __init__, nao declarado no docstring"
        methods:
          type: string
          description: "tipo inferido do __init__, nao declarado no docstring"
        counterAmount:
          type: string
          description: "tipo inferido do __init__, nao declarado no docstring"
        currencySymbol:
          type: string
