# fonte: starkbank/sdk-python@9ef6834 · starkbank/institution/__institution.py
components:
  schemas:
    Institution:
      type: object
      description: "This resource is used to get information on the institutions that are recognized by the Brazilian Central Bank. Besides the display name and full name, they also include the STR code (used for TEDs) and the SPI Code (used for Pix) for the institutions. Either of these codes may be empty if the institution is not registered on that Central Bank service."
      properties:
        displayName:
          type: string
          description: "short version of the institution name that should be displayed to end users. ex: \"Stark Bank\""
        name:
          type: string
          description: "full version of the institution name. ex: \"Stark Bank S.A.\""
        spiCode:
          type: string
          description: "SPI code used to identify the institution on Pix transactions. ex: \"20018183\""
        strCode:
          type: string
          description: "STR code used to identify the institution on TED transactions. ex: \"123\""
      required:
        - displayName
        - name
        - spiCode
        - strCode

    InstitutionCreate:
      type: object
      description: "Institution creation request"
      properties: {}
