# fonte: starkbank/sdk-python@65fc3f8 · starkbank/institution/__institution.py
components:
  schemas:
    Institution:
      type: object
      description: "This resource is used to get information on the institutions that are recognized by the Brazilian Central Bank. Besides the display name and full name, they also include the STR code (used for TEDs) and the SPI Code (used for Pix) for the institutions. Either of these codes may be empty if the institution is not registered on that Central Bank service."
      properties:
        displayName:
          type: string
          description: "short version of the institution name that should be displayed to end users. ex: \"Stark Bank\""
        name:
          type: string
          description: "full version of the institution name. ex: \"Stark Bank S.A.\""
        spiCode:
          type: string
          description: "SPI code used to identify the institution on Pix transactions. ex: \"20018183\""
        strCode:
          type: string
          description: "STR code used to identify the institution on TED transactions. ex: \"123\""
      required:
        - displayName
        - name
        - spiCode
        - strCode
      x-sdk-docs:
        query:
          summary: "Retrieve Bacen Institutions"
          description:
            - "Receive a list of Institution objects that are recognized by the Brazilian Central bank for Pix and TED transactions"
          params:
            - name: "limit"
              type: "integer, default None"
              description: "maximum number of objects to be retrieved. Unlimited if None. ex: 35"
              section: "optional"
            - name: "search"
              type: "string, default None"
              description: "part of the institution name to be searched. ex: \"stark\""
              section: "optional"
            - name: "spiCodes"
              type: "list of strings, default None"
              description: "list of SPI (Pix) codes to be searched. ex: [\"20018183\"]"
              section: "optional"
            - name: "strCodes"
              type: "list of strings, default None"
              description: "list of STR (TED) codes to be searched. ex: [\"260\"]"
              section: "optional"
            - name: "user"
              type: "Organization/Project object, default None"
              description: "Organization or Project object. Not necessary if starkbank.user was set before function call"
              section: "optional"
          returns:
            - "list of Institution objects with updated attributes"

    InstitutionCreate:
      type: object
      description: "Institution creation request"
      properties: {}
