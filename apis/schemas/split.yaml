            type: string
          description: "list of strings for tagging"
        scheduled:
          type: string
          format: date-time
          description: "payment scheduled date or datetime. ex: datetime.datetime(2020, 3, 10, 15, 17, 3)"
        status:
          type: string
          description: "current payment status. ex: \"success\" or \"failed\""
        created:
          type: string
          format: date-time
          description: "creation datetime for the payment. ex: datetime.datetime(2020, 3, 10, 10, 30, 0, 0)"
        updated:
          type: string
          format: date-time
          description: "update datetime for the payment. ex: datetime.datetime(2020, 3, 10, 10, 30, 0, 0)"
      required:
        - amount
        - receiverId
        - id
        - source
        - externalId
        - tags
        - scheduled
        - status
        - created
        - updated
