# fonte: starkbank/sdk-python@9ef6834 · starkbank/split/__split.py
components:
  schemas:
    Split:
      type: object
      description: "When you initialize a Split, the entity will not be automatically created in the Stark Bank API. The 'create' function sends the objects to the Stark Bank API and returns the list of created objects."
      properties:
        id:
          type: string
          description: "unique id returned when split is created. ex: \"5656565656565656\""
        amount:
          type: integer
          format: int64
          description: "value to send to receivers. ex: 1000 (= R$ 10.00)"
        receiverId:
          type: string
          description: "split receiver unique id. ex: \"5656565656565656\""
        source:
          type: string
          description: "source receivable which generated this split object. ex: \"5656565656565656\""
        externalId:
          type: string
          description: "unique id, generated by the system, to avoid duplicated splits. ex: \"invoice/1234/receiver/5678\""
        tags:
          type: array
          items:
            type: string
          description: "list of strings for tagging"
        scheduled:
          type: string
          format: date
          description: "payment scheduled date or datetime. ex: datetime.datetime(2020, 3, 10, 15, 17, 3)"
        status:
          type: string
          description: "current payment status. ex: \"success\" or \"failed\""
        created:
          type: string
          format: date-time
          description: "creation datetime for the payment. ex: datetime.datetime(2020, 3, 10, 10, 30, 0, 0)"
        updated:
          type: string
          format: date-time
          description: "update datetime for the payment. ex: datetime.datetime(2020, 3, 10, 10, 30, 0, 0)"
      required:
        - id
        - amount
        - receiverId
        - source
        - externalId
        - tags
        - scheduled
        - status
        - created
        - updated

    SplitCreate:
      type: object
      description: "Split creation request"
      properties:
        amount:
          type: integer
          format: int64
          description: "value to send to receivers. ex: 1000 (= R$ 10.00)"
        receiverId:
          type: string
          description: "split receiver unique id. ex: \"5656565656565656\""
      required:
        - amount
        - receiverId
