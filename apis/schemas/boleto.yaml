# fonte: starkbank/sdk-python@65fc3f8 · starkbank/boleto/__boleto.py
components:
  schemas:
    Boleto:
      type: object
      description: "When you initialize a Boleto, the entity will not be automatically sent to the Stark Bank API. The 'create' function sends the objects to the Stark Bank API and returns the list of created objects."
      properties:
        amount:
          type: integer
          format: int64
          description: "Boleto value in cents. Minimum = 200 (R$2,00). ex: 1234 (= R$ 12.34)"
        name:
          type: string
          description: "payer full name. ex: \"Anthony Edward Stark\""
        taxId:
          type: string
          description: "payer tax ID (CPF or CNPJ) with or without formatting. ex: \"01234567890\" or \"20.018.183/0001-80\""
        streetLine1:
          type: string
          description: "payer main address. ex: Av. Paulista, 200"
        streetLine2:
          type: string
          description: "payer address complement. ex: Apto. 123"
        district:
          type: string
          description: "payer address district / neighbourhood. ex: Bela Vista"
        city:
          type: string
          description: "payer address city. ex: Rio de Janeiro"
        stateCode:
          type: string
          description: "payer address state. ex: GO"
        zipCode:
          type: string
          description: "payer address zip code. ex: 01311-200"
        due:
          type: string
          format: date
          description: "Boleto due date in ISO format. ex: 2020-04-30"
        fine:
          type: number
          format: float
          description: "Boleto fine for overdue payment in %. ex: 2.5"
        interest:
          type: number
          format: float
          description: "Boleto monthly interest for overdue payment in %. ex: 5.2"
        overdueLimit:
          type: integer
          description: "limit in days for payment after due date. ex: 7 (max: 59)"
        descriptions:
          type: array
          items:
            type: object
          description: "list of up to 15 dictionaries with \"text\":string and (optional) \"amount\":int pairs. If the \"booklet\" PDF layout is used, only the text of the first description is shown, filling the installment cell."
        discounts:
          type: array
          items:
            type: object
          description: "list of up to 2 dictionaries with \"percentage\":float and \"date\":datetime.datetime or string pairs"
        tags:
          type: array
          items:
            type: string
          description: "list of strings for tagging"
        receiverName:
          type: string
          description: "receiver (Sacador Avalista) full name. If omitted, the workspace owner's name is used. Must be informed together with receiver_tax_id. ex: \"Anthony Edward Stark\""
        receiverTaxId:
          type: string
          description: "receiver (Sacador Avalista) tax ID. If omitted, the workspace owner's tax ID is used. Must be informed together with receiver_name. ex: \"01234567890\" or \"20.018.183/0001-80\""
        id:
          type: string
          description: "unique id returned when Boleto is created. ex: \"5656565656565656\""
          x-sdk-id: true
        fee:
          type: integer
          description: "fee charged when Boleto is paid. ex: 200 (= R$ 2.00)"
        line:
          type: string
          description: "generated Boleto line for payment. ex: \"34191.09008 63571.277308 71444.640008 5 81960000000062\""
        barCode:
          type: string
          description: "generated Boleto bar-code for payment. ex: \"34195819600000000621090063571277307144464000\""
        status:
          type: string
          description: "current Boleto status. ex: \"registered\" or \"paid\""
        transactionIds:
          type: array
          items:
            type: string
          description: "ledger transaction ids linked to this boleto. ex: [\"19827356981273\"]"
        workspaceId:
          type: string
          description: "ID of the Workspace where this Boleto was generated. ex: \"4545454545454545\""
        ourNumber:
          type: string
          description: "Reference number registered at the settlement bank. ex:\"10131474\""
        created:
          type: string
          format: date-time
          description: "creation datetime for the Boleto. ex: datetime.datetime(2020, 3, 10, 10, 30, 0, 0)"
      required:
        - amount
        - name
        - taxId
        - streetLine1
        - streetLine2
        - district
        - city
        - stateCode
        - zipCode
        - id
        - fee
        - line
        - barCode
        - status
        - transactionIds
        - workspaceId
        - ourNumber
        - created
      x-sdk-docs:
        create:
          summary: "Create Boletos"
          description:
            - "Send a list of Boleto objects for creation in the Stark Bank API. You can create up to 100 Boletos per call. If a Boleto is paid after its due date with fine, interest or a discount applied, its amount attribute is updated to reflect the amount actually paid."
          params:
            - name: "boletos"
              type: "list of Boleto objects"
              description: "list of Boleto objects to be created in the API"
              section: "required"
            - name: "user"
              type: "Organization/Project object, default None"
              description: "Organization or Project object. Not necessary if starkbank.user was set before function call"
              section: "optional"
          returns:
            - "list of Boleto objects with updated attributes"
        get:
          summary: "Retrieve a specific Boleto"
          description:
            - "Receive a single Boleto object previously created in the Stark Bank API by its id"
          params:
            - name: "id"
              type: "string"
              description: "object unique id. ex: \"5656565656565656\""
              section: "required"
            - name: "user"
              type: "Organization/Project object, default None"
              description: "Organization or Project object. Not necessary if starkbank.user was set before function call"
              section: "optional"
          returns:
            - "Boleto object with updated attributes"
        query:
          summary: "Retrieve Boletos"
          description:
            - "Receive a generator of Boleto objects previously created in the Stark Bank API"
          params:
            - name: "limit"
              type: "integer, default None"
              description: "maximum number of objects to be retrieved. Unlimited if None. ex: 35"
              section: "optional"
            - name: "after"
              type: "datetime.date or string, default None"
              description: "date filter for objects created only after specified date. ex: datetime.date(2020, 3, 10)"
              section: "optional"
            - name: "before"
              type: "datetime.date or string, default None"
              description: "date filter for objects created only before specified date. ex: datetime.date(2020, 3, 10)"
              section: "optional"
            - name: "status"
              type: "string, default None"
              description: "filter for status of retrieved objects. ex: \"paid\" or \"registered\""
              section: "optional"
            - name: "tags"
              type: "list of strings, default None"
              description: "tags to filter retrieved objects. ex: [\"tony\", \"stark\"]"
              section: "optional"
            - name: "ids"
              type: "list of strings, default None"
              description: "list of ids to filter retrieved objects. ex: [\"5656565656565656\", \"4545454545454545\"]"
              section: "optional"
            - name: "user"
              type: "Organization/Project object, default None"
              description: "Organization or Project object. Not necessary if starkbank.user was set before function call"
              section: "optional"
          returns:
            - "generator of Boleto objects with updated attributes"
        page:
          summary: "Retrieve paged Boletos"
          description:
            - "Receive a list of up to 100 Boleto objects previously created in the Stark Bank API and the cursor to the next page."
            - "Use this function instead of query if you want to manually page your requests."
          params:
            - name: "cursor"
              type: "string, default None"
              description: "cursor returned on the previous page function call"
              section: "optional"
            - name: "limit"
              type: "integer, default 100"
              description: "maximum number of objects to be retrieved. It must be an integer between 1 and 100. ex: 50"
              section: "optional"
            - name: "after"
              type: "datetime.date or string, default None"
              description: "date filter for objects created only after specified date. ex: datetime.date(2020, 3, 10)"
              section: "optional"
            - name: "before"
              type: "datetime.date or string, default None"
              description: "date filter for objects created only before specified date. ex: datetime.date(2020, 3, 10)"
              section: "optional"
            - name: "status"
              type: "string, default None"
              description: "filter for status of retrieved objects. ex: \"paid\" or \"registered\""
              section: "optional"
            - name: "tags"
              type: "list of strings, default None"
              description: "tags to filter retrieved objects. ex: [\"tony\", \"stark\"]"
              section: "optional"
            - name: "ids"
              type: "list of strings, default None"
              description: "list of ids to filter retrieved objects. ex: [\"5656565656565656\", \"4545454545454545\"]"
              section: "optional"
            - name: "user"
              type: "Organization/Project object, default None"
              description: "Organization or Project object. Not necessary if starkbank.user was set before function call"
              section: "optional"
          returns:
            - "list of Boleto objects with updated attributes"
            - "cursor to retrieve the next page of Boleto objects"
        delete:
          summary: "Delete a Boleto entity"
          description:
            - "Delete a Boleto entity previously created in the Stark Bank API. A cancellation request is sent to CIP; once canceled, the Boleto can no longer be paid. This action cannot be undone."
          params:
            - name: "id"
              type: "string"
              description: "Boleto unique id. ex: \"5656565656565656\""
              section: "required"
            - name: "user"
              type: "Organization/Project object, default None"
              description: "Organization or Project object. Not necessary if starkbank.user was set before function call"
              section: "optional"
          returns:
            - "deleted Boleto object"
        pdf:
          summary: "Retrieve a specific Boleto pdf file"
          description:
            - "Receive a single Boleto pdf file generated in the Stark Bank API by its id. This route is public and needs no authentication, but repeated requests for invalid ids will get your IP blocked from this route."
          params:
            - name: "id"
              type: "string"
              description: "object unique id. ex: \"5656565656565656\""
              section: "required"
            - name: "layout"
              type: "string"
              description: "Layout specification. Available options are \"default\" and \"booklet\""
              section: "optional"
            - name: "hiddenFields"
              type: "list of strings, default None"
              description: "List of string fields to be hidden in Boleto pdf. ex: [\"customerAddress\"]"
              section: "optional"
            - name: "user"
              type: "Organization/Project object, default None"
              description: "Organization or Project object. Not necessary if starkbank.user was set before function call"
              section: "optional"
          returns:
            - "Boleto pdf file"
        log:
          get:
            summary: "Retrieve a specific boleto.Log"
            description:
              - "Receive a single boleto.Log object previously created by the Stark Bank API by its id"
            params:
              - name: "id"
                type: "string"
                description: "object unique id. ex: \"5656565656565656\""
                section: "required"
              - name: "user"
                type: "Organization/Project object, default None"
                description: "Organization or Project object. Not necessary if starkbank.user was set before function call"
                section: "optional"
            returns:
              - "boleto.Log object with updated attributes"
          query:
            summary: "Retrieve boleto.Logs"
            description:
              - "Receive a generator of boleto.Log objects previously created in the Stark Bank API"
            params:
              - name: "limit"
                type: "integer, default None"
                description: "maximum number of objects to be retrieved. Unlimited if None. ex: 35"
                section: "optional"
              - name: "after"
                type: "datetime.date or string, default None"
                description: "date filter for objects created only after specified date. ex: datetime.date(2020, 3, 10)"
                section: "optional"
              - name: "before"
                type: "datetime.date or string, default None"
                description: "date filter for objects created only before specified date. ex: datetime.date(2020, 3, 10)"
                section: "optional"
              - name: "types"
                type: "list of strings, default None"
                description: "filter for log event types. ex: \"paid\" or \"registered\""
                section: "optional"
              - name: "boletoIds"
                type: "list of strings, default None"
                description: "list of Boleto ids to filter logs. ex: [\"5656565656565656\", \"4545454545454545\"]"
                section: "optional"
              - name: "user"
                type: "Organization/Project object, default None"
                description: "Organization or Project object. Not necessary if starkbank.user was set before function call"
                section: "optional"
            returns:
              - "generator of boleto.Log objects with updated attributes"
          page:
            summary: "Retrieve paged boleto.Logs"
            description:
              - "Receive a list of up to 100 boleto.Log objects previously created in the Stark Bank API and the cursor to the next page."
              - "Use this function instead of query if you want to manually page your requests."
            params:
              - name: "cursor"
                type: "string, default None"
                description: "cursor returned on the previous page function call"
                section: "optional"
              - name: "limit"
                type: "integer, default 100"
                description: "maximum number of objects to be retrieved. It must be an integer between 1 and 100. ex: 50"
                section: "optional"
              - name: "after"
