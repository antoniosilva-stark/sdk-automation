components:
  schemas:
    Event:
      type: object
      description: "An Event is the notification received from the subscription to the Webhook. Events cannot be created, but may be retrieved from the Stark Bank API to list all generated updates on entities."
      properties:
        id:
          type: string
          description: "unique id returned when the event is created. ex: \"5656565656565656\""
          x-sdk-id: true
        log:
          type: string
          description: "a Log object from one of the subscribed services (TransferLog, InvoiceLog, DepositLog, BoletoLog, BoletoHolmesLog, BrcodePaymentLog, BoletoPaymentLog, UtilityPaymentLog, TaxPaymentLog or DarfPaymentLog)"
        created:
          type: string
          format: date-time
          description: "creation datetime for the notification event. ex: datetime.datetime(2020, 3, 10, 10, 30, 0, 0)"
        isDelivered:
          type: boolean
          description: "true if the event has been successfully delivered to the user url. ex: False"
        subscription:
          type: string
          description: "service that triggered this event. ex: \"transfer\", \"utility-payment\""
        workspaceId:
          type: string
          description: "ID of the Workspace that generated this event. Mostly used when multiple Workspaces have Webhooks registered to the same endpoint. ex: \"4545454545454545\""
      required:
        - id
        - log
        - created
        - isDelivered
        - subscription
        - workspaceId
      x-sdk-docs:
        get:
          summary: "Retrieve a specific notification Event"
          description:
            - "Receive a single notification Event object previously created in the Stark Bank API by its id"
          params:
            - name: "id"
              type: "string"
              description: "object unique id. ex: \"5656565656565656\""
              section: "required"
            - name: "user"
              type: "Organization/Project object, default None"
              description: "Organization or Project object. Not necessary if starkbank.user was set before function call"
              section: "optional"
          returns:
            - "Event object with updated attributes"
        query:
          summary: "Retrieve notification Events"
          description:
            - "Receive a generator of notification Event objects previously created in the Stark Bank API"
          params:
            - name: "limit"
              type: "integer, default None"
              description: "maximum number of objects to be retrieved. Unlimited if None. ex: 35"
              section: "optional"
            - name: "after"
              type: "datetime.date or string, default None"
              description: "date filter for objects created only after specified date. ex: datetime.date(2020, 3, 10)"
              section: "optional"
            - name: "before"
              type: "datetime.date or string, default None"
              description: "date filter for objects created only before specified date. ex: datetime.date(2020, 3, 10)"
              section: "optional"
            - name: "isDelivered"
              type: "bool, default None"
              description: "bool to filter successfully delivered events. ex: True or False"
              section: "optional"
            - name: "user"
              type: "Organization/Project object, default None"
              description: "Organization or Project object. Not necessary if starkbank.user was set before function call"
              section: "optional"
          returns:
            - "generator of Event objects with updated attributes"
        page:
          summary: "Retrieve paged Events"
          description:
            - "Receive a list of up to 100 Event objects previously created in the Stark Bank API and the cursor to the next page."
            - "Use this function instead of query if you want to manually page your requests."
          params:
