# fonte: starkbank/sdk-python@9ef6834 · starkbank/event/__event.py
components:
  schemas:
    Event:
      type: object
      description: "An Event is the notification received from the subscription to the Webhook. Events cannot be created, but may be retrieved from the Stark Bank API to list all generated updates on entities."
      properties:
        id:
          type: string
          description: "unique id returned when the event is created. ex: \"5656565656565656\""
        log:
          type: string
          description: "a Log object from one of the subscribed services (TransferLog, InvoiceLog, DepositLog, BoletoLog, BoletoHolmesLog, BrcodePaymentLog, BoletoPaymentLog, UtilityPaymentLog, TaxPaymentLog or DarfPaymentLog)"
        created:
          type: string
          format: date-time
          description: "creation datetime for the notification event. ex: datetime.datetime(2020, 3, 10, 10, 30, 0, 0)"
        isDelivered:
          type: boolean
          description: "true if the event has been successfully delivered to the user url. ex: False"
        subscription:
          type: string
          description: "service that triggered this event. ex: \"transfer\", \"utility-payment\""
        workspaceId:
          type: string
          description: "ID of the Workspace that generated this event. Mostly used when multiple Workspaces have Webhooks registered to the same endpoint. ex: \"4545454545454545\""
      required:
        - id
        - log
        - created
        - isDelivered
        - subscription
        - workspaceId

    EventCreate:
      type: object
      description: "Event creation request"
      properties: {}
