              type: "Organization/Project object"
              description: "Organization or Project object. Not necessary if starkbank.user was set before function call"
              section: "optional"
          returns:
            - "deleted TaxPayment object"
        pdf:
          summary: "Retrieve a specific TaxPayment pdf file"
          description:
            - "Receive a single TaxPayment pdf file generated in the Stark Bank API by passing its id."
            - "Only valid for tax payments with \"success\", \"processing\" or \"created\" status."
          params:
