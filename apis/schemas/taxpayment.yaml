# fonte: starkbank/sdk-python@65fc3f8 · starkbank/taxpayment/__taxpayment.py
components:
  schemas:
    TaxPayment:
      type: object
      description: "When you initialize a TaxPayment, the entity will not be automatically created in the Stark Bank API. The 'create' function sends the objects to the Stark Bank API and returns the list of created objects."
      properties:
        line:
          type: string
          description: "Number sequence that describes the payment. Either 'line' or 'bar_code' parameters are required. If both are sent, they must match. ex: \"85800000003 0 28960328203 1 56072020190 5 22109674804 0\""
        barCode:
          type: string
          description: "Bar code number that describes the payment. Either 'line' or 'barCode' parameters are required. If both are sent, they must match. ex: \"83660000001084301380074119002551100010601813\""
        description:
          type: string
          description: "Text to be displayed in your statement (min. 10 characters). ex: \"payment ABC\""
        scheduled:
          type: string
          format: date
          description: "payment scheduled date. ex: datetime.date(2020, 3, 10)"
        tags:
          type: array
          items:
            type: string
          description: "list of strings for tagging. All tags will be converted to lowercase."
        id:
          type: string
          description: "unique id returned when payment is created. ex: \"5656565656565656\""
          x-sdk-id: true
        type:
          type: string
          description: "tax type. ex: \"das\""
        status:
          type: string
          description: "current payment status. ex: \"success\" or \"failed\""
        amount:
          type: integer
          format: int64
          description: "amount automatically calculated from line or bar_code. ex: 23456 (= R$ 234.56)"
        fee:
          type: integer
          description: "fee charged when tax payment is created. ex: 200 (= R$ 2.00)"
        transactionIds:
          type: array
          items:
            type: string
          description: "ledger transaction ids linked to this TaxPayment. ex: [\"19827356981273\"]"
        updated:
          type: string
          format: date-time
          description: "latest update datetime for the payment. ex: datetime.datetime(2020, 3, 10, 10, 30, 0, 0)"
        created:
          type: string
          format: date-time
          description: "creation datetime for the payment. ex: datetime.datetime(2020, 3, 10, 10, 30, 0, 0)"
      required:
        - description
        - id
        - type
        - status
        - amount
        - fee
        - transactionIds
        - updated
        - created
      x-sdk-docs:
        create:
          summary: "Create TaxPayments"
          description:
            - "Send a list of TaxPayment objects for creation in the Stark Bank API"
          params:
            - name: "payments"
              type: "list of TaxPayment objects"
              description: "list of TaxPayment objects to be created in the API"
              section: "required"
            - name: "user"
              type: "Organization/Project object"
              description: "Organization or Project object. Not necessary if starkbank.user was set before function call"
              section: "optional"
          returns:
            - "list of TaxPayment objects with updated attributes"
        get:
          summary: "Retrieve a specific TaxPayment"
          description:
            - "Receive a single TaxPayment object previously created by the Stark Bank API by passing its id"
          params:
            - name: "id"
              type: "string"
              description: "object unique id. ex: \"5656565656565656\""
              section: "required"
            - name: "user"
              type: "Organization/Project object"
              description: "Organization or Project object. Not necessary if starkbank.user was set before function call"
              section: "optional"
          returns:
            - "TaxPayment object with updated attributes"
        query:
          summary: "Retrieve TaxPayments"
          description:
            - "Receive a generator of TaxPayment objects previously created in the Stark Bank API"
          params:
            - name: "limit"
              type: "integer, default None"
              description: "maximum number of objects to be retrieved. Unlimited if None. ex: 35"
              section: "optional"
            - name: "after"
              type: "datetime.date or string, default None"
              description: "date filter for objects created only after specified date. ex: datetime.date(2020, 3, 10)"
              section: "optional"
            - name: "before"
              type: "datetime.date or string, default None"
              description: "date filter for objects created only before specified date. ex: datetime.date(2020, 3, 10)"
              section: "optional"
            - name: "tags"
              type: "list of strings, default None"
              description: "tags to filter retrieved objects. ex: [\"tony\", \"stark\"]"
              section: "optional"
            - name: "ids"
              type: "list of strings, default None"
              description: "list of ids to filter retrieved objects. ex: [\"5656565656565656\", \"4545454545454545\"]"
              section: "optional"
            - name: "status"
              type: "string, default None"
              description: "filter for status of retrieved objects. ex: \"success\""
              section: "optional"
            - name: "user"
              type: "Project object, default None"
              description: "Project object. Not necessary if starkbank.user was set before function call"
              section: "optional"
          returns:
            - "generator of TaxPayment objects with updated attributes"
        page:
          summary: "Retrieve paged TaxPayments"
          description:
            - "Receive a list of up to 100 TaxPayment objects previously created in the Stark Bank API and the cursor to the next page."
            - "Use this function instead of query if you want to manually page your requests."
          params:
            - name: "cursor"
              type: "string, default None"
              description: "cursor returned on the previous page function call"
              section: "optional"
            - name: "limit"
              type: "integer, default 100"
              description: "maximum number of objects to be retrieved. It must be an integer between 1 and 100. ex: 50"
              section: "optional"
            - name: "after"
