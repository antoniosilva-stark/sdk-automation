# fonte: starkbank/sdk-python@65fc3f8 · starkbank/balance/__balance.py
components:
  schemas:
    Balance:
      type: object
      description: "The Balance object displays the current balance of the workspace, which is the result of the sum of all transactions within this workspace. The balance is never generated by the user, but it can be retrieved to see the available information."
      properties:
        id:
          type: string
          description: "unique id returned when Balance is created. ex: \"5656565656565656\""
          x-sdk-id: true
        amount:
          type: integer
          format: int64
          description: "current balance amount of the workspace in cents. ex: 200 (= R$ 2.00)"
        currency:
          type: string
          description: "currency of the current workspace. Expect others to be added eventually. ex: \"BRL\""
        updated:
          type: string
          format: date-time
          description: "latest update datetime for the balance. ex: datetime.datetime(2020, 3, 10, 10, 30, 0, 0)"
      required:
        - id
        - amount
        - currency
        - updated
      x-sdk-docs:
        get:
          summary: "Retrieve the Balance object"
          description:
            - "Receive the Balance object linked to your workspace in the Stark Bank API"
          params:
            - name: "user"
              type: "Organization/Project object, default None"
              description: "Organization or Project object. Not necessary if starkbank.user was set before function call"
              section: "optional"
          returns:
            - "Balance object with updated attributes"

    BalanceCreate:
      type: object
      description: "Balance creation request"
      properties: {}
