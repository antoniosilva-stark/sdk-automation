components:
  schemas:
    Balance:
      type: object
      description: "The Balance object displays the current balance of the workspace, which is the result of the sum of all transactions within this workspace. The balance is never generated by the user, but it can be retrieved to see the available information."
      properties:
        id:
          type: string
          description: "unique id returned when Balance is created. ex: \"5656565656565656\""
        amount:
          type: integer
          format: int64
          description: "current balance amount of the workspace in cents. ex: 200 (= R$ 2.00)"
        currency:
          type: string
          description: "currency of the current workspace. Expect others to be added eventually. ex: \"BRL\""
        updated:
          type: string
          format: date-time
          description: "latest update datetime for the balance. ex: datetime.datetime(2020, 3, 10, 10, 30, 0, 0)"
      required:
        - id
        - amount
        - currency
        - updated

    BalanceCreate:
      type: object
      description: "Balance creation request"
      properties: {}
