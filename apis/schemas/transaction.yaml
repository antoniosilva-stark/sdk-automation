components:
  schemas:
    Transaction:
      type: object
      description: "A Transaction is a transfer of funds between workspaces inside Stark Bank. Transactions created by the user are only for internal transactions. Other operations (such as transfer or charge-payment) will automatically create a transaction for the user which can be retrieved for the statement. When you initialize a Transaction, the entity will not be automatically created in the Stark Bank API. The 'create' function sends the objects to the Stark Bank API and returns the list of created objects."
      properties:
        id:
          type: string
          description: "unique id returned when Transaction is created. ex: \"7656565656565656\""
        amount:
          type: integer
          format: int64
          description: "amount in cents to be transferred. ex: 1234 (= R$ 12.34)"
        description:
          type: string
          description: "text to be displayed in the receiver and the sender statements (Min. 10 characters). ex: \"funds redistribution\""
        externalId:
          type: string
          description: "unique id, generated by user, to avoid duplicated transactions. ex: \"transaction ABC 2020-03-30\""
        receiverId:
          type: string
          description: "unique id of the receiving workspace. ex: \"5656565656565656\""
        tags:
          type: array
          items:
            type: string
          description: "list of strings for reference when searching transactions (may be empty). ex: [\"abc\", \"test\"]"
        senderId:
          type: string
          description: "unique id of the sending workspace. ex: \"5656565656565656\""
        source:
          type: string
          description: "locator of the entity that generated the transaction. ex: \"charge/1827351876292\", \"transfer/92873912873/chargeback\""
        fee:
          type: integer
          description: "fee charged when transaction is created. ex: 200 (= R$ 2.00)"
        balance:
          type: integer
          format: int64
          description: "account balance after transaction was processed. ex: 100000000 (= R$ 1,000,000.00)"
        created:
          type: string
          format: date-time
          description: "creation datetime for the transaction. ex: datetime.datetime(2020, 3, 10, 10, 30, 0, 0)"
      required:
        - id
        - amount
        - description
        - externalId
        - receiverId
        - senderId
        - source
        - fee
        - balance
        - created

    TransactionCreate:
      type: object
      description: "Transaction creation request"
      properties:
        amount:
          type: integer
          format: int64
          description: "amount in cents to be transferred. ex: 1234 (= R$ 12.34)"
        description:
          type: string
          description: "text to be displayed in the receiver and the sender statements (Min. 10 characters). ex: \"funds redistribution\""
        externalId:
          type: string
          description: "unique id, generated by user, to avoid duplicated transactions. ex: \"transaction ABC 2020-03-30\""
        receiverId:
          type: string
          description: "unique id of the receiving workspace. ex: \"5656565656565656\""
        tags:
          type: array
          items:
            type: string
          description: "list of strings for reference when searching transactions (may be empty). ex: [\"abc\", \"test\"]"
      required:
        - amount
        - description
        - externalId
        - receiverId
