components:
  schemas:
    Transaction:
      type: object
      description: |
        A Transaction is a transfer of funds between workspaces inside Stark Bank.
        Transactions created by the user are only for internal transactions.
      properties:
        id:
          type: string
          description: Unique transaction ID (generated by API)
        amount:
          type: integer
          description: "Amount in cents. Example: 1234 equals R$ 12.34"
        description:
          type: string
          description: Text displayed in statements (min. 10 characters)
        externalId:
          type: string
          description: Unique ID generated by user to avoid duplicates
        receiverId:
          type: string
          description: Unique ID of the receiving workspace
        senderId:
          type: string
          description: Unique ID of the sending workspace (return-only)
        status:
          type: string
          enum: [pending, processing, completed, failed]
          description: Transaction status
        createdAt:
          type: string
          format: date-time
          description: Creation timestamp (ISO 8601)
        tags:
          type: array
          items:
            type: string
          description: List of tags for reference
      required:
        - id
        - amount
        - description
        - externalId
        - receiverId
        - status
        - createdAt

    TransactionCreate:
      type: object
      description: Transaction creation request
      properties:
        amount:
          type: integer
          description: "Amount in cents. Example: 1234 equals R$ 12.34"
        description:
          type: string
          description: Text displayed in statements (min. 10 characters)
        externalId:
          type: string
          description: Unique ID to avoid duplicates
        receiverId:
          type: string
          description: Unique ID of the receiving workspace
        tags:
          type: array
          items:
            type: string
          description: Optional tags for reference
      required:
        - amount
        - description
        - externalId
        - receiverId