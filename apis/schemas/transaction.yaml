# fonte: starkbank/sdk-python@65fc3f8 · starkbank/transaction/__transaction.py
components:
  schemas:
    Transaction:
      type: object
      description: "A Transaction is a transfer of funds between workspaces inside Stark Bank. Transactions created by the user are only for internal transactions. Other operations (such as transfer or charge-payment) will automatically create a transaction for the user which can be retrieved for the statement. When you initialize a Transaction, the entity will not be automatically created in the Stark Bank API. The 'create' function sends the objects to the Stark Bank API and returns the list of created objects."
      properties:
        amount:
          type: integer
          format: int64
          description: "amount in cents to be transferred. ex: 1234 (= R$ 12.34)"
        description:
          type: string
          description: "text to be displayed in the receiver and the sender statements (Min. 10 characters). ex: \"funds redistribution\""
        externalId:
          type: string
          description: "unique id, generated by user, to avoid duplicated transactions. ex: \"transaction ABC 2020-03-30\""
        receiverId:
          type: string
          description: "unique id of the receiving workspace. ex: \"5656565656565656\""
        tags:
          type: array
          items:
            type: string
          description: "list of strings for reference when searching transactions (may be empty). ex: [\"abc\", \"test\"]"
        senderId:
          type: string
          description: "unique id of the sending workspace. ex: \"5656565656565656\""
        source:
          type: string
          description: "locator of the entity that generated the transaction. ex: \"charge/1827351876292\", \"transfer/92873912873/chargeback\""
        id:
          type: string
          description: "unique id returned when Transaction is created. ex: \"7656565656565656\""
          x-sdk-id: true
        fee:
          type: integer
          description: "fee charged when transaction is created. ex: 200 (= R$ 2.00)"
        balance:
          type: integer
          format: int64
          description: "account balance after transaction was processed. ex: 100000000 (= R$ 1,000,000.00)"
        created:
          type: string
          format: date-time
          description: "creation datetime for the transaction. ex: datetime.datetime(2020, 3, 10, 10, 30, 0, 0)"
      required:
        - amount
        - description
        - externalId
        - receiverId
        - senderId
        - source
        - id
        - fee
        - balance
        - created
      x-sdk-docs:
        create:
          summary: "[DEPRECATED] Create Transactions"
          description:
            - "This function is deprecated since v2.31.0 and always raises a StarkError. Transactions are now created only indirectly, as a side effect of other operations (such as transfer or charge-payment)."
          params: []
          returns: []
        get:
          summary: "Retrieve a specific Transaction"
          description:
            - "Receive a single Transaction object previously created in the Stark Bank API by its id"
          params:
            - name: "id"
              type: "string"
              description: "object unique id. ex: \"5656565656565656\""
              section: "required"
            - name: "user"
              type: "Organization/Project object, default None"
              description: "Organization or Project object. Not necessary if starkbank.user was set before function call"
              section: "optional"
          returns:
            - "Transaction object with updated attributes"
        query:
          summary: "Retrieve Transactions"
          description:
            - "Receive a generator of Transaction objects previously created in the Stark Bank API."
            - "Use this function instead of page if you want to stream Transactions without worrying about cursors and pagination."
          params:
            - name: "limit"
              type: "integer, default None"
              description: "maximum number of objects to be retrieved. Unlimited if None. ex: 35"
              section: "optional"
            - name: "after"
              type: "datetime.date or string, default None"
              description: "date filter for objects created only after specified date. ex: datetime.date(2020, 3, 10)"
              section: "optional"
            - name: "before"
              type: "datetime.date or string, default None"
              description: "date filter for objects created only before specified date. ex: datetime.date(2020, 3, 10)"
              section: "optional"
            - name: "tags"
              type: "list of strings, default None"
              description: "tags to filter retrieved objects. ex: [\"tony\", \"stark\"]"
              section: "optional"
            - name: "externalIds"
              type: "list of strings, default None"
              description: "list of external ids to filter retrieved objects. ex: [\"5656565656565656\", \"4545454545454545\"]"
              section: "optional"
            - name: "ids"
              type: "list of strings, default None"
              description: "list of ids to filter retrieved objects. ex: [\"5656565656565656\", \"4545454545454545\"]"
              section: "optional"
            - name: "user"
              type: "Organization/Project object, default None"
              description: "Organization or Project object. Not necessary if starkbank.user was set before function call"
              section: "optional"
          returns:
            - "generator of Transaction objects with updated attributes"
        page:
          summary: "Retrieve paged Transactions"
          description:
            - "Receive a list of up to 100 Transaction objects previously created in the Stark Bank API and the cursor to the next page."
            - "Use this function instead of query if you want to manually page your requests."
          params:
            - name: "cursor"
              type: "string, default None"
              description: "cursor returned on the previous page function call"
              section: "optional"
            - name: "limit"
              type: "integer, default 100"
              description: "maximum number of objects to be retrieved. It must be an integer between 1 and 100. ex: 50"
              section: "optional"
            - name: "after"
              type: "datetime.date or string, default None"
              description: "date filter for objects created only after specified date. ex: datetime.date(2020, 3, 10)"
              section: "optional"
            - name: "before"
              type: "datetime.date or string, default None"
              description: "date filter for objects created only before specified date. ex: datetime.date(2020, 3, 10)"
              section: "optional"
            - name: "tags"
              type: "list of strings, default None"
              description: "tags to filter retrieved objects. ex: [\"tony\", \"stark\"]"
              section: "optional"
            - name: "externalIds"
              type: "list of strings, default None"
              description: "list of external ids to filter retrieved objects. ex: [\"5656565656565656\", \"4545454545454545\"]"
              section: "optional"
            - name: "ids"
              type: "list of strings, default None"
              description: "list of ids to filter retrieved objects. ex: [\"5656565656565656\", \"4545454545454545\"]"
              section: "optional"
            - name: "user"
              type: "Organization/Project object, default None"
              description: "Organization or Project object. Not necessary if starkbank.user was set before function call"
              section: "optional"
          returns:
            - "list of Transaction objects with updated attributes"
            - "cursor to retrieve the next page of Transaction objects"

    TransactionCreate:
      type: object
      description: "Transaction creation request"
      properties:
        amount:
          type: integer
          format: int64
          description: "amount in cents to be transferred. ex: 1234 (= R$ 12.34)"
        description:
          type: string
          description: "text to be displayed in the receiver and the sender statements (Min. 10 characters). ex: \"funds redistribution\""
        externalId:
          type: string
          description: "unique id, generated by user, to avoid duplicated transactions. ex: \"transaction ABC 2020-03-30\""
        receiverId:
          type: string
          description: "unique id of the receiving workspace. ex: \"5656565656565656\""
        tags:
          type: array
          items:
            type: string
          description: "list of strings for reference when searching transactions (may be empty). ex: [\"abc\", \"test\"]"
      required:
        - amount
        - description
        - externalId
        - receiverId
