              description: "Organization or Project object. Not necessary if starkbank.user was set before function call"
              section: "optional"
          returns:
            - "VerifiedAccount object with updated attributes"
        query:
          summary: "Retrieve VerifiedAccounts"
          description:
            - "Receive a generator of VerifiedAccount objects previously created in the Stark Bank API"
          params:
            - name: "limit"
              type: "integer, default None"
              description: "maximum number of objects to be retrieved. Unlimited if None. ex: 35"
              section: "optional"
