# fonte: starkbank/sdk-python@65fc3f8 · starkbank/verifiedaccount/__verifiedaccount.py
components:
  schemas:
    VerifiedAccount:
      type: object
      description: "When you initialize a VerifiedAccount, the entity will not be automatically created in the Stark Bank API. The 'create' function sends the objects to the Stark Bank API and returns the list of created objects."
      properties:
        taxId:
          type: string
          description: "receiver tax ID (CPF or CNPJ) with or without formatting. ex: \"01234567890\" or \"20.018.183/0001-80\""
        bankCode:
          type: string
          description: "code of the receiver bank institution in Brazil. If an ISPB (8 digits) is informed, a Pix transfer will be created, else a TED will be issued. The bank_code parameter is required if verifying with bank details. ex: \"20018183\" or \"341\""
        branchCode:
          type: string
          description: "receiver bank account branch. Use \"-\" in case there is a verifier digit. ex: \"1357-9\". The branch_code parameter is required if verifying with bank details."
        keyId:
          type: string
          description: "pix key identifier. ex: \"tony@starkbank.com\", \"012.345.678-90\". The key_id parameter is required if verifying with Pix key."
        name:
          type: string
          description: "receiver full name. ex: \"Anthony Edward Stark\". The name parameter is required if verifying with bank details."
        number:
          type: string
          description: "receiver bank account number. Use \"-\" before the verifier digit. ex: \"876543-2\". The number parameter is required if verifying with bank details."
        type:
          type: string
          description: "verified account type. ex: \"checking\", \"savings\", \"salary\" or \"payment\". The type parameter is required if verifying with bank details."
        tags:
          type: array
          items:
            type: string
          description: "list of strings for reference when searching for verified accounts. ex: [\"employees\", \"monthly\"]"
        id:
          type: string
          description: "unique id returned when the VerifiedAccount is created. ex: \"5656565656565656\""
          x-sdk-id: true
        bankName:
          type: string
          description: "bank name associated with the verified account. ex: \"Stark Bank\""
        status:
          type: string
          description: "current verified account status. ex: \"creating\", \"created\", \"processing\", \"active\", \"failed\" or \"canceled\""
        created:
          type: string
          format: date-time
          description: "creation datetime for the verified account. ex: datetime.datetime(2020, 3, 10, 10, 30, 0, 0)"
        updated:
          type: string
          format: date-time
          description: "latest update datetime for the verified account. ex: datetime.datetime(2020, 3, 10, 10, 30, 0, 0)"
      required:
        - taxId
        - id
        - bankName
        - status
        - created
        - updated
