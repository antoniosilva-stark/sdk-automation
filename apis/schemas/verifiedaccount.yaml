        branchCode:
          type: string
          description: "receiver bank account branch. Use \"-\" in case there is a verifier digit. ex: \"1357-9\". The branch_code parameter is required if verifying with bank details."
        keyId:
          type: string
          description: "pix key identifier. ex: \"tony@starkbank.com\", \"012.345.678-90\". The key_id parameter is required if verifying with Pix key."
        name:
          type: string
          description: "receiver full name. ex: \"Anthony Edward Stark\". The name parameter is required if verifying with bank details."
        number:
          type: string
          description: "receiver bank account number. Use \"-\" before the verifier digit. ex: \"876543-2\". The number parameter is required if verifying with bank details."
        type:
          type: string
          description: "verified account type. ex: \"checking\", \"savings\", \"salary\" or \"payment\". The type parameter is required if verifying with bank details."
        tags:
