# fonte: starkbank/sdk-python@65fc3f8 · starkbank/boletopayment/__boletopayment.py
components:
  schemas:
    BoletoPayment:
      type: object
      description: "When you initialize a BoletoPayment, the entity will not be automatically created in the Stark Bank API. The 'create' function sends the objects to the Stark Bank API and returns the list of created objects."
      properties:
        line:
          type: string
          description: "Number sequence that describes the payment. Either 'line' or 'bar_code' parameters are required. If both are sent, they must match. ex: \"34191.09008 63571.277308 71444.640008 5 81960000000062\""
        barCode:
          type: string
          description: "Bar code number that describes the payment. Either 'line' or 'barCode' parameters are required. If both are sent, they must match. ex: \"34195819600000000621090063571277307144464000\""
        taxId:
          type: string
          description: "receiver tax ID (CPF or CNPJ) with or without formatting. ex: \"01234567890\" or \"20.018.183/0001-80\""
        description:
          type: string
          description: "Text to be displayed in your statement (min. 10 characters). ex: \"payment ABC\""
        amount:
          type: integer
          format: int64
          description: "amount to be paid. If none is informed, the current boleto value will be used. ex: 23456 (= R$ 234.56)"
        scheduled:
          type: string
          format: date
          description: "payment scheduled date. ex: datetime.date(2020, 3, 10)"
        tags:
          type: array
          items:
            type: string
          description: "list of strings for tagging. All tags will be converted to lowercase."
        id:
          type: string
          description: "unique id returned when payment is created. ex: \"5656565656565656\""
          x-sdk-id: true
        status:
          type: string
          description: "current payment status. ex: \"success\" or \"failed\""
        fee:
          type: integer
          description: "fee charged when the boleto payment is created. ex: 200 (= R$ 2.00)"
        transactionIds:
          type: array
          items:
            type: string
          description: "ledger transaction ids linked to this BoletoPayment. ex: [\"19827356981273\"]"
        created:
          type: string
          format: date-time
          description: "creation datetime for the payment. ex: datetime.datetime(2020, 3, 10, 10, 30, 0, 0)"
      required:
        - taxId
        - description
        - id
        - status
        - fee
        - transactionIds
        - created
      x-sdk-docs:
        create:
          summary: "Create BoletoPayments"
          description:
            - "Send a list of BoletoPayment objects for creation in the Stark Bank API"
          params:
            - name: "payments"
              type: "list of BoletoPayment objects"
              description: "list of BoletoPayment objects to be created in the API"
              section: "required"
            - name: "user"
              type: "Organization/Project object, default None"
              description: "Organization or Project object. Not necessary if starkbank.user was set before function call"
              section: "optional"
          returns:
            - "list of BoletoPayment objects with updated attributes"
        get:
          summary: "Retrieve a specific BoletoPayment"
          description:
            - "Receive a single BoletoPayment object previously created by the Stark Bank API by its id"
          params:
            - name: "id"
              type: "string"
              description: "object unique id. ex: \"5656565656565656\""
              section: "required"
            - name: "user"
              type: "Organization/Project object, default None"
              description: "Organization or Project object. Not necessary if starkbank.user was set before function call"
              section: "optional"
          returns:
            - "BoletoPayment object with updated attributes"
        query:
          summary: "Retrieve BoletoPayments"
          description:
            - "Receive a generator of BoletoPayment objects previously created in the Stark Bank API"
          params:
            - name: "limit"
              type: "integer, default None"
              description: "maximum number of objects to be retrieved. Unlimited if None. ex: 35"
              section: "optional"
            - name: "after"
              type: "datetime.date or string, default None"
              description: "date filter for objects created only after specified date. ex: datetime.date(2020, 3, 10)"
              section: "optional"
            - name: "before"
              type: "datetime.date or string, default None"
              description: "date filter for objects created only before specified date. ex: datetime.date(2020, 3, 10)"
              section: "optional"
            - name: "tags"
              type: "list of strings, default None"
              description: "tags to filter retrieved objects. ex: [\"tony\", \"stark\"]"
              section: "optional"
            - name: "ids"
              type: "list of strings, default None"
              description: "list of ids to filter retrieved objects. ex: [\"5656565656565656\", \"4545454545454545\"]"
              section: "optional"
            - name: "status"
              type: "string, default None"
              description: "filter for status of retrieved objects. ex: \"success\""
              section: "optional"
            - name: "user"
              type: "Organization/Project object, default None"
              description: "Organization or Project object. Not necessary if starkbank.user was set before function call"
              section: "optional"
          returns:
            - "generator of BoletoPayment objects with updated attributes"
        page:
          summary: "Retrieve paged BoletoPayments"
          description:
            - "Receive a list of up to 100 BoletoPayment objects previously created in the Stark Bank API and the cursor to the next page."
            - "Use this function instead of query if you want to manually page your requests."
          params:
            - name: "cursor"
              type: "string, default None"
              description: "cursor returned on the previous page function call"
              section: "optional"
            - name: "limit"
              type: "integer, default 100"
              description: "maximum number of objects to be retrieved. It must be an integer between 1 and 100. ex: 50"
              section: "optional"
            - name: "after"
              type: "datetime.date or string, default None"
