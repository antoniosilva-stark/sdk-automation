        delete:
          summary: "Delete a BoletoPayment entity"
          description:
            - "Cancel a BoletoPayment entity previously created in the Stark Bank API. This only cancels payments that have not yet started processing; payments already processed can still be deleted, but the payment itself is not reversed."
          params:
            - name: "id"
              type: "string"
              description: "BoletoPayment unique id. ex: \"5656565656565656\""
              section: "required"
            - name: "user"
              type: "Organization/Project object, default None"
              description: "Organization or Project object. Not necessary if starkbank.user was set before function call"
              section: "optional"
          returns:
            - "deleted BoletoPayment object"
        pdf:
          summary: "Retrieve a specific BoletoPayment pdf file"
          description:
            - "Receive a single BoletoPayment pdf file generated in the Stark Bank API by its id."
            - "Only valid for boleto payments with \"success\", \"processing\" or \"created\" status."
          params:
