# fonte: starkbank/sdk-python@65fc3f8 · starkbank/paymentpreview/__paymentpreview.py
components:
  schemas:
    PaymentPreview:
      type: object
      description: "A PaymentPreview is used to get information from a payment code before confirming the payment. This resource can be used to preview BR Codes and bar codes of boleto, tax and utility payments"
      properties:
        id:
          type: string
          description: "Main identification of the payment. This should be the BR Code for Pix payments and lines or bar codes for payment slips. ex: \"34191.09008 63571.277308 71444.640008 5 81960000000062\", \"00020126580014br.gov.bcb.pix0136a629532e-7693-4846-852d-1bbff817b5a8520400005303986540510.005802BR5908T'Challa6009Sao Paulo62090505123456304B14A\""
          x-sdk-id: true
        scheduled:
          type: string
          format: date
          description: "intended payment date. Right now, this parameter only has effect on BrcodePreviews. ex: datetime.date(2020, 3, 10)"
        type:
          type: string
          description: "Payment type. ex: \"brcode-payment\", \"boleto-payment\", \"utility-payment\" or \"tax-payment\""
        payment:
          type: string
          description: "Information preview of the informed payment."
      required:
        - id
        - type
        - payment
      x-sdk-docs:
        create:
          summary: "Create PaymentPreviews"
          description:
            - "Send a list of PaymentPreviews objects for processing in the Stark Bank API"
          params:
            - name: "previews"
              type: "list of PaymentPreviews objects"
              description: "list of PaymentPreviews objects to be created in the API"
              section: "required"
            - name: "user"
              type: "Organization/Project object, default None"
              description: "Organization or Project object. Not necessary if starkbank.user was set before function call"
              section: "optional"
          returns:
            - "list of PaymentPreviews objects with updated attributes"

    PaymentPreviewCreate:
      type: object
      description: "PaymentPreview creation request"
      properties:
        id:
          type: string
          description: "Main identification of the payment. This should be the BR Code for Pix payments and lines or bar codes for payment slips. ex: \"34191.09008 63571.277308 71444.640008 5 81960000000062\", \"00020126580014br.gov.bcb.pix0136a629532e-7693-4846-852d-1bbff817b5a8520400005303986540510.005802BR5908T'Challa6009Sao Paulo62090505123456304B14A\""
        scheduled:
          type: string
          format: date
          description: "intended payment date. Right now, this parameter only has effect on BrcodePreviews. ex: datetime.date(2020, 3, 10)"
      required:
        - id
