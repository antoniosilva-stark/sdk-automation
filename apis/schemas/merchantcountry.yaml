          type: string
          description: "country's code. ex: \"BRA\""
        name:
          type: string
          description: "country's name. ex: \"Brazil\""
        number:
          type: string
          description: "country's number. ex: \"076\""
        shortCode:
          type: string
          description: "country's short code. ex: \"BR\""
      required:
        - code
        - name
        - number
        - shortCode
      x-sdk-docs:
        query:
          summary: "Retrieve MerchantCountries"
          description:
            - "Receive a generator of MerchantCountry objects previously created in the Stark Bank API"
          params:
            - name: "search"
              type: "string, default None"
              description: "keyword to search for code, name, number or short_code"
              section: "optional"
            - name: "user"
              type: "Organization/Project object, default None"
              description: "Organization or Project object. Not necessary if starkbank.user was set before function call"
              section: "optional"
          returns:
            - "generator of MerchantCountry objects with updated attributes"

    MerchantCountryCreate:
      type: object
      description: "MerchantCountry creation request"
