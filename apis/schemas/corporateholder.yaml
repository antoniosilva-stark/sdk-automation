components:
  schemas:
    CorporateHolder:
      type: object
      description: "The CorporateHolder describes a card holder that may group several cards. When you initialize a CorporateHolder, the entity will not be automatically created in the Stark Bank API. The 'create' function sends the objects to the Stark Bank API and returns the created object."
      properties:
        id:
          type: string
          description: "unique id returned when CorporateHolder is created. ex: \"5656565656565656\""
        name:
          type: string
          description: "cardholder name. ex: \"Tony Stark\""
        centerId:
          type: string
          description: "target cost center ID. ex: \"5656565656565656\""
        permissions:
          type: array
          items:
            type: object
          description: "list of Permission object representing access granted to an user for a particular cardholder."
        rules:
          type: array
          items:
            type: object
          description: "[EXPANDABLE] list of holder spending rules"
        tags:
          type: array
          items:
            type: string
          description: "list of strings for tagging. ex: [\"travel\", \"food\"]"
        status:
          type: string
          description: "current CorporateHolder status. ex: \"active\", \"blocked\", \"canceled\""
        updated:
          type: string
          format: date-time
          description: "latest update datetime for the CorporateHolder. ex: datetime.datetime(2020, 3, 10, 10, 30, 0, 0)"
        created:
          type: string
          format: date-time
          description: "creation datetime for the CorporateHolder. ex: datetime.datetime(2020, 3, 10, 10, 30, 0, 0)"
      required:
        - id
        - name
        - status
        - updated
        - created

    CorporateHolderCreate:
      type: object
      description: "CorporateHolder creation request"
      properties:
        name:
          type: string
          description: "cardholder name. ex: \"Tony Stark\""
        centerId:
          type: string
          description: "target cost center ID. ex: \"5656565656565656\""
        permissions:
          type: array
          items:
            type: object
          description: "list of Permission object representing access granted to an user for a particular cardholder."
        rules:
          type: array
          items:
            type: object
          description: "[EXPANDABLE] list of holder spending rules"
        tags:
          type: array
          items:
            type: string
          description: "list of strings for tagging. ex: [\"travel\", \"food\"]"
      required:
        - name
