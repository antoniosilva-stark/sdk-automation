# fonte: starkbank/sdk-python@65fc3f8 · starkbank/merchantcategory/__merchantcategory.py
components:
  schemas:
    MerchantCategory:
      type: object
      description: "MerchantCategory's codes and types are used to define categories filters in CorporateRules. A MerchantCategory filter must define exactly one parameter between code and type. A type, such as \"food\", \"services\", etc., defines an entire group of merchant codes, whereas a code only specifies a specific MCC."
      properties:
        code:
          type: string
          description: "category's code. ex: \"veterinaryServices\", \"fastFoodRestaurants\""
        type:
          type: string
          description: "category's type. ex: \"pets\", \"food\""
        name:
          type: string
          description: "category's name. ex: \"Veterinary services\", \"Fast food restaurants\""
        number:
          type: string
          description: "category's number. ex: \"742\", \"5814\""
      required:
        - name
        - number
      x-sdk-docs:
        query:
          summary: "Retrieve MerchantCategories"
          description:
            - "Receive a generator of MerchantCategory objects previously created in the Stark Bank API"
          params:
            - name: "search"
              type: "string, default None"
              description: "keyword to search for code, type, name or number"
              section: "optional"
            - name: "user"
              type: "Organization/Project object, default None"
              description: "Organization or Project object. Not necessary if starkbank.user was set before function call"
              section: "optional"
          returns:
            - "generator of MerchantCategory objects with updated attributes"

    MerchantCategoryCreate:
      type: object
      description: "MerchantCategory creation request"
      properties:
        code:
          type: string
          description: "category's code. ex: \"veterinaryServices\", \"fastFoodRestaurants\""
        type:
          type: string
          description: "category's type. ex: \"pets\", \"food\""
