# fonte: starkbank/sdk-python@65fc3f8 · starkbank/deposit/__deposit.py
components:
  schemas:
    Deposit:
      type: object
      description: "Deposits represent passive cash-in received by your account from external transfers"
      properties:
        id:
          type: string
          description: "unique id associated with a Deposit when it is created. ex: \"5656565656565656\""
          x-sdk-id: true
        name:
          type: string
          description: "payer name. ex: \"Iron Bank S.A.\""
        taxId:
          type: string
          description: "payer tax ID (CPF or CNPJ). ex: \"012.345.678-90\" or \"20.018.183/0001-80\""
        bankCode:
          type: string
          description: "payer bank code in Brazil. ex: \"20018183\" or \"341\""
        branchCode:
          type: string
          description: "payer bank account branch. ex: \"1357-9\""
        accountNumber:
          type: string
          description: "payer bank account number. ex: \"876543-2\""
        accountType:
          type: string
          description: "payer bank account type. ex: \"checking\""
        amount:
          type: integer
          format: int64
          description: "Deposit value in cents. ex: 1234 (= R$ 12.34)"
        type:
          type: string
          description: "Type of settlement that originated the deposit. ex: \"pix\" or \"ted\""
        status:
          type: string
          description: "current Deposit status. ex: \"created\""
        tags:
          type: array
          items:
            type: string
          description: "list of strings that are tagging the deposit. ex: [\"reconciliationId\", \"txId\"]"
        fee:
          type: integer
          description: "fee charged by this deposit. ex: 50 (= R$ 0.50)"
        transactionIds:
          type: array
          items:
            type: string
          description: "ledger transaction ids linked to this deposit (if there are more than one, all but the first are reversals or failed reversal chargebacks). ex: [\"19827356981273\"]"
        created:
          type: string
          format: date-time
          description: "creation datetime for the Deposit. ex: datetime.datetime(2020, 12, 10, 10, 30, 0, 0)"
        updated:
          type: string
          format: date-time
          description: "latest update datetime for the Deposit. ex: datetime.datetime(2020, 12, 10, 10, 30, 0, 0)"
      required:
        - id
        - name
        - taxId
        - bankCode
        - branchCode
        - accountNumber
        - accountType
        - amount
        - type
        - status
        - tags
        - fee
        - transactionIds
        - created
        - updated
      x-sdk-docs:
        get:
          summary: "Retrieve a specific Deposit"
          description:
            - "Receive a single Deposit object from the Stark Bank API by its id"
          params:
            - name: "id"
              type: "string"
              description: "object unique id. ex: \"5656565656565656\""
              section: "required"
            - name: "user"
              type: "Organization/Project object, default None"
              description: "Organization or Project object. Not necessary if starkbank.user was set before function call"
              section: "optional"
          returns:
            - "Deposit object with updated attributes"
        query:
          summary: "Retrieve Deposits"
          description:
            - "Receive a generator of Deposit objects from the Stark Bank API"
          params:
            - name: "limit"
              type: "integer, default None"
              description: "maximum number of objects to be retrieved. Unlimited if None. ex: 35"
              section: "optional"
            - name: "after"
              type: "datetime.date or string, default None"
              description: "date filter for objects created only after specified date. ex: datetime.date(2020, 3, 10)"
              section: "optional"
            - name: "before"
              type: "datetime.date or string, default None"
              description: "date filter for objects created only before specified date. ex: datetime.date(2020, 3, 10)"
              section: "optional"
            - name: "status"
              type: "string, default None"
              description: "filter for status of retrieved objects. ex: \"paid\" or \"registered\""
              section: "optional"
            - name: "sort"
              type: "string, default \"-created\""
              description: "sort order considered in response. Valid options are \"created\" or \"-created\"."
              section: "optional"
            - name: "tags"
              type: "list of strings, default None"
              description: "tags to filter retrieved objects. ex: [\"tony\", \"stark\"]"
              section: "optional"
            - name: "ids"
              type: "list of strings, default None"
              description: "list of ids to filter retrieved objects. ex: [\"5656565656565656\", \"4545454545454545\"]"
