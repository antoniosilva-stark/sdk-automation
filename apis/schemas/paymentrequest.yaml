              description: "maximum number of objects to be retrieved. Unlimited if None. ex: 35"
              section: "optional"
            - name: "after"
              type: "datetime.date or string, default None"
              description: "date filter for objects created or updated only after specified date. ex: datetime.date(2020, 3, 10)"
              section: "optional"
            - name: "before"
              type: "datetime.date or string, default None"
              description: "date filter for objects created or updated only before specified date. ex: datetime.date(2020, 3, 10)"
              section: "optional"
            - name: "sort"
              type: "string, default \"-created\""
              description: "sort order considered in response. Valid options are \"-created\" or \"-due\"."
