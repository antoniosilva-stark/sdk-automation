# fonte: starkbank/sdk-python@65fc3f8 · starkbank/cardmethod/__cardmethod.py
components:
  schemas:
    CardMethod:
      type: object
      description: "CardMethod's codes are used to define methods filters in CorporateRules."
      properties:
        code:
          type: string
          enum: ['chip', 'token', 'server', 'manual', 'magstripe', 'contactless']
          description: "method's code. Options: \"chip\", \"token\", \"server\", \"manual\", \"magstripe\", \"contactless\""
        name:
          type: string
          description: "method's name. ex: \"token\""
        number:
          type: string
          description: "method's number. ex: \"81\""
      required:
        - code
        - name
        - number
      x-sdk-docs:
        query:
          summary: "Retrieve CardMethods"
          description:
            - "Receive a generator of CardMethod objects previously created in the Stark Bank API"
          params:
            - name: "search"
              type: "string, default None"
              description: "keyword to search for code, name, number or short_code"
              section: "optional"
            - name: "user"
              type: "Organization/Project object, default None"
              description: "Organization or Project object. Not necessary if starkbank.user was set before function call"
              section: "optional"
          returns:
            - "generator of CardMethod objects with updated attributes"

    CardMethodCreate:
      type: object
      description: "CardMethod creation request"
      properties:
        code:
          type: string
          enum: ['chip', 'token', 'server', 'manual', 'magstripe', 'contactless']
          description: "method's code. Options: \"chip\", \"token\", \"server\", \"manual\", \"magstripe\", \"contactless\""
      required:
        - code
