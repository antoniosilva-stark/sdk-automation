              description: "object unique id. ex: \"5656565656565656\""
              section: "required"
            - name: "user"
              type: "Organization/Project object, default None"
              description: "Organization or Project object. Not necessary if starkbank.user was set before function call"
              section: "optional"
          returns:
            - "SplitReceiver object with updated attributes"
        query:
          summary: "Retrieve SplitReceivers"
          description:
            - "Receive a generator of SplitReceiver objects previously created in the Stark Bank API"
          params:
            - name: "limit"
              type: "integer, default None"
              description: "maximum number of objects to be retrieved. Unlimited if None. ex: 35"
              section: "optional"
            - name: "after"
              type: "datetime.date or string, default None"
              description: "date filter for objects created or updated only after specified date. ex: datetime.date(2020, 3, 10)"
              section: "optional"
