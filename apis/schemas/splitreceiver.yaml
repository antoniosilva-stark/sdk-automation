              type: "list of SplitReceiver objects"
              description: "list of SplitReceiver objects to be created in the API"
              section: "required"
            - name: "user"
              type: "Organization/Project object, default None"
              description: "Organization or Project object. Not necessary if starkbank.user was set before function call"
              section: "optional"
          returns:
            - "list of SplitReceiver objects with updated attributes"
        get:
          summary: "Retrieve a specific SplitReceiver"
          description:
            - "Receive a single SplitReceiver object previously created in the Stark Bank API by its id"
          params:
            - name: "id"
