                section: "optional"
            returns:
              - "darfpayment.Log object with updated attributes"
          query:
            summary: "Retrieve darfpayment.Log's"
            description:
              - "Receive a generator of darfpayment.Log objects previously created in the Stark Bank API"
            params:
              - name: "limit"
                type: "integer, default None"
