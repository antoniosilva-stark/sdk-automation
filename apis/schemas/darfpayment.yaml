                section: "optional"
              - name: "types"
                type: "list of strings, default None"
                description: "filter retrieved objects by event types. ex: \"processing\" or \"success\""
                section: "optional"
              - name: "paymentIds"
                type: "list of strings, default None"
                description: "list of DarfPayment ids to filter retrieved objects. ex: [\"5656565656565656\", \"4545454545454545\"]"
                section: "optional"
              - name: "user"
                type: "Project object, default None"
