# fonte: starkbank/sdk-python@65fc3f8 · starkbank/darfpayment/__darfpayment.py
components:
  schemas:
    DarfPayment:
      type: object
      description: "When you initialize a DarfPayment, the entity will not be automatically created in the Stark Bank API. The 'create' function sends the objects to the Stark Bank API and returns the list of created objects."
      properties:
        description:
          type: string
          description: "Text to be displayed in your statement (min. 10 characters). ex: \"payment ABC\""
        revenueCode:
          type: string
          description: "4-digit tax code assigned by Federal Revenue. ex: \"5948\""
        taxId:
          type: string
          description: "tax id (formatted or unformatted) of the payer. ex: \"12.345.678/0001-95\""
        competence:
          type: string
          format: date
          description: "competence month of the service. ex: datetime.date(2021, 4, 30)"
        nominalAmount:
          type: integer
          format: int64
          description: "amount due in cents without fee or interest. ex: 23456 (= R$ 234.56)"
        fineAmount:
          type: integer
          format: int64
          description: "fixed amount due in cents for fines. ex: 234 (= R$ 2.34)"
        interestAmount:
          type: integer
          format: int64
          description: "amount due in cents for interest. ex: 456 (= R$ 4.56)"
        due:
          type: string
          format: date
          description: "due date for payment. ex: datetime.date(2021, 5, 17)"
        referenceNumber:
          type: string
          description: "number assigned to the region of the tax. ex: \"08.1.17.00-4\""
        scheduled:
          type: string
          format: date
          description: "payment scheduled date. ex: datetime.date(2021, 5, 10)"
        tags:
          type: array
          items:
            type: string
          description: "list of strings for tagging. All tags will be converted to lowercase."
        id:
          type: string
          description: "unique id returned when payment is created. ex: \"5656565656565656\""
          x-sdk-id: true
        status:
          type: string
          description: "current payment status. ex: \"success\" or \"failed\""
        amount:
          type: integer
          format: int64
          description: "Total amount due calculated from other amounts. ex: 24146 (= R$ 241.46)"
        fee:
          type: integer
          description: "fee charged when the DarfPayment is processed. ex: 0 (= R$ 0.00)"
        transactionIds:
          type: array
          items:
            type: string
          description: "ledger transaction ids linked to this DarfPayment. ex: [\"19827356981273\"]"
        updated:
          type: string
          format: date-time
          description: "update datetime for the payment. ex: datetime.datetime(2020, 3, 10, 10, 30, 0, 0)"
        created:
          type: string
          format: date-time
          description: "creation datetime for the payment. ex: datetime.datetime(2020, 3, 10, 10, 30, 0, 0)"
      required:
        - description
        - revenueCode
        - taxId
        - competence
        - nominalAmount
        - fineAmount
        - interestAmount
        - due
        - id
        - status
        - amount
        - fee
        - transactionIds
        - updated
        - created
      x-sdk-docs:
        create:
          summary: "Create DarfPayments"
          description:
            - "Send a list of DarfPayment objects for creation in the Stark Bank API"
          params:
            - name: "payments"
              type: "list of DarfPayment objects"
              description: "list of DarfPayment objects to be created in the API"
              section: "required"
            - name: "user"
              type: "Organization/Project object"
              description: "Organization or Project object. Not necessary if starkbank.user was set before function call"
              section: "optional"
          returns:
            - "list of DarfPayment objects with updated attributes"
        get:
          summary: "Retrieve a specific DarfPayment"
          description:
            - "Receive a single DarfPayment object previously created by the Stark Bank API by passing its id"
          params:
            - name: "id"
              type: "string"
              description: "object unique id. ex: \"5656565656565656\""
              section: "required"
            - name: "user"
              type: "Organization/Project object"
              description: "Organization or Project object. Not necessary if starkbank.user was set before function call"
              section: "optional"
          returns:
            - "DarfPayment object with updated attributes"
        query:
          summary: "Retrieve DarfPayments"
          description:
            - "Receive a generator of DarfPayment objects previously created in the Stark Bank API"
          params:
            - name: "limit"
              type: "integer, default None"
              description: "maximum number of objects to be retrieved. Unlimited if None. ex: 35"
              section: "optional"
            - name: "after"
              type: "datetime.date or string, default None"
              description: "date filter for objects created only after specified date. ex: datetime.date(2020, 3, 10)"
              section: "optional"
            - name: "before"
              type: "datetime.date or string, default None"
              description: "date filter for objects created only before specified date. ex: datetime.date(2020, 3, 10)"
              section: "optional"
            - name: "tags"
              type: "list of strings, default None"
              description: "tags to filter retrieved objects. ex: [\"tony\", \"stark\"]"
              section: "optional"
            - name: "ids"
              type: "list of strings, default None"
              description: "list of ids to filter retrieved objects. ex: [\"5656565656565656\", \"4545454545454545\"]"
              section: "optional"
            - name: "status"
              type: "string, default None"
              description: "filter for status of retrieved objects. ex: \"success\""
              section: "optional"
            - name: "user"
              type: "Project object, default None"
              description: "Project object. Not necessary if starkbank.user was set before function call"
              section: "optional"
          returns:
            - "generator of DarfPayment objects with updated attributes"
        page:
          summary: "Retrieve paged DarfPayments"
          description:
            - "Receive a list of up to 100 DarfPayment objects previously created in the Stark Bank API and the cursor to the next page."
            - "Use this function instead of query if you want to manually page your requests."
          params:
            - name: "cursor"
              type: "string, default None"
              description: "cursor returned on the previous page function call"
              section: "optional"
            - name: "limit"
              type: "integer, default 100"
              description: "maximum number of objects to be retrieved. It must be an integer between 1 and 100. ex: 50"
              section: "optional"
            - name: "after"
              type: "datetime.date or string, default None"
              description: "date filter for objects created only after specified date. ex: datetime.date(2020, 3, 10)"
              section: "optional"
            - name: "before"
              type: "datetime.date or string, default None"
              description: "date filter for objects created only before specified date. ex: datetime.date(2020, 3, 10)"
              section: "optional"
            - name: "tags"
              type: "list of strings, default None"
              description: "tags to filter retrieved objects. ex: [\"tony\", \"stark\"]"
              section: "optional"
            - name: "ids"
              type: "list of strings, default None"
              description: "list of ids to filter retrieved objects. ex: [\"5656565656565656\", \"4545454545454545\"]"
              section: "optional"
            - name: "status"
              type: "string, default None"
              description: "filter for status of retrieved objects. ex: \"success\""
              section: "optional"
            - name: "user"
              type: "Organization/Project object, default None"
              description: "Organization or Project object. Not necessary if starkbank.user was set before function call"
              section: "optional"
          returns:
            - "list of DarfPayment objects with updated attributes"
            - "cursor to retrieve the next page of DarfPayment objects"
        delete:
          summary: "Delete a DarfPayment entity"
          description:
            - "Delete a DarfPayment entity previously created in the Stark Bank API. This only cancels payments that have not yet started processing; payments already processed can still be deleted, but are not reversed."
          params:
            - name: "id"
              type: "string"
              description: "DarfPayment unique id. ex: \"5656565656565656\""
              section: "required"
            - name: "user"
              type: "Organization/Project object"
              description: "Organization or Project object. Not necessary if starkbank.user was set before function call"
              section: "optional"
          returns:
            - "deleted DarfPayment object"
        pdf:
          summary: "Retrieve a specific DarfPayment pdf file"
          description:
            - "Receive a single DarfPayment pdf file generated in the Stark Bank API by passing its id."
            - "Only valid for darf payments with \"success\", \"processing\" or \"created\" status."
          params:
            - name: "id"
              type: "string"
              description: "object unique id. ex: \"5656565656565656\""
              section: "required"
            - name: "user"
              type: "Organization/Project object"
              description: "Organization or Project object. Not necessary if starkbank.user was set before function call"
              section: "optional"
          returns:
            - "DarfPayment pdf file"
        log:
          get:
            summary: "Retrieve a specific darfpayment.Log"
            description:
              - "Receive a single darfpayment.Log object previously created by the Stark Bank API by passing its id"
            params:
              - name: "id"
                type: "string"
                description: "object unique id. ex: \"5656565656565656\""
                section: "required"
              - name: "user"
