# fonte: starkbank/sdk-python@9ef6834 · starkbank/utilitypayment/__utilitypayment.py
components:
  schemas:
    UtilityPayment:
      type: object
      description: "When you initialize a UtilityPayment, the entity will not be automatically created in the Stark Bank API. The 'create' function sends the objects to the Stark Bank API and returns the list of created objects."
      properties:
        id:
          type: string
          description: "unique id returned when payment is created. ex: \"5656565656565656\""
        line:
          type: string
          description: "Number sequence that describes the payment. Either 'line' or 'bar_code' parameters are required. If both are sent, they must match. ex: \"34191.09008 63571.277308 71444.640008 5 81960000000062\""
        barCode:
          type: string
          description: "Bar code number that describes the payment. Either 'line' or 'barCode' parameters are required. If both are sent, they must match. ex: \"34195819600000000621090063571277307144464000\""
        description:
          type: string
          description: "Text to be displayed in your statement (min. 10 characters). ex: \"payment ABC\""
        scheduled:
          type: string
          format: date
          description: "payment scheduled date. ex: datetime.date(2020, 3, 10)"
        tags:
          type: array
          items:
            type: string
          description: "list of strings for tagging"
        status:
          type: string
          description: "current payment status. ex: \"success\" or \"failed\""
        amount:
          type: integer
          format: int64
          description: "amount automatically calculated from line or bar_code. ex: 23456 (= R$ 234.56)"
        fee:
          type: integer
          description: "fee charged when utility payment is created. ex: 200 (= R$ 2.00)"
        type:
          type: string
          description: "payment type. ex: \"utility\""
        transactionIds:
          type: array
          items:
            type: string
          description: "ledger transaction ids linked to this UtilityPayment. ex: [\"19827356981273\"]"
        created:
          type: string
          format: date-time
          description: "creation datetime for the payment. ex: datetime.datetime(2020, 3, 10, 10, 30, 0, 0)"
        updated:
          type: string
          format: date-time
          description: "latest update datetime for the payment. ex: datetime.datetime(2020, 3, 10, 10, 30, 0, 0)"
      required:
        - id
        - description
        - status
        - amount
        - fee
        - type
        - transactionIds
        - created
        - updated

    UtilityPaymentCreate:
      type: object
      description: "UtilityPayment creation request"
      properties:
        line:
          type: string
          description: "Number sequence that describes the payment. Either 'line' or 'bar_code' parameters are required. If both are sent, they must match. ex: \"34191.09008 63571.277308 71444.640008 5 81960000000062\""
        barCode:
          type: string
          description: "Bar code number that describes the payment. Either 'line' or 'barCode' parameters are required. If both are sent, they must match. ex: \"34195819600000000621090063571277307144464000\""
        description:
          type: string
          description: "Text to be displayed in your statement (min. 10 characters). ex: \"payment ABC\""
        scheduled:
          type: string
          format: date
          description: "payment scheduled date. ex: datetime.date(2020, 3, 10)"
        tags:
          type: array
          items:
            type: string
          description: "list of strings for tagging"
      required:
        - description
