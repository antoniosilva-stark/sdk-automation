integerFormats:
  amount: int64
  balance: int64
  nominalAmount: int64
  fineAmount: int64
  interestAmount: int64
  discountAmount: int64

stringFormats:
  pdf: uri
  link: uri

# Tipo Java por campo, Recurso -> campo -> tipo. Medido contra sdk-java f60902a: o real tipa por familia de
# recurso, nao por regra global (Transfer `long`, Invoice `Number`, Corporate* `Long`, DarfPayment `String`), entao so
# entra aqui o campo em que o real foge do default do perfil de tools/java-code.py; o default vale para recurso novo.
# O tipo precisa ser um que o Map-ctor sabe ler (perfil: String, Integer, Long, Number, Float, Double, Boolean, Object,
# String[], List<Object>, mais long/int primitivos e Map/HashMap/List<String> por cast direto). Campo que o schema nao
# tem falha na geracao.
javaTypes:
  Balance:
    amount: long
  Boleto:
    amount: long
    fine: Number
    interest: Number
  BrcodePayment:
    amount: Number
  CorporateBalance:
    limit: Long
    maxLimit: Long
  CorporatePurchase:
    tax: Long
    issuerAmount: Long
    merchantAmount: Long
    merchantFee: Long
  CorporateRule:
    counterAmount: Number
  CorporateTransaction:
    tags: String[]
  # o real le os tres valores com Long.parseLong(String.valueOf(...)); o gerado le via ((Number) x).longValue()
  DarfPayment:
    nominalAmount: long
    fineAmount: long
    interestAmount: long
    amount: String
    fee: String
  Deposit:
    amount: long
  DynamicBrcode:
    amount: Number
    expiration: Number
  Invoice:
    amount: Number
    expiration: Number
    fine: Number
    interest: Number
    nominalAmount: Number
    fineAmount: Number
    interestAmount: Number
    discountAmount: Number
  InvoicePullSubscription:
    pullRetryLimit: Long
    amountMinLimit: Long
    data: Map<String, Object>
  MerchantCard:
    tags: List<String>
  MerchantInstallment:
    amount: long
    fee: int
    transactionIds: List<String>
  MerchantPurchase:
    amount: long
    installmentCount: int
    metadata: Map<String, Object>
  MerchantSession:
    allowedFundingTypes: List<String>
    expiration: Number
    allowedIps: List<String>
  Split:
    amount: long
  TaxPayment:
    amount: String
    fee: String
  Transaction:
    amount: long
  Transfer:
    amount: long
    metadata: HashMap<String, Object>
  VerifiedTransfer:
    amount: long
    metadata: HashMap<String, Object>
  Workspace:
    allowedTaxIds: List<String>

# Recursos cuja classe externa o real declara `public class`, sem `final`. O real nao e uniforme: 10 de 42 nao sao final
# (medido contra sdk-java f60902a); os outros 32 sao `final`, e esse segue como default do perfil para recurso novo.
# Valida-se contra o real em tests/test_java_field_types.py (cada nome nao e final e todo nao-final esta aqui).
javaOpenClasses:
  - DictKey
  - Event
  - Institution
  - MerchantCard
  - MerchantInstallment
  - MerchantPurchase
  - MerchantSession
  - PaymentPreview
  - Split
  - SplitReceiver

# Ordem dos parametros do construtor all-args (id incluido) e tipo do parametro quando difere do campo. O real nao a
# deriva do docstring Python: e dado do Java, medido contra sdk-java f60902a no construtor publico mais longo de
# cada classe externa. Recurso sem entrada usa a ordem e o tipo do campo no schema, que e o default para recurso novo.
# Valida-se contra o real em tests/test_java_field_types.py (cada entrada e o real; todo recurso de mesmo conjunto de
# nomes que o real esta coberto). Fora: CorporateWithdrawal (ctor package-private) e os de conjunto de nomes diferente.
javaConstructorOrder:
  Balance: [amount, currency, updated, id]
  Boleto: [amount, name, taxId, streetLine1, streetLine2, district, city, stateCode, zipCode, due, fine,
    interest, overdueLimit, receiverName, receiverTaxId, tags, descriptions, discounts, id, fee, line,
    barCode, status, transactionIds, workspaceId, created, ourNumber]
  BoletoPayment: [amount, taxId, tags, description, scheduled, line, barCode, id, fee, transactionIds, status, created]
  BrcodePayment: [brcode, taxId, description, amount, scheduled, name, tags, rules, id, status, type, transactionIds,
    fee, updated, created]
  CorporateCard: [holderName, displayName, rules, tags, streetLine1, streetLine2, district, city, stateCode, zipCode,
    id, holderId, type, status, number, securityCode, expiration, updated, created]
  CorporateHolder: [id, name, centerId, permissions, status, rules, tags, updated, created]
  CorporateInvoice: [id, name, brcode, due, link, amount, taxId, status, corporateTransactionId, tags, updated, created]
  CorporateRule: [id, name, amount, interval, schedule, purposes, currencyCode, categories, countries, methods,
    counterAmount, currencySymbol, currencyName]
  DarfPayment: [id, description, revenueCode, taxId, competence, nominalAmount, fineAmount, interestAmount, due,
    referenceNumber, scheduled, tags, status, amount, fee, transactionIds, updated, created]
  DictKey: [id, type, accountType, name, taxId, ownerType, bankName, ispb, branchCode, accountNumber, status]
  DynamicBrcode: [amount, expiration, tags, id, uuid, pictureUrl, displayDescription, rules, updated, created]
  Invoice: [amount, due, taxId, name, expiration, fine, interest, descriptions, discounts, rules, splits, pdf,
    link, tags, nominalAmount, fineAmount, interestAmount, discountAmount, id, brcode, fee,
    transactionIds, status, created, updated]
  MerchantInstallment: [id, amount, created, due, fee, fundingType, network, purchaseId, status, tags, transactionIds,
    updated]
  PaymentRequest: [id, centerId, payment, type, due, tags, amount, description, status, actions, updated, created]
  SplitReceiver: [name, taxId, bankCode, branchCode, accountNumber, accountType, id, tags, status, created, updated]
  TaxPayment: [id, line, barCode, description, tags, scheduled, status, amount, fee, transactionIds, type, updated,
