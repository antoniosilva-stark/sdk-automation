  DictKey: [id, type, accountType, name, taxId, ownerType, bankName, ispb, branchCode, accountNumber, status]
  DynamicBrcode: [amount, expiration, tags, id, uuid, pictureUrl, displayDescription, rules, updated, created]
  Event: [created, isDelivered, subscription, id, workspaceId]
  Invoice: [amount, due, taxId, name, expiration, fine, interest, descriptions, discounts, rules, splits, pdf,
