# Tipo Java por campo, Recurso -> campo -> tipo. Medido contra sdk-java f60902a: o real tipa por familia de
# recurso, nao por regra global (Transfer `long`, Invoice `Number`, Corporate* `Long`, DarfPayment `String`), entao so
# entra aqui o campo em que o real foge do default do perfil de tools/java-code.py; o default vale para recurso novo.
# O tipo precisa ser um que o Map-ctor sabe ler (perfil: String, Integer, Long, Number, Float, Double, Boolean, Object,
# String[], List<Object>, mais long/int primitivos e Map/HashMap/List<String>/Resource por cast direto). `List<E>` e o
# tipo do real, VERBATIM, para o campo que o schema descreve so como array de object: E e uma classe interna do proprio
# recurso (em javaInnerClasses, com ou sem o qualificador `Recurso.`) ou outro recurso gerado; o Map-ctor converte cada
# Map em E por um auxiliar `parseX`, como o real. Campo que o schema nao tem falha na geracao.
javaTypes:
  Balance:
    amount: long
  Boleto:
    amount: long
    fine: Number
    interest: Number
    descriptions: List<Boleto.Description>
    discounts: List<Boleto.Discount>
  BrcodePayment:
    amount: Number
    rules: List<BrcodePayment.Rule>
  CorporateBalance:
    limit: Long
    maxLimit: Long
  CorporateCard:
    rules: List<CorporateRule>
  CorporateHolder:
    permissions: List<Permission>
    rules: List<CorporateRule>
  CorporatePurchase:
    tax: Long
    issuerAmount: Long
    merchantAmount: Long
    merchantFee: Long
  CorporateRule:
    counterAmount: Number
    categories: List<MerchantCategory>
    countries: List<MerchantCountry>
    methods: List<CardMethod>
  CorporateTransaction:
    tags: String[]
  # o real le os tres valores com Long.parseLong(String.valueOf(...)); o gerado le via ((Number) x).longValue()
  DarfPayment:
    nominalAmount: long
    fineAmount: long
    interestAmount: long
    amount: String
    fee: String
  Deposit:
    amount: long
  DynamicBrcode:
    amount: Number
    expiration: Number
    rules: List<DynamicBrcode.Rule>
  Invoice:
    amount: Number
    expiration: Number
    fine: Number
    interest: Number
    nominalAmount: Number
    fineAmount: Number
    interestAmount: Number
    discountAmount: Number
    descriptions: List<Invoice.Description>
    discounts: List<Invoice.Discount>
    rules: List<Invoice.Rule>
    splits: List<Split>
  InvoicePullSubscription:
    pullRetryLimit: Long
    amountMinLimit: Long
    data: Map<String, Object>
  MerchantCard:
    tags: List<String>
  MerchantInstallment:
    amount: long
    fee: int
    transactionIds: List<String>
  MerchantPurchase:
    amount: long
    installmentCount: int
    metadata: Map<String, Object>
  MerchantSession:
    allowedFundingTypes: List<String>
    expiration: Number
    allowedIps: List<String>
    allowedInstallments: List<AllowedInstallment>
  PaymentRequest:
    payment: Resource
    actions: List<PaymentRequest.Action>
  Split:
    amount: long
  TaxPayment:
    amount: String
    fee: String
  Transaction:
    amount: long
  Transfer:
    amount: long
    metadata: HashMap<String, Object>
  VerifiedTransfer:
    amount: long
    metadata: HashMap<String, Object>
  Workspace:
    allowedTaxIds: List<String>

# Recursos cuja classe externa o real declara `public class`, sem `final`. O real nao e uniforme: 10 de 42 nao sao final
# (medido contra sdk-java f60902a); os outros 32 sao `final`, e esse segue como default do perfil para recurso novo.
# Valida-se contra o real em tests/test_java_field_types.py (cada nome nao e final e todo nao-final esta aqui).
javaOpenClasses:
  - DictKey
  - Event
  - Institution
  - MerchantCard
  - MerchantInstallment
  - MerchantPurchase
  - MerchantSession
  - PaymentPreview
  - Split
  - SplitReceiver

# Ordem dos parametros do construtor all-args (id incluido) e tipo do parametro quando difere do campo. O real nao a
# deriva do docstring Python: e dado do Java, medido contra sdk-java f60902a no construtor publico mais longo de
# cada classe externa. Recurso sem entrada usa a ordem e o tipo do campo no schema, que e o default para recurso novo.
# Valida-se contra o real em tests/test_java_field_types.py (cada entrada e o real; todo recurso de mesmo conjunto de
# nomes que o real esta coberto). Fora: CorporateWithdrawal (ctor package-private) e os de conjunto de nomes diferente.
javaConstructorOrder:
  Balance: [amount, currency, updated, id]
  Boleto: [amount, name, taxId, streetLine1, streetLine2, district, city, stateCode, zipCode, due, fine,
