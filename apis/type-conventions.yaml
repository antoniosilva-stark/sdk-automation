integerFormats:
  amount: int64
  balance: int64
  nominalAmount: int64
  fineAmount: int64
  interestAmount: int64
  discountAmount: int64

stringFormats:
  pdf: uri
  link: uri

# Tipo Java por campo, Recurso -> campo -> tipo. Medido contra sdk-java f60902a: o real tipa por familia de
# recurso, nao por regra global (Transfer `long`, Invoice `Number`, Corporate* `Long`, DarfPayment `String`), entao so
# entra aqui o campo em que o real foge do default do perfil de tools/java-code.py; o default vale para recurso novo.
# O tipo precisa ser um que o Map-ctor sabe ler (perfil: String, Integer, Long, Number, Float, Double, Boolean, Object,
# String[], List<Object>, mais long/int primitivos e Map/HashMap/List<String>/Resource por cast direto). `List<E>` e o
# tipo do real, VERBATIM, para o campo que o schema descreve so como array de object: E e uma classe interna do proprio
# recurso (em javaInnerClasses, com ou sem o qualificador `Recurso.`) ou outro recurso gerado; o Map-ctor converte cada
# Map em E por um auxiliar `parseX`, como o real. Campo que o schema nao tem falha na geracao.
javaTypes:
  Balance:
    amount: long
  Boleto:
    amount: long
    fine: Number
    interest: Number
    descriptions: List<Boleto.Description>
    discounts: List<Boleto.Discount>
  BrcodePayment:
    amount: Number
    rules: List<BrcodePayment.Rule>
  CorporateBalance:
    limit: Long
    maxLimit: Long
  CorporateCard:
    rules: List<CorporateRule>
  CorporateHolder:
    permissions: List<Permission>
    rules: List<CorporateRule>
  CorporatePurchase:
    tax: Long
    issuerAmount: Long
    merchantAmount: Long
    merchantFee: Long
  CorporateRule:
    counterAmount: Number
    categories: List<MerchantCategory>
    countries: List<MerchantCountry>
    methods: List<CardMethod>
  CorporateTransaction:
    tags: String[]
  # o real le os tres valores com Long.parseLong(String.valueOf(...)); o gerado le via ((Number) x).longValue()
  DarfPayment:
    nominalAmount: long
    fineAmount: long
    interestAmount: long
    amount: String
    fee: String
  Deposit:
    amount: long
  DynamicBrcode:
    amount: Number
    expiration: Number
    rules: List<DynamicBrcode.Rule>
  Invoice:
    amount: Number
    expiration: Number
    fine: Number
    interest: Number
    nominalAmount: Number
    fineAmount: Number
    interestAmount: Number
    discountAmount: Number
    descriptions: List<Invoice.Description>
    discounts: List<Invoice.Discount>
    rules: List<Invoice.Rule>
    splits: List<Split>
  InvoicePullSubscription:
    pullRetryLimit: Long
    amountMinLimit: Long
    data: Map<String, Object>
  MerchantCard:
    tags: List<String>
  MerchantInstallment:
    amount: long
    fee: int
    transactionIds: List<String>
  MerchantPurchase:
    amount: long
    installmentCount: int
    metadata: Map<String, Object>
  MerchantSession:
    allowedFundingTypes: List<String>
    expiration: Number
    allowedIps: List<String>
    allowedInstallments: List<AllowedInstallment>
  PaymentRequest:
    payment: Resource
    actions: List<PaymentRequest.Action>
  Split:
    amount: long
  TaxPayment:
    amount: String
    fee: String
  Transaction:
    amount: long
  Transfer:
    amount: long
    metadata: HashMap<String, Object>
  VerifiedTransfer:
    amount: long
    metadata: HashMap<String, Object>
  Workspace:
    allowedTaxIds: List<String>

# Recursos cuja classe externa o real declara `public class`, sem `final`. O real nao e uniforme: 10 de 42 nao sao final
# (medido contra sdk-java f60902a); os outros 32 sao `final`, e esse segue como default do perfil para recurso novo.
# Valida-se contra o real em tests/test_java_field_types.py (cada nome nao e final e todo nao-final esta aqui).
javaOpenClasses:
  - DictKey
  - Event
  - Institution
  - MerchantCard
  - MerchantInstallment
  - MerchantPurchase
  - MerchantSession
  - PaymentPreview
  - Split
  - SplitReceiver

# Ordem dos parametros do construtor all-args (id incluido) e tipo do parametro quando difere do campo. O real nao a
# deriva do docstring Python: e dado do Java, medido contra sdk-java f60902a no construtor publico mais longo de
# cada classe externa. Recurso sem entrada usa a ordem e o tipo do campo no schema, que e o default para recurso novo.
# Valida-se contra o real em tests/test_java_field_types.py (cada entrada e o real; todo recurso de mesmo conjunto de
# nomes que o real esta coberto). Fora: CorporateWithdrawal (ctor package-private) e os de conjunto de nomes diferente.
javaConstructorOrder:
  Balance: [amount, currency, updated, id]
  Boleto: [amount, name, taxId, streetLine1, streetLine2, district, city, stateCode, zipCode, due, fine,
    interest, overdueLimit, receiverName, receiverTaxId, tags, descriptions, discounts, id, fee, line,
    barCode, status, transactionIds, workspaceId, created, ourNumber]
  BoletoPayment: [amount, taxId, tags, description, scheduled, line, barCode, id, fee, transactionIds, status, created]
  BrcodePayment: [brcode, taxId, description, amount, scheduled, name, tags, rules, id, status, type, transactionIds,
    fee, updated, created]
  CorporateCard: [holderName, displayName, rules, tags, streetLine1, streetLine2, district, city, stateCode, zipCode,
    id, holderId, type, status, number, securityCode, expiration, updated, created]
  CorporateHolder: [id, name, centerId, permissions, status, rules, tags, updated, created]
  CorporateInvoice: [id, name, brcode, due, link, amount, taxId, status, corporateTransactionId, tags, updated, created]
  CorporateRule: [id, name, amount, interval, schedule, purposes, currencyCode, categories, countries, methods,
    counterAmount, currencySymbol, currencyName]
  DarfPayment: [id, description, revenueCode, taxId, competence, nominalAmount, fineAmount, interestAmount, due,
    referenceNumber, scheduled, tags, status, amount, fee, transactionIds, updated, created]
  DictKey: [id, type, accountType, name, taxId, ownerType, bankName, ispb, branchCode, accountNumber, status]
  DynamicBrcode: [amount, expiration, tags, id, uuid, pictureUrl, displayDescription, rules, updated, created]
  Invoice: [amount, due, taxId, name, expiration, fine, interest, descriptions, discounts, rules, splits, pdf,
    link, tags, nominalAmount, fineAmount, interestAmount, discountAmount, id, brcode, fee,
    transactionIds, status, created, updated]
  MerchantInstallment: [id, amount, created, due, fee, fundingType, network, purchaseId, status, tags, transactionIds,
    updated]
  PaymentRequest: [id, centerId, payment, type, due, tags, amount, description, status, actions, updated, created]
  SplitReceiver: [name, taxId, bankCode, branchCode, accountNumber, accountType, id, tags, status, created, updated]
  TaxPayment: [id, line, barCode, description, tags, scheduled, status, amount, fee, transactionIds, type, updated,
    created]
  Transaction: [amount, description, externalId, receiverId, senderId, tags, fee, created, source, balance, id]
  UtilityPayment: [amount, tags, description, scheduled, line, barCode, id, fee, type, transactionIds, status, created,
    updated]
  VerifiedAccount: [id, bankCode, bankName, branchCode, created, keyId, name, number, status, tags, taxId, type, updated]
  Workspace: [username, name, allowedTaxIds, status, id, organizationId, pictureUrl, created]

javaConstructorTypes:
  CorporateRule:
    counterAmount: Long
  Transaction:
    fee: int

# Classes internas simples que o real escreve a mao (a spec nao descreve sub-objeto) e o gerador emite a partir deste
# dado. Recurso -> classe interna -> `fields` (declaracao, ordem do real), `constructors` (construtores publicos
# posicionais: campos recebidos, os demais ficam null; [] e o sem argumentos), `map` (campos LIDOS do `X(Map)`, os demais
# ficam null; ausente = sem esse construtor), `final` (default true) e `classData` (nome do ClassData, so quando o real
# o declara). Medido contra sdk-java f60902a; valida-se contra o real em tests/test_java_field_types.py, nos dois sentidos.
# Fora (outras entregas): Log/Page/User dentro de Log (ME 9.4), Transfer.Rule (Deserializer manual), PaymentRequest.
# Deserializer, MerchantSession.Purchase e tudo do Event (ME 9.8).
javaInnerClasses:
  Boleto:
    Description:
      fields: {text: String, amount: Integer}
      constructors: [[text], [text, amount], []]
    Discount:
      fields: {date: String, percentage: Number}
      constructors: [[date, percentage], []]
  BrcodePayment:
    Rule:
      fields: {key: String, value: Number}
      constructors: [[key, value], []]
      map: [key, value]
  CorporateHolder:
    Permission:
      fields: {ownerId: String, ownerType: String, ownerEmail: String, ownerName: String, ownerPictureUrl: String,
        ownerStatus: String, created: String}
      constructors: [[ownerId, ownerType, ownerEmail, ownerName, ownerPictureUrl, ownerStatus, created]]
      map: [ownerId, ownerType]
  DynamicBrcode:
    Rule:
      fields: {key: String, value: "String[]"}
      constructors: [[key, value], []]
      map: [key, value]
  Invoice:
    Description:
      fields: {key: String, value: String}
      constructors: [[key, value], []]
    Discount:
      fields: {percentage: Number, due: String}
      constructors: [[percentage, due], []]
    Payment:
      fields: {amount: Integer, name: String, taxId: String, bankCode: String, branchCode: String,
        accountNumber: String, accountType: String, endToEndId: String, method: String}
      constructors: [[amount, name, taxId, bankCode, branchCode, accountNumber, accountType, endToEndId, method], []]
      classData: Payment
    Rule:
      fields: {key: String, value: "String[]"}
      constructors: [[key, value]]
      map: [key, value]
  MerchantSession:
    AllowedInstallment:
      fields: {totalAmount: long, count: int}
      constructors: [[totalAmount, count]]
      final: false
      classData: AllowedInstallments
  PaymentRequest:
    Action:
      fields: {name: String, action: String, type: String, id: String}
      constructors: [[name, action, type, id], []]

# Forma do Log interno, Recurso -> {names, errors}. O real nao e uniforme (medido contra sdk-java f60902a, 24 recursos com
# Log; 20 aqui, os 4 de forma propria ficam fora, ver LOG_EXCLUSIONS em tests/test_java_logs.py):
#   names:  `short` escreve `Log get(String id)`, `Generator<Log>`, `Log.Page page()`, `List<Log> logs` e `new Log.Page(...)`
#           (12 de 20); `qualified` escreve `Recurso.Log`, `Recurso.Log.Page` e `new Page(...)` (8 de 20), que e o que o
#           template emitia antes e segue valendo para recurso sem entrada.
#   errors: tipo do campo e do parametro do construtor all-args do Log: `String[]` (13 de 20), `List<ErrorElement>` (5) ou
#           `none` (2), sem campo, sem parametro e sem `@param errors`. So `List<ErrorElement>` importa ErrorElement.
# Valida-se contra o real em tests/test_java_logs.py (cada entrada e o real; todo Log simples do real esta aqui).
javaLogs:
  Boleto: {names: short, errors: "String[]"}
  BoletoPayment: {names: short, errors: "String[]"}
  BrcodePayment: {names: short, errors: "String[]"}
  CorporateCard: {names: qualified, errors: none}
  CorporateHolder: {names: qualified, errors: none}
  DarfPayment: {names: short, errors: "String[]"}
  Deposit: {names: short, errors: "String[]"}
  Invoice: {names: short, errors: "String[]"}
  InvoicePullRequest: {names: short, errors: "String[]"}
  InvoicePullSubscription: {names: short, errors: "String[]"}
  MerchantCard: {names: qualified, errors: "String[]"}
  MerchantPurchase: {names: qualified, errors: "List<ErrorElement>"}
  MerchantSession: {names: qualified, errors: "String[]"}
  Split: {names: qualified, errors: "List<ErrorElement>"}
  SplitProfile: {names: qualified, errors: "List<ErrorElement>"}
  SplitReceiver: {names: qualified, errors: "List<ErrorElement>"}
  TaxPayment: {names: short, errors: "String[]"}
  Transfer: {names: short, errors: "String[]"}
  UtilityPayment: {names: short, errors: "String[]"}
  VerifiedAccount: {names: short, errors: "List<ErrorElement>"}
