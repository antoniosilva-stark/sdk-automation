# Campo do schema que o Java nao declara na classe externa, Recurso -> lista de campos. A spec e compartilhada com as
# outras linguagens e descreve o campo; o real o tira da classe e do construtor, por isso o campo some da declaracao, do
# construtor all-args, do Map-ctor e do Javadoc. O Event do real nao tem `log` na base: cada subclasse declara o seu
# (javaEvents). Nao vale para o id, que o template sempre emite. Campo que o schema nao tem falha na geracao.
javaOmittedFields:
  Event: [log]

javaConstructorTypes:
  CorporateRule:
    counterAmount: Long
  Transaction:
    fee: int

# Classes internas simples que o real escreve a mao (a spec nao descreve sub-objeto) e o gerador emite a partir deste
# dado. Recurso -> classe interna -> `fields` (declaracao, ordem do real), `constructors` (construtores publicos
# posicionais: campos recebidos, os demais ficam null; [] e o sem argumentos), `map` (campos LIDOS do `X(Map)`, os demais
# ficam null; ausente = sem esse construtor), `final` (default true), `classData` (nome do ClassData, so quando o real
# o declara) e `classDataType`, obrigatorio com `classData`: `short` escreve `static ClassData data = new ClassData(...)`
# (Invoice.Payment) e `qualified` escreve `SubResource.ClassData` (MerchantSession.AllowedInstallment); o real nao e
# uniforme, entao e um eixo por classe, como javaLogs.classData. Mais duas chaves opcionais: `extends` (`SubResource`, o
# default, ou `Resource`: o `id` e o ultimo parametro de cada construtor com campos, repassado a `super(id)`, e o sem
# argumentos chama `super(null)`; sem campo `id` nem `map`) e `inner` (classes aninhadas, no mesmo formato, com nome unico
# no recurso). O tipo de um campo pode ser o proprio recurso ou o caminho qualificado de uma classe interna dele
# (`PaymentRequest.Log.User`), mas esse tipo nao entra em `map`. Medido contra sdk-java f60902a; valida-se contra o real em tests/test_java_field_types.py, nos dois sentidos.
# PaymentRequest.Log nao e um javaLogs: nao tem get/query/page (e o PaymentRequest nao tem `x-sdk-log`), entao e uma classe
# interna que estende Resource, com a User aninhada; e dele que o Event tira o tipo do log da subscription payment-request.
# Fora (outras entregas): Page dentro de Log (ME 9.4), Transfer.Rule (Deserializer manual), PaymentRequest.Deserializer,
# MerchantSession.Purchase e o Deserializer do Event (ME 9.8).
javaInnerClasses:
  Boleto:
    Description:
      fields: {text: String, amount: Integer}
      constructors: [[text], [text, amount], []]
    Discount:
      fields: {date: String, percentage: Number}
      constructors: [[date, percentage], []]
  BrcodePayment:
    Rule:
      fields: {key: String, value: Number}
      constructors: [[key, value], []]
      map: [key, value]
  CorporateHolder:
    Permission:
      fields: {ownerId: String, ownerType: String, ownerEmail: String, ownerName: String, ownerPictureUrl: String,
        ownerStatus: String, created: String}
      constructors: [[ownerId, ownerType, ownerEmail, ownerName, ownerPictureUrl, ownerStatus, created]]
      map: [ownerId, ownerType]
  DynamicBrcode:
    Rule:
      fields: {key: String, value: "String[]"}
      constructors: [[key, value], []]
      map: [key, value]
  Invoice:
    Description:
      fields: {key: String, value: String}
      constructors: [[key, value], []]
    Discount:
      fields: {percentage: Number, due: String}
      constructors: [[percentage, due], []]
    Payment:
      fields: {amount: Integer, name: String, taxId: String, bankCode: String, branchCode: String,
        accountNumber: String, accountType: String, endToEndId: String, method: String}
      constructors: [[amount, name, taxId, bankCode, branchCode, accountNumber, accountType, endToEndId, method], []]
      classData: Payment
      classDataType: short
    Rule:
      fields: {key: String, value: "String[]"}
      constructors: [[key, value]]
      map: [key, value]
  MerchantSession:
    AllowedInstallment:
      fields: {totalAmount: long, count: int}
      constructors: [[totalAmount, count]]
      final: false
      classData: AllowedInstallments
      classDataType: qualified
  PaymentRequest:
    Action:
      fields: {name: String, action: String, type: String, id: String}
      constructors: [[name, action, type, id], []]
    Log:
      extends: Resource
      fields: {created: String, updated: String, type: String, errors: "String[]", request: PaymentRequest,
        user: PaymentRequest.Log.User}
      constructors: [[created, updated, type, errors, request, user], []]
      classData: PaymentRequestLog
      classDataType: short
      inner:
        User:
          fields: {email: String, id: String, name: String, pictureUrl: String, status: String, type: String}
          constructors: [[email, id, name, pictureUrl, status, type], []]

# Forma do Log interno, Recurso -> {names, errors, classData}, as tres chaves obrigatorias, mais duas opcionais. O real nao e
# uniforme (medido contra sdk-java f60902a, 24 recursos com Log; 22 aqui, os 2 de forma propria ficam fora, ver
# LOG_EXCLUSIONS em tests/test_java_logs.py):
#   names:  `short` escreve `Log get(String id)`, `Generator<Log>`, `Log.Page page()`, `List<Log> logs` e `new Log.Page(...)`
#           (13 de 22); `qualified` escreve `Recurso.Log`, `Recurso.Log.Page` e `new Page(...)` (9 de 22), que e o que o
#           template emitia antes e segue valendo para recurso sem entrada.
#   errors: tipo do campo e do parametro do construtor all-args do Log: `String[]` (13 de 22), `List<ErrorElement>` (6) ou
#           `none` (3), sem campo, sem parametro e sem `@param errors`. So `List<ErrorElement>` importa ErrorElement.
#   classData: a linha `static ClassData data = new ClassData(<X>.class, ...)` do Log: `short` escreve `Log.class` (11 de 22) e
#           `qualified` `Recurso.Log.class` (11 de 22, o que o template emitia). E um eixo a parte dos nomes: DarfPayment e
#           TaxPayment usam nomes `short` e `Recurso.Log.class`.
#   extraFields: (opcional) campo String do Log alem de created, type, errors, entidade e id, nome -> texto da linha `@param`
#           do Javadoc do ctor (a descricao vem do docstring do Log no sdk-python). Declarado depois da entidade e
#           atribuido pelo ctor all-args (BoletoHolmes `updated`, CorporatePurchase `description` e `corporateTransactionId`).
#   ctor:   (opcional) ordem dos parametros do ctor all-args, uma permutacao de created, type, [errors], nome da entidade,
#           id e dos extras. Sem a chave vale created, type, [errors], entidade, id e os extras, o que o template emitia.
# Valida-se contra o real em tests/test_java_logs.py (cada entrada e o real, extras e ordem do ctor inclusos; todo Log do real
# que o modelo escreve esta aqui).
javaLogs:
  Boleto: {names: short, errors: "String[]", classData: short}
  BoletoHolmes:
    names: short
    errors: none
    classData: short
    extraFields: {updated: latest update datetime for the log}
  BoletoPayment: {names: short, errors: "String[]", classData: short}
  BrcodePayment: {names: short, errors: "String[]", classData: short}
  CorporateCard: {names: qualified, errors: none, classData: qualified}
  CorporateHolder: {names: qualified, errors: none, classData: qualified}
  CorporatePurchase:
    names: qualified
    errors: "List<ErrorElement>"
    classData: qualified
    extraFields:
      description: 'purchase descriptions. ex: "my_description"'
      corporateTransactionId: transaction ID related to the CorporateCard.
    ctor: [created, type, errors, purchase, description, id, corporateTransactionId]
  DarfPayment: {names: short, errors: "String[]", classData: qualified}
  Deposit: {names: short, errors: "String[]", classData: short}
  Invoice: {names: short, errors: "String[]", classData: short}
  InvoicePullRequest: {names: short, errors: "String[]", classData: short}
  InvoicePullSubscription: {names: short, errors: "String[]", classData: short}
  MerchantCard: {names: qualified, errors: "String[]", classData: qualified}
  MerchantPurchase: {names: qualified, errors: "List<ErrorElement>", classData: qualified}
  MerchantSession: {names: qualified, errors: "String[]", classData: qualified}
  Split: {names: qualified, errors: "List<ErrorElement>", classData: qualified}
  SplitProfile: {names: qualified, errors: "List<ErrorElement>", classData: qualified}
  SplitReceiver: {names: qualified, errors: "List<ErrorElement>", classData: qualified}
  TaxPayment: {names: short, errors: "String[]", classData: qualified}
  Transfer: {names: short, errors: "String[]", classData: short}
  UtilityPayment: {names: short, errors: "String[]", classData: short}
  VerifiedAccount: {names: short, errors: "List<ErrorElement>", classData: short}

# Forma da Page externa, Recurso -> {listName, names}, as duas chaves obrigatorias, so para recurso com `x-sdk-page` cuja Page
# real difere do default {listName: <recurso em lowerCamel>+"s", names: short}, que e o que o template emitia antes da secao
# existir e vale para recurso sem entrada (uma entrada igual ao default e redundante e o teste a recusa). Medido contra
# sdk-java f60902a:
#   listName: o campo `public List<X> <listName>` da Page, o parametro do ctor, a lista local de page(Map, User) e o
#             `Recurso.Page.<listName>` do Javadoc de retorno (BoletoPayment e outros 5 `payments`, DictKey `keys`...).
#   names:    `short` escreve `Page page()` nos quatro overloads (o que o template emitia) e `qualified` `Recurso.Page`
#             (8 de 32). O `new Page(...)` do corpo nao e comparado e compila nos dois casos, entao nao tem eixo.
# Fora da secao: CorporatePurchase (Page real sem `x-sdk-page` na spec) e dois desvios de um so ponto do real que nao sao
# um eixo: o overload page(Map) de UtilityPayment qualificado enquanto os outros tres sao `Page`, e o parametro
# `MerchantInstallments` (M maiuscula) do ctor da Page de MerchantInstallment. Valida-se contra o real em
# tests/test_java_pages.py, nos dois sentidos.
javaPages:
  BoletoHolmes: {listName: holmes, names: short}
  BoletoPayment: {listName: payments, names: short}
  BrcodePayment: {listName: payments, names: short}
  CorporateCard: {listName: cards, names: short}
  CorporateHolder: {listName: holders, names: qualified}
  CorporateInvoice: {listName: invoices, names: short}
  CorporateTransaction: {listName: corporateTransactions, names: qualified}
  CorporateWithdrawal: {listName: withdrawals, names: qualified}
  DarfPayment: {listName: payments, names: short}
  DictKey: {listName: keys, names: short}
  DynamicBrcode: {listName: brcodes, names: short}
  InvoicePullRequest: {listName: requests, names: short}
  InvoicePullSubscription: {listName: subscriptions, names: short}
  MerchantCard: {listName: merchantCards, names: qualified}
  MerchantInstallment: {listName: merchantInstallments, names: qualified}
  MerchantPurchase: {listName: merchantPurchases, names: qualified}
  MerchantSession: {listName: merchantSessions, names: qualified}
  PaymentRequest: {listName: requests, names: short}
  TaxPayment: {listName: payments, names: short}
  UtilityPayment: {listName: payments, names: short}
  VerifiedAccount: {listName: verifiedAccounts, names: qualified}

# Subclasses e Deserializer do Event, Recurso -> {subscriptions, gson}. O real escreve, para cada `subscription` do
# webhook, uma classe `<Recurso>Event` (campo `log` do tipo `<Recurso>.Log`, construtor all-args e sem argumentos) e um
# `case` no Deserializer; o dado e a lista ordenada das subscriptions em kebab-case, e o nome do recurso, da classe e do
# tipo do log saem dela (`boleto-holmes` -> BoletoHolmes -> BoletoHolmesEvent, BoletoHolmes.Log), entao cada
# subscription tem de dar um recurso gerado e nenhum nome se repete. A classe `Unknown<Recurso>` (log `JsonObject`) e o
# `default` do switch sao fixos. Os parametros do construtor das subclasses sao os da base (javaConstructorOrder).
#   subscriptions: (obrigatorio) as subscriptions na ordem do switch do real, sem repeticao.
#   gson:          (opcional) as subscriptions que o real deserializa com `GsonEvent.getInstance().fromJson(...)` em vez de
#                  `context.deserialize(...)`; subconjunto de subscriptions (payment-request).
# Valida-se contra o real em tests/test_java_events.py, nos dois sentidos. Fora: `parse` e o Attempt do Event.
javaEvents:
  Event:
    subscriptions: [transfer, boleto, boleto-payment, utility-payment, boleto-holmes, invoice, deposit, brcode-payment,
      tax-payment, darf-payment, invoice-pull-subscription, invoice-pull-request, verified-account, payment-request,
      merchant-purchase, merchant-session, merchant-installment, merchant-card]
    gson: [payment-request]
