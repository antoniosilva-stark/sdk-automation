# cada classe externa. Recurso sem entrada usa a ordem e o tipo do campo no schema, que e o default para recurso novo.
# Valida-se contra o real em tests/test_java_field_types.py (cada entrada e o real; todo recurso de mesmo conjunto de
# nomes que o real esta coberto, e o campo de javaExtraFields conta como campo da ordem). Fora: CorporateWithdrawal (ctor
# package-private) e os de conjunto de nomes diferente (Transfer e MerchantPurchase, que carregam campo da spec que o real nao tem).
