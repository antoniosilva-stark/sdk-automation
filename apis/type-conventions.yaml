    due, externalId, referenceCode, end, data, name, taxId, tags, status, bacenId, installmentId, brcode, created,
    updated, id]
  MerchantInstallment: [id, amount, created, due, fee, fundingType, network, purchaseId, status, tags, transactionIds,
