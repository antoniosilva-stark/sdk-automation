  CorporateCard: [holderName, displayName, rules, tags, streetLine1, streetLine2, district, city, stateCode, zipCode,
    id, holderId, type, status, number, securityCode, expiration, updated, created]
  CorporateHolder: [id, name, centerId, permissions, status, rules, tags, updated, created]
  CorporateInvoice: [id, name, brcode, due, link, amount, taxId, status, corporateTransactionId, tags, updated, created]
  CorporateRule: [id, name, amount, interval, schedule, purposes, currencyCode, categories, countries, methods,
    counterAmount, currencySymbol, currencyName]
  DarfPayment: [id, description, revenueCode, taxId, competence, nominalAmount, fineAmount, interestAmount, due,
