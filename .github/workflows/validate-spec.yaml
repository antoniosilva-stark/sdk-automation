name: Validate Spec & Detect Breaking Changes

on:
  pull_request:
    paths:
      - 'apis/spec-v2.openapi.yaml'
      - 'apis/schemas/**'
      - 'tools/breaking-change-detector.py'

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install dependencies
        run: pip install -r requirements.txt && npm ci

      - name: Validate OpenAPI spec
        run: openapi-spec-validator apis/spec-v2.openapi.yaml

      - name: Lint spec resources
        run: python3 tools/lint-spec.py --quiet --require SplitProfile,Invoice,Transfer,Transaction

      - name: Detect breaking changes
        id: breaking-change
        run: python3 tools/breaking-change-detector.py

      - name: Comment on PR (if BC detected)
        if: failure() && steps.breaking-change.outcome == 'failure'
        uses: actions/github-script@v9
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '⚠️ Breaking changes detected! Please review and discuss with Tech-Lead (@elias) before proceeding.'
            })