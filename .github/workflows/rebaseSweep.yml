name: Rebase Sweep

run-name: "CI: Re-check open pull requests"

on:
    push:
        branches: [main]

permissions:
    contents: read
    actions: write

concurrency:
    group: rebase-sweep-${{ github.ref }}
    cancel-in-progress: true

jobs:
    sweep:
        runs-on: ubuntu-latest
        env:
            GH_TOKEN: ${{ github.token }}
            REPO: ${{ github.repository }}
            BASE: ${{ github.ref_name }}
        steps:
            - name: Re-run the guard on every open pull request
              run: |
                  set -euo pipefail
                  for number in $(gh pr list --repo "$REPO" --base "$BASE" --state open --json number --jq '.[].number'); do
                      headSha=$(gh pr view "$number" --repo "$REPO" --json headRefOid --jq .headRefOid)
                      runId=$(gh run list --repo "$REPO" --workflow "Enforce Rebase" --commit "$headSha" \
                          --limit 1 --json databaseId --jq '.[0].databaseId // empty')

                      if [ -z "$runId" ]; then
                          echo "::warning::no Enforce Rebase run found for pull request #$number"
                          continue
                      fi

                      echo "#$number -> rerunning $runId"
                      gh run rerun "$runId" --repo "$REPO" || echo "::warning::could not rerun $runId"
                  done
