name: Enforce Rebase

run-name: "CI: Enforce rebase before merge"

on:
    pull_request:
        types: [opened, synchronize, reopened, edited]

permissions:
    contents: read
    pull-requests: write

concurrency:
    group: enforce-rebase-${{ github.event.pull_request.number }}
    cancel-in-progress: true

jobs:
    rebase-status:
        runs-on: ubuntu-latest
        env:
            GH_TOKEN: ${{ github.token }}
            REPO: ${{ github.repository }}
            NUMBER: ${{ github.event.pull_request.number }}
            BASE: ${{ github.event.pull_request.base.ref }}
            HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        steps:
            - name: Checkout pull request head
              uses: actions/checkout@v5
              with:
                  ref: ${{ github.event.pull_request.head.sha }}
                  fetch-depth: 0

            - name: Checkout enforcement scripts from the base branch
              uses: actions/checkout@v5
              with:
                  ref: ${{ github.event.pull_request.base.ref }}
                  path: base
                  fetch-depth: 1
                  sparse-checkout: .github/scripts

            - name: Check rebase
              id: check
              run: |
                  set -euo pipefail
                  git fetch --no-tags origin "$BASE"

                  scripts=base/.github/scripts
                  if [ ! -x "$scripts/checkRebase.sh" ] || [ ! -x "$scripts/reportRebase.sh" ]; then
                      echo "::warning::branch $BASE carries no enforcement scripts; falling back to the pull request copy, which the pull request itself can alter"
                      scripts=.github/scripts
                  fi
                  echo "scripts=$scripts" >> "$GITHUB_OUTPUT"

                  rc=0
                  reason=$("$scripts/checkRebase.sh" \
                      "$(git rev-parse FETCH_HEAD)" "$HEAD_SHA" "origin/$BASE") || rc=$?

                  if [ "$rc" -gt 1 ]; then
                      echo "::error::checkRebase.sh failed unexpectedly (exit $rc)"
                      exit "$rc"
                  fi

                  ok=true
                  if [ "$rc" -eq 1 ]; then
                      ok=false
                  fi
                  if [ -z "$reason" ]; then
                      reason="verification produced no diagnosis (exit $rc)"
                  fi

                  echo "ok=$ok" >> "$GITHUB_OUTPUT"
                  echo "reason=$reason" >> "$GITHUB_OUTPUT"
                  echo "$reason"

            - name: Report on pull request
              env:
                  REASON: ${{ steps.check.outputs.reason }}
                  OK: ${{ steps.check.outputs.ok }}
              run: ${{ steps.check.outputs.scripts }}/reportRebase.sh
