name: Enforce Rebase

run-name: "CI: Enforce rebase before merge"

on:
    pull_request_target:
        types: [opened, synchronize, reopened, edited]
    issue_comment:
        types: [created]

permissions:
    contents: read
    pull-requests: write
    checks: write

concurrency:
    group: enforce-rebase-${{ github.event.pull_request.number || github.event.issue.number }}
    cancel-in-progress: true

jobs:
    evaluate:
        if: >
            github.event_name == 'pull_request_target' ||
            (github.event_name == 'issue_comment'
             && github.event.issue.pull_request
             && github.event.comment.user.login != 'github-actions[bot]'
             && contains(github.event.comment.body, '@rebased'))
        runs-on: ubuntu-latest
        env:
            GH_TOKEN: ${{ github.token }}
            REPO: ${{ github.repository }}
        steps:
            - name: Resolve pull request
              id: pr
              run: |
                  set -euo pipefail
                  number="${{ github.event.pull_request.number || github.event.issue.number }}"
                  gh pr view "$number" --repo "$REPO" --json number,baseRefName,headRefOid > pr.json
                  {
                      echo "number=$number"
                      echo "base=$(jq -r .baseRefName pr.json)"
                      echo "head=$(jq -r .headRefOid pr.json)"
                  } >> "$GITHUB_OUTPUT"

            - name: Checkout the base branch
              uses: actions/checkout@v5
              with:
                  ref: ${{ steps.pr.outputs.base }}
                  fetch-depth: 0

            - name: Check rebase
              id: check
              env:
                  BASE: ${{ steps.pr.outputs.base }}
                  HEAD_SHA: ${{ steps.pr.outputs.head }}
                  NUMBER: ${{ steps.pr.outputs.number }}
              run: |
                  set -euo pipefail
                  git fetch --no-tags origin "$BASE" "refs/pull/$NUMBER/head"

                  rc=0
                  reason=$(.github/scripts/checkRebase.sh \
                      "$(git rev-parse "origin/$BASE")" "$HEAD_SHA" "origin/$BASE") || rc=$?

                  ok=true
                  if [ "$rc" -ne 0 ]; then
                      ok=false
                  fi
                  if [ "$rc" -gt 1 ]; then
                      reason="evaluation failed (exit $rc)"
                  fi

                  echo "ok=$ok" >> "$GITHUB_OUTPUT"
                  echo "reason=$reason" >> "$GITHUB_OUTPUT"
                  echo "$reason"

            - name: Report on pull request
              env:
                  NUMBER: ${{ steps.pr.outputs.number }}
                  HEAD_SHA: ${{ steps.pr.outputs.head }}
                  BASE: ${{ steps.pr.outputs.base }}
                  REASON: ${{ steps.check.outputs.reason }}
                  OK: ${{ steps.check.outputs.ok }}
              run: .github/scripts/reportRebase.sh
