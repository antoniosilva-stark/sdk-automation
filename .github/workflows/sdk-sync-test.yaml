name: SDK Sync — Test (Personal Repo)

# Manual trigger: test workflow with personal repo (antoniosilva-stark/sdk-node)
on:
  workflow_dispatch: {}

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: pip install pyyaml openapi-spec-validator && npm ci

      - name: Validate OpenAPI spec
        run: openapi-spec-validator apis/spec-v2.openapi.yaml

      - name: Detect breaking changes
        run: python3 tools/breaking-change-detector.py

  generate:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'

      - run: npm ci

      - name: Generate SplitProfile.java
        run: |
          npx openapi-generator-cli generate \
            -i apis/spec-v2.openapi.yaml \
            -g java \
            --template-dir templates/java \
            --model-package com.starkbank \
            --api-package com.starkbank \
            --invoker-package com.starkbank \
            -o generated/sdk-java-temp \
            --global-property models=SplitProfile,supportingFiles=false,apiDocs=false,modelDocs=false,apiTests=false,modelTests=false

      - uses: actions/upload-artifact@v4
        with:
          name: split-profile-java
          path: generated/sdk-java-temp/src/main/java/com/starkbank/SplitProfile.java

  test:
    needs: generate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - uses: actions/download-artifact@v4
        with:
          name: split-profile-java
          path: generated/sdk-java-temp/src/main/java/com/starkbank

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - run: npm ci
      - run: npm test

  open-pr-test:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - uses: actions/download-artifact@v4
        with:
          name: split-profile-java
          path: generated/sdk-java-temp/src/main/java/com/starkbank

      - name: Check SDK_REPOS_TOKEN_TEST is configured
        id: check-token
        run: |
          if [ -z "${{ secrets.SDK_REPOS_TOKEN_TEST }}" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip — SDK_REPOS_TOKEN_TEST not configured
        if: steps.check-token.outputs.configured == 'false'
        run: |
          echo "SDK_REPOS_TOKEN_TEST não está configurado — pulando abertura de PR."
          echo "Configure o secret em Settings → Secrets and variables → Actions"

      - name: Checkout antoniosilva-stark/sdk-node (TEST REPO)
        if: steps.check-token.outputs.configured == 'true'
        uses: actions/checkout@v4
        with:
          repository: antoniosilva-stark/sdk-node
          token: ${{ secrets.SDK_REPOS_TOKEN_TEST }}
          path: sdk-test-target

      - name: Commit SplitProfile and push branch
        if: steps.check-token.outputs.configured == 'true'
        working-directory: sdk-test-target
        run: |
          mkdir -p src/main/java/com/starkbank
          cp ../generated/sdk-java-temp/src/main/java/com/starkbank/SplitProfile.java src/main/java/com/starkbank/SplitProfile.java
          git config user.name "sdk-automation-bot"
          git config user.email "sdk-automation@starkbank.com"
          git checkout -b sdk-automation/test-splitprofile
          git add src/main/java/com/starkbank/SplitProfile.java
          git commit -m "test: add SplitProfile for validation (sdk-automation test)"
          git push origin sdk-automation/test-splitprofile --force-with-lease

      - name: Open PR on antoniosilva-stark/sdk-node (TEST REPO)
        if: steps.check-token.outputs.configured == 'true'
        working-directory: sdk-test-target
        env:
          GH_TOKEN: ${{ secrets.SDK_REPOS_TOKEN_TEST }}
        run: |
          gh pr create \
            --title "test: add SplitProfile (sdk-automation validation)" \
            --body "🧪 Teste de validação do workflow sdk-automation.\n\nEste é um teste para validar que o pipeline consegue abrir PRs automaticamente. Após validação, fechar/deletar esta PR.\n\n**Gerado automaticamente** pelo workflow sdk-sync-test.yaml" \
            --base main \
            --head sdk-automation/test-splitprofile \
            || echo "PR já existe — atualizando..."
