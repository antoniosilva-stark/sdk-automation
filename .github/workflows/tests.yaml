name: Tests

on:
  pull_request:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'

      - run: pip install -r requirements.txt
      - run: npm ci

      - name: Resolve the SDK references at the pinned commits
        run: make clone-sdk-ref-pinned

      - name: Populate the Maven cache with the reference SDK dependencies
        # os testes de runtime do construtor leem este cache com `mvn -o`; mesmo goal, para o cache bater
        run: mvn -q -B --no-transfer-progress -f _references/sdk-java/pom.xml dependency:build-classpath -Dmdep.outputFile="$RUNNER_TEMP/classpath.txt"

      - name: Run tests
        env:
          # sem isto, gerador, javac ou SDK de referencia ausentes viram skip e o CI fica verde
          REQUIRE_TEST_DEPENDENCIES: '1'
        run: make test
