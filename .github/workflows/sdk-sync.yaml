name: SDK Sync

on:
  workflow_dispatch:
    inputs:
      resource:
        description: 'Recurso a gerar (ex: SplitProfile)'
        required: true
        default: SplitProfile
      language:
        description: 'Linguagem do SDK'
        type: choice
        options: [java]
        default: java
      owner:
        description: 'Owner do repositório alvo'
        required: true
        default: antoniosilva-stark
      repo:
        description: 'Repositório alvo'
        required: true
        default: sdk-java
      base:
        description: 'Branch base da PR'
        required: true
        default: master

run-name: "${{ inputs.resource }} (${{ inputs.language }}) → ${{ inputs.owner }}/${{ inputs.repo }}"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/setup-node@v4
        with:
          node-version: '18'

      - run: pip install -r requirements.txt
      - run: npm ci

      - name: Validate OpenAPI spec
        run: openapi-spec-validator apis/spec-v2.openapi.yaml

      - name: Detect breaking changes
        run: python3 tools/breaking-change-detector.py

      - name: Run tests
        run: make test

  sync:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/setup-node@v4
        with:
          node-version: '18'

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - run: pip install -r requirements.txt
      - run: npm ci

      - name: Require GitHub App credentials
        run: |
          if [ -z "${{ secrets.SDK_APP_ID }}" ] || [ -z "${{ secrets.SDK_APP_PRIVATE_KEY }}" ]; then
            echo "SDK_APP_ID e SDK_APP_PRIVATE_KEY precisam estar cadastrados."
            echo "Sem credencial este job reprova — nao passa verde sem fazer nada."
            exit 1
          fi

      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: ${{ secrets.SDK_APP_ID }}
          private-key: ${{ secrets.SDK_APP_PRIVATE_KEY }}
          owner: ${{ inputs.owner }}
          repositories: ${{ inputs.repo }}
          permission-contents: write
          permission-pull-requests: write

      - name: Checkout target SDK
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.owner }}/${{ inputs.repo }}
          ref: ${{ inputs.base }}
          token: ${{ steps.app-token.outputs.token }}
          path: target

      - name: Build and verify resource
        run: python3 tools/build-resource.py "${{ inputs.resource }}" --lang "${{ inputs.language }}" --into target

      - name: Commit into a dedicated branch
        id: commit
        working-directory: target
        run: |
          SLUG=$(python3 -c "import re,sys; print(re.sub(r'(?<!^)(?=[A-Z])','-',sys.argv[1]).lower())" "${{ inputs.resource }}")
          BRANCH="sdk-automation/$SLUG"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

          git config user.name "sdk-automation-bot"
          git config user.email "sdk-automation@starkbank.com"
          git checkout -b "$BRANCH"
          git add --all

          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Nada mudou — nenhum commit criado (idempotente)."
            exit 0
          fi

          git diff --cached --name-only
          git commit -m "Add ${{ inputs.resource }} resource"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Push branch
        if: steps.commit.outputs.changed == 'true'
        working-directory: target
        run: git push -u origin "${{ steps.commit.outputs.branch }}"

      - name: Open pull request
        if: steps.commit.outputs.changed == 'true'
        working-directory: target
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          gh pr create \
            --repo "${{ inputs.owner }}/${{ inputs.repo }}" \
            --title "Add ${{ inputs.resource }} resource" \
            --body "${{ inputs.resource }} gerado a partir de apis/spec-v2.openapi.yaml pelo sdk-automation. Verificado por lint-spec e assert-generated antes do commit. Revisar antes de merge." \
            --base "${{ inputs.base }}" \
            --head "${{ steps.commit.outputs.branch }}"