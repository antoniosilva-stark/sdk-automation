name: SDK Sync

on:
  workflow_dispatch:
    inputs:
      resource:
        description: 'Recurso a gerar (ex: SplitProfile)'
        required: true
        default: SplitProfile
      language:
        description: 'Linguagem do SDK — define o repositório alvo'
        type: choice
        options: [java, node]
        default: java

run-name: "${{ inputs.resource }} (${{ inputs.language }}) → ${{ github.repository_owner }}"

concurrency:
  group: sdk-sync-${{ inputs.language }}-${{ inputs.resource }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - run: pip install -r requirements.txt
      - run: npm ci

      - name: Validate OpenAPI spec
        run: openapi-spec-validator apis/spec-v2.openapi.yaml

      - name: Resolve the Python SDK reference
        run: make clone-sdk-ref

      - name: Run tests
        run: make test

  drift:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      blocked: ${{ steps.compare.outputs.blocked }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - run: pip install -r requirements.txt

      - name: Resolve the reference SDKs
        run: make clone-sdk-ref

      - name: Refresh the reference SDKs
        run: make refresh-sdk-ref

      - name: Compare the versioned schema with the current sdk-python
        id: compare
        env:
          RESOURCE: ${{ inputs.resource }}
        run: |
          CODE=0
          python3 tools/detect-drift.py "$RESOURCE" > drift.log 2>&1 || CODE=$?
          cat drift.log
          if [ "$CODE" = "1" ]; then
            echo "blocked=true" >> "$GITHUB_OUTPUT"
            echo "Recurso defasado: esta execucao nao gera $RESOURCE, abre PR de spec."
            exit 0
          fi
          if [ "$CODE" = "0" ] || [ "$CODE" = "3" ]; then
            echo "blocked=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Comparacao falhou (exit $CODE) — nao se gera sem saber se a spec esta atual."
          exit 1

      - name: Require GitHub App credentials
        if: steps.compare.outputs.blocked == 'true'
        env:
          APP_ID: ${{ secrets.SDK_APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.SDK_APP_PRIVATE_KEY }}
        run: |
          if [ -z "$APP_ID" ] || [ -z "$APP_PRIVATE_KEY" ]; then
            echo "SDK_APP_ID e SDK_APP_PRIVATE_KEY precisam estar cadastrados."
            exit 1
          fi

      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        if: steps.compare.outputs.blocked == 'true'
        with:
          app-id: ${{ secrets.SDK_APP_ID }}
          private-key: ${{ secrets.SDK_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write

      - name: Reapply the schema from the current sdk-python
        if: steps.compare.outputs.blocked == 'true'
        env:
          RESOURCE: ${{ inputs.resource }}
        run: python3 tools/apply-schema.py "$RESOURCE"

      - name: Open the spec update pull request
        if: steps.compare.outputs.blocked == 'true'
        env:
          RESOURCE: ${{ inputs.resource }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          BASE_BRANCH: ${{ github.ref_name }}
        run: |
          BRANCH="spec/refresh-$(python3 tools/place-generated.py "$RESOURCE" --slug)"
          git config user.name "sdk-automation[bot]"
          git config user.email "sdk-automation[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            git fetch --depth 1 origin "$BRANCH"
            git checkout -B "$BRANCH" "origin/$BRANCH"
          else
            git checkout -b "$BRANCH"
          fi
          git add apis/spec-v2.openapi.yaml apis/schemas
          if git diff --cached --quiet; then
            echo "Defasagem acusada mas nada a comitar — investigar o detector."
            exit 1
          fi
          git commit -m "Refresh the $RESOURCE schema from the current sdk-python"
          git push "https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY" "HEAD:refs/heads/$BRANCH"
          OPEN=$(gh pr list --head "$BRANCH" --state open --json number --jq 'length')
          if [ "$OPEN" -gt 0 ]; then
            echo "PR de spec ja aberta para $BRANCH — o push atualizou."
            exit 0
          fi
          gh pr create --base "$BASE_BRANCH" --head "$BRANCH" \
            --title "Refresh the $RESOURCE schema from the current sdk-python" \
            --body-file drift.log

  sync:
    needs: [validate, drift]
    if: needs.drift.outputs.blocked != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'

      - run: pip install -r requirements.txt
      - run: npm ci

      - name: Validate resource name
        id: resource
        env:
          RESOURCE: ${{ inputs.resource }}
        run: |
          SLUG=$(python3 tools/place-generated.py "$RESOURCE" --slug)
          echo "slug=$SLUG" >> "$GITHUB_OUTPUT"
          echo "Recurso validado, slug: $SLUG"

      - name: Resolve target repository
        id: target
        env:
          LANGUAGE: ${{ inputs.language }}
          OWNER: ${{ github.repository_owner }}
        run: |
          REPO=$(python3 tools/place-generated.py --lang "$LANGUAGE" --repo)
          echo "repo=$REPO" >> "$GITHUB_OUTPUT"
          echo "Alvo: $OWNER/$REPO"

      - name: Resolve the reference SDKs
        run: make clone-sdk-ref

      - name: Build and verify resource
        env:
          RESOURCE: ${{ inputs.resource }}
          LANGUAGE: ${{ inputs.language }}
        run: |
          mkdir -p staging
          python3 tools/build-resource.py "$RESOURCE" --lang "$LANGUAGE" --into staging

      - name: Require GitHub App credentials
        env:
          APP_ID: ${{ secrets.SDK_APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.SDK_APP_PRIVATE_KEY }}
        run: |
          if [ -z "$APP_ID" ] || [ -z "$APP_PRIVATE_KEY" ]; then
            echo "SDK_APP_ID e SDK_APP_PRIVATE_KEY precisam estar cadastrados."
            echo "Sem credencial este job reprova — nao passa verde sem fazer nada."
            exit 1
          fi

      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          app-id: ${{ secrets.SDK_APP_ID }}
          private-key: ${{ secrets.SDK_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ steps.target.outputs.repo }}
          permission-contents: write
          permission-pull-requests: write

      - name: Checkout target SDK
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ github.repository_owner }}/${{ steps.target.outputs.repo }}
          token: ${{ steps.app-token.outputs.token }}
          path: target

      - name: Resolve base branch
        id: base
        working-directory: target
        env:
          TARGET_REPO: ${{ steps.target.outputs.repo }}
        run: |
          BASE=$(git rev-parse --abbrev-ref HEAD)
          REMOTE_DEFAULT=$(git ls-remote --symref origin HEAD | awk '/^ref:/ {sub("refs/heads/","",$2); print $2; exit}')

          if [ -z "$REMOTE_DEFAULT" ]; then
            echo "nao foi possivel ler a branch default de $TARGET_REPO."
            exit 1
          fi
          if [ "$BASE" != "$REMOTE_DEFAULT" ]; then
            echo "checkout ficou em '$BASE' mas a default de $TARGET_REPO e '$REMOTE_DEFAULT'."
            exit 1
          fi

          echo "base=$BASE" >> "$GITHUB_OUTPUT"
          echo "Base: $BASE (default de $TARGET_REPO, confirmada no remoto)"

      - name: Prepare working branch
        id: branch
        working-directory: target
        env:
          SLUG: ${{ steps.resource.outputs.slug }}
        run: |
          BRANCH="sdk-automation/$SLUG"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

          git config user.name "sdk-automation-bot"
          git config user.email "sdk-automation@starkbank.com"

          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            git fetch --depth 1 origin "$BRANCH"
            git checkout -B "$BRANCH" "origin/$BRANCH"
            echo "Branch $BRANCH ja existe — comparando contra o que ja foi entregue."
          else
            git checkout -b "$BRANCH"
            echo "Branch $BRANCH e nova."
          fi


      - name: Copy verified artifacts into the target
        run: cp -R staging/. target/

      - name: Compile the target against the real SDK
        if: inputs.language == 'java'
        working-directory: target
        run: mvn -q -B --no-transfer-progress test-compile

      - name: Commit when the generated output differs
        id: commit
        working-directory: target
        env:
          RESOURCE: ${{ inputs.resource }}
          LANGUAGE: ${{ inputs.language }}
        run: |
          PATHS=$(python3 ../tools/place-generated.py "$RESOURCE" --lang "$LANGUAGE" --targets)
          while IFS= read -r target; do
            git add -- "$target"
          done <<< "$PATHS"

          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Gerado identico ao que ja esta na branch — nenhum commit criado."
            exit 0
          fi

          git diff --cached --name-only
          git commit -m "Add $RESOURCE resource"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Push branch
        if: steps.commit.outputs.changed == 'true'
        working-directory: target
        env:
          BRANCH: ${{ steps.branch.outputs.branch }}
        run: git push -u origin "$BRANCH"

      - name: Open pull request
        if: steps.commit.outputs.changed == 'true'
        working-directory: target
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          RESOURCE: ${{ inputs.resource }}
          OWNER: ${{ github.repository_owner }}
          TARGET_REPO: ${{ steps.target.outputs.repo }}
          BRANCH: ${{ steps.branch.outputs.branch }}
          BASE: ${{ steps.base.outputs.base }}
        run: |
          TARGET="$OWNER/$TARGET_REPO"
          OPEN=$(gh pr list --repo "$TARGET" --head "$BRANCH" --state open --json number --jq 'length')
          if [ "$OPEN" -gt 0 ]; then
            echo "PR ja aberta para $BRANCH — o push atualizou."
            exit 0
          fi

          gh pr create \
            --repo "$TARGET" \
            --title "Add $RESOURCE resource" \
            --body "$RESOURCE gerado a partir de apis/spec-v2.openapi.yaml pelo sdk-automation. Verificado por lint-spec e assert-generated antes do commit. Revisar antes de merge." \
            --base "$BASE" \
            --head "$BRANCH"