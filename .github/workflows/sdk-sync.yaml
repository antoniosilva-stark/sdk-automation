name: SDK Sync

on:
  workflow_dispatch:
    inputs:
      resource:
        description: 'Recurso a gerar (ex: SplitProfile)'
        required: true
        default: SplitProfile
      language:
        description: 'Linguagem do SDK — define o repositório alvo'
        type: choice
        options: [java, node]
        default: java

run-name: "${{ inputs.resource }} (${{ inputs.language }}) → ${{ github.repository_owner }}"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - uses: actions/setup-node@v7
        with:
          node-version: '18'

      - run: pip install -r requirements.txt
      - run: npm ci

      - name: Validate OpenAPI spec
        run: openapi-spec-validator apis/spec-v2.openapi.yaml

      - name: Detect breaking changes
        run: python3 tools/breaking-change-detector.py

      - name: Run tests
        run: make test

  sync:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - uses: actions/setup-node@v7
        with:
          node-version: '18'

      - uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'

      - run: pip install -r requirements.txt
      - run: npm ci

      - name: Resolve target repository
        id: target
        run: |
          REPO=$(python3 tools/place-generated.py --lang "${{ inputs.language }}" --repo)
          echo "repo=$REPO" >> "$GITHUB_OUTPUT"
          echo "Alvo: ${{ github.repository_owner }}/$REPO"

      - name: Require GitHub App credentials
        run: |
          if [ -z "${{ secrets.SDK_APP_ID }}" ] || [ -z "${{ secrets.SDK_APP_PRIVATE_KEY }}" ]; then
            echo "SDK_APP_ID e SDK_APP_PRIVATE_KEY precisam estar cadastrados."
            echo "Sem credencial este job reprova — nao passa verde sem fazer nada."
            exit 1
          fi

      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: ${{ secrets.SDK_APP_ID }}
          private-key: ${{ secrets.SDK_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ steps.target.outputs.repo }}
          permission-contents: write
          permission-pull-requests: write

      - name: Checkout target SDK
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository_owner }}/${{ steps.target.outputs.repo }}
          token: ${{ steps.app-token.outputs.token }}
          path: target

      - name: Resolve base branch
        id: base
        working-directory: target
        run: |
          BASE=$(git rev-parse --abbrev-ref HEAD)
          if [ "$BASE" = "HEAD" ]; then
            echo "HEAD desanexado — branch default do alvo indeterminada."
            exit 1
          fi
          echo "base=$BASE" >> "$GITHUB_OUTPUT"
          echo "Base: $BASE (branch default de ${{ steps.target.outputs.repo }})"

      - name: Prepare working branch
        id: branch
        working-directory: target
        run: |
          SLUG=$(python3 -c "import re,sys; print(re.sub(r'(?<!^)(?=[A-Z])','-',sys.argv[1]).lower())" "${{ inputs.resource }}")
          BRANCH="sdk-automation/$SLUG"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

          git config user.name "sdk-automation-bot"
          git config user.email "sdk-automation@starkbank.com"

          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            git fetch --depth 1 origin "$BRANCH"
            git checkout -B "$BRANCH" "origin/$BRANCH"
            echo "Branch $BRANCH ja existe — comparando contra o que ja foi entregue."
          else
            git checkout -b "$BRANCH"
            echo "Branch $BRANCH e nova."
          fi

      - name: Build and verify resource
        run: python3 tools/build-resource.py "${{ inputs.resource }}" --lang "${{ inputs.language }}" --into target

      - name: Commit when the generated output differs
        id: commit
        working-directory: target
        run: |
          git add --all

          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Gerado identico ao que ja esta na branch — nenhum commit criado."
            exit 0
          fi

          git diff --cached --name-only
          git commit -m "Add ${{ inputs.resource }} resource"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Push branch
        if: steps.commit.outputs.changed == 'true'
        working-directory: target
        run: git push -u origin "${{ steps.branch.outputs.branch }}"

      - name: Open pull request
        if: steps.commit.outputs.changed == 'true'
        working-directory: target
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          BRANCH="${{ steps.branch.outputs.branch }}"
          TARGET="${{ github.repository_owner }}/${{ steps.target.outputs.repo }}"
          if [ "$(gh pr list --repo "$TARGET" --head "$BRANCH" --state open --json number --jq 'length')" != "0" ]; then
            echo "PR ja aberta para $BRANCH — o push atualizou."
            exit 0
          fi

          gh pr create \
            --repo "$TARGET" \
            --title "Add ${{ inputs.resource }} resource" \
            --body "${{ inputs.resource }} gerado a partir de apis/spec-v2.openapi.yaml pelo sdk-automation. Verificado por lint-spec e assert-generated antes do commit. Revisar antes de merge." \
            --base "${{ steps.base.outputs.base }}" \
            --head "${{ steps.branch.outputs.branch }}"